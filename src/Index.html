function tugQueue(B, level){
  const items = [].concat(...kidLevels(level).map(l => bankItems(B, 'match', l).concat(bankItems(B, 'spot', l))));
  return { all: shuffle(items), i: 0 };
}
function tugNext(B, p){
  if (p.q.i >= p.q.all.length) { p.q.all = shuffle(p.q.all); p.q.i = 0; }
  const x = p.q.all[p.q.i++];
  p.cur = prepare(B, x.id.indexOf('s:') === 0 ? 'spot' : 'match', x);
}

async function tugStart(mate, cred){
  app.innerHTML = '<div class="spinner"></div>';
  let B;
  try { B = await loadBank(); } catch(e){ toast(e.message, true); return renderDash(); }
  const me = meAsPlayer(), guest = !mate;
  const two = [Object.assign({}, me, { pin: session.pin }), guest ? { name: 'Guest', level: me.level, label: me.label, color: '#94a3b8', pet: null, guest: true } : Object.assign({}, mate, { cred })];
  TW = { B, pos: 0, end: Date.now() + TUG_MS, over: false, quitAt: 0,
    p: two.map(x => Object.assign(x, { q: tugQueue(B, x.level), cur: null, frozen: 0, correct: 0, total: 0, missed: [], right: [] })) };
  TW.p.forEach(p => tugNext(B, p));
  G = null; stopDuel();
  app.innerHTML = `<div class="tugscreen" id="tug">
    <div class="tughalf top" data-half="1"></div>
    <div class="tugmid">
      <div class="tsc top">${faceOf(TW.p[1])}<b id="tsc1">0</b></div>
      <div class="rope" id="rope">${[-5, -2.5, 0, 2.5, 5].map(k => `<i class="mk ${k === 0 ? 'mid' : k === 5 ? 'end0' : k === -5 ? 'end1' : ''}" style="top:${50 + k * 9}%"></i>`).join('')}<span class="knot" id="knot"></span></div>
      <div class="tsc">${faceOf(TW.p[0])}<b id="tsc0">0</b></div>
      <button class="btn btn-glass icon-btn tquit" id="tquit">${icon('x')}</button>
      <span class="chip ttime" id="ttime">2:00</span>
    </div>
    <div class="tughalf" data-half="0"></div>
  </div>`;
  tugHalf(0); tugHalf(1);
  document.getElementById('tug').onclick = tugClick;
  TW.tick = setInterval(tugTick, 250);
}

function tugHalf(i){
  const p = TW.p[i], el = document.querySelector('.tughalf[data-half="' + i + '"]'), it = p.cur;
  if (!el || !it) return;
  const q = it.game === 'match'
    ? `<div class="glass qcard">${it.kind === 'pic' ? `<div class="qprompt">What is this?</div><img class="qpic" src="${picSrc(it.word)}" alt="">` : `<div class="qprompt">Which word matches?</div><div class="qbig">${esc(it.def)}</div>`}</div>
       <div class="opts">${it.options.map(o => `<button class="opt" data-p="${i}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="glass qcard"><div class="qprompt">One word is wrong. Tap it!</div>
       <div class="sentence">${it.tokens.map((t, k) => `<button class="tok" data-p="${i}" data-k="${k}">${esc(t)}</button>`).join('')}</div></div>`;
  el.innerHTML = `<div class="row-flex between"><span class="chip ${i ? 'orange' : 'purple'}">${esc(p.name)} · ${esc(p.label || '')}</span>
      <span class="sub" style="margin:0;font-size:12px">${p.correct} right</span></div>${q}<div class="tfreeze" hidden></div>`;
}

function tugClick(e){
  const t = e.target.closest('button');
  if (!t || !TW || TW.over) return;
  if (t.id === 'tquit') {
    if (TW.quitAt > Date.now() - 3000) return tugEnd(true);
    TW.quitAt = Date.now();
    return toast('Tap again to stop. Nothing is saved.');
  }
  const i = Number(t.dataset.p), p = TW.p[i];
  if (isNaN(i) || p.frozen > Date.now() || p.busy) return;
  const it = p.cur, ok = it.game === 'match' ? t.dataset.v === it.answer : Number(t.dataset.k) === it.wrong;
  p.total++; p.busy = true;
  (ok ? p.right : p.missed).push(it.id);
  const half = document.querySelector('.tughalf[data-half="' + i + '"]');
  if (it.game === 'match') half.querySelectorAll('.opt').forEach(b => { if (b.dataset.v === it.answer) b.classList.add('ok'); });
  else { const w = half.querySelector('.tok[data-k="' + it.wrong + '"]'); if (w) { w.classList.add('fixed'); w.innerHTML = '<s>' + esc(it.tokens[it.wrong]) + '</s>' + esc(fixedWord(it)); } }
  if (ok) {
    p.correct++;
    TW.pos += i === 0 ? 1 : -1;
    tugRope();
    try { navigator.vibrate && navigator.vibrate(30); } catch(err){}
    setTimeout(() => { p.busy = false; if (!TW || TW.over) return; tugNext(TW.B, p); tugHalf(i); }, 450);
  } else {
    t.classList.add('no', 'shake');
    p.frozen = Date.now() + TUG_FREEZE;
    const fz = half.querySelector('.tfreeze');
    if (fz) { fz.hidden = false; fz.innerHTML = `<b>${icon('snowflake', 'duotone')} Frozen</b><span>${it.game === 'match' ? esc(it.answer) : esc(fixedSentence(it))}</span>`; }
    setTimeout(() => { p.busy = false; if (!TW || TW.over) return; tugNext(TW.B, p); tugHalf(i); }, TUG_FREEZE);
  }
  if (Math.abs(TW.pos) >= TUG_STEPS) setTimeout(() => tugEnd(false), 500);
}

function tugRope(){
  const k = document.getElementById('knot');
  if (k) k.style.top = (50 + TW.pos * 9) + '%';
  ['tsc0', 'tsc1'].forEach((id, i) => { const el = document.getElementById(id); if (el) el.textContent = TW.p[i].correct; });
}

function tugTick(){
  if (!TW || TW.over) return clearInterval(TW && TW.tick);
  const left = Math.max(0, TW.end - Date.now()), s = Math.ceil(left / 1000), el = document.getElementById('ttime');
  if (el) el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  if (!left) tugEnd(false);
}

async function tugEnd(quit){
  if (!TW || TW.over) return;
  TW.over = true;
  clearInterval(TW.tick);
  if (quit) { TW = null; return renderDash(); }
  const [a, b] = TW.p, win = TW.pos > 0 ? a : TW.pos < 0 ? b : null;
  window.scrollTo(0, 0);
  app.innerHTML = `<div class="gscreen" id="tres"><div class="result" style="flex:none">
      <div class="podium">${win ? petPic(win, 'celebrate', 'big') + `<span class="crown">${icon('crown-simple', 'duotone')}</span>` + petPic(win === a ? b : a, 'happy', 'small flip')
        : petPic(a, 'happy', 'big') + petPic(b, 'happy', 'small flip')}</div>
      <div class="score2">${a.correct}<span>:</span>${b.correct}</div>
      <h2>${win ? esc(win.name) + ' pulled the rope!' : 'A draw! The knot stayed in the middle.'}</h2>
      <div class="saved wait" id="tsave"><span class="mini-spin"></span>Saving…</div>
    </div>
    ${tugLearn()}
    <div class="stack" style="gap:10px"><button class="btn btn-primary btn-block" data-act="again">${icon('arrows-clockwise')} Play again</button>
      <button class="btn btn-glass btn-block" data-act="home">Back</button></div></div>`;
  if (win && !win.guest) confetti();
  if (win) setTimeout(() => { const el = app.querySelector('.podium svg.big'); if (el) playMove(el, petMoveOf(el)); }, 450);
  const mate = b.guest ? null : b, res = p => ({ correct: p.correct, total: p.total, missed: p.missed.slice(-40), right: p.right.slice(-40) });
  document.getElementById('tres').onclick = e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.act === 'home') { TW = null; homeStale = true; return renderDash(); }
    if (t.dataset.act === 'again') { const m = mate ? { name: b.name, level: b.level, label: b.label, color: b.color, pet: b.pet } : null; TW = null; return tugStart(m, mate ? mate.cred : ''); }
  };
  const st = document.getElementById('tsave');
  // The save carries an id, so sending it again (from the queue) counts once.
  const job = { id: 'tug-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8), mate: mate ? mate.name : '', cred: mate ? mate.cred : '', a: res(a), b: mate ? res(b) : null };
  try {
    const r = await call('apiTugSave', session.name, session.pin, job.mate, job.cred, job.a, job.b, job.id);
    if (r.dash) { setDash(r.dash); checkGrowth(); }
    homeStale = true;
    if (st) { st.className = 'saved'; st.innerHTML = icon('check') + ' Saved · +' + r.xp + ' XP for ' + esc(a.name) + (mate ? ', +' + r.mateXp + ' XP for ' + esc(mate.name) : ''); }
  } catch(err){
    if (!err.app) { tugKeep(job); if (st) { st.className = 'saved err'; st.innerHTML = icon('wifi-slash') + ' Saved on this phone. It will sync when you are online.'; } }
    else if (st) { st.className = 'saved err'; st.innerHTML = icon('warning') + ' ' + esc(err.message); }
  }
}

// Tug of War results that could not be sent wait on the phone (with the friend's token, never her PIN) and
// go up on the next sign-in, refresh or when the phone is back online.
const tugKey = () => 'eq_tugq_' + (session ? session.name : '');
function tugKeep(job){ store.set(tugKey(), (store.get(tugKey()) || []).concat([job]).slice(-10)); }
async function flushTug(){
  if (!session) return;
  const q = store.get(tugKey()) || [];
  if (!q.length) return;
  store.del(tugKey());
  for (let i = 0; i < q.length; i++) {
    const j = q[i];
    try { await call('apiTugSave', session.name, session.pin, j.mate, j.cred, j.a, j.b, j.id); }
    catch(e){
      if (!e.app) { store.set(tugKey(), q.slice(i).concat(store.get(tugKey()) || [])); return; }
      // The friend's token ran out (2 days): at least this kid's result is saved.
      if (j.mate) try { await call('apiTugSave', session.name, session.pin, '', '', j.a, null, j.id + '-solo'); } catch(e2){}
    }
  }
}

      <span class="row-flex" style="gap:6px"><span class="chip">with ${esc(p.name)}</span><button class="btn btn-glass icon-btn duo-more" data-duomenu="${esc(v.id)}" title="More">${icon('dots-three')}</button></span></div>
    <div class="flamerow">
      ${petPic(me, duoMood(v.todayMe, both), 'duopet')}
      <div class="flame ${v.days ? '' : 'cold'}">${FLAME}<b>${v.days}</b><small>${v.days === 1 ? 'DAY' : 'DAYS'}</small></div>

    <div class="names"><span class="${v.todayMe ? 'ok' : 'wait'}">You · ${v.todayMe ? 'done today' : 'not yet'}</span><span class="${v.todayThem ? 'ok' : 'wait'}">${esc(p.name)} · ${v.todayThem ? 'done today' : 'not yet'}</span></div>
    <div class="weeks">
      <span></span>${v.week.map(w => `<span class="${w.date === dash.today ? 'now' : ''}">${['S', 'M', 'T', 'W', 'T', 'F', 'S'][dateOf(w.date).getDay()]}</span>`).join('')}
      <span class="rl">You</span>${v.week.map(w => cell(w, 'me')).join('')}

    </div>
    <div class="sub" style="color:#3b3f55;font-size:13px;margin:0;text-align:center">${status}</div>
    ${action}
    ${v.next ? `<div class="mile"><div class="row-flex" style="gap:6px">${icon('medal', 'duotone')} ${plural(v.next - v.days, 'day')} to the ${v.next}-day badge
        <span style="margin-left:auto">${v.milestones.map(m => `<span class="mbadge">${m}</span>`).join('')}</span></div>
      <div class="mbar"><i style="width:${Math.round((v.days - prev) / (v.next - prev) * 100)}%"></i></div></div>`
      : `<div class="mile"><div class="row-flex" style="gap:6px">${icon('crown-simple', 'duotone')} Every badge! ${v.milestones.map(m => `<span class="mbadge">${m}</span>`).join('')}</div></div>`}
  </div>`;
}

function questCard(v){
  const q = v.quest, p = v.partner;
  const pct = n => Math.min(100, Math.round(n / q.target * 100));
  const tile = q.kind === 'game' ? `<span class="tile ${GAME_INFO[q.game].tile}">${icon(GAME_INFO[q.game].icon, 'duotone')}</span>` : `<span class="tile t-fire">${icon('calendar-check', 'duotone')}</span>`;
  const bar = q.kind === 'game' ? `<i class="a" style="width:${pct(q.me)}%"></i><i class="b" style="width:${Math.max(0, Math.min(100 - pct(q.me), pct(q.them)))}%"></i>` : `<i class="ab" style="width:${pct(q.total)}%"></i>`;
  return `<div class="glass panel quest iri ${q.claimed ? 'won' : ''}">
    <div class="row-flex between"><span class="label">Team quest · this week</span><span class="chip ${q.claimed ? 'teal' : ''}">${q.claimed ? icon('check') + ' Done' : icon('clock') + ' ' + plural(q.daysLeft, 'day') + ' left'}</span></div>
    <div class="row-flex mt-s" style="gap:12px">${tile}<div style="min-width:0"><h2>${esc(q.title)}</h2><div class="sub" style="margin-top:2px;font-size:13px">${esc(q.goal)}</div></div></div>
    <div class="qnum mt-s">${Math.min(q.total, q.target)}<span>/ ${q.target}</span></div>
    <div class="qbar mt-s">${bar}</div>
    ${q.kind === 'game' ? `<div class="legend mt-s"><span>${faceOf(meAsPlayer())} You ${q.me}</span><span>${faceOf(p)} ${esc(p.name)} ${q.them}</span>${q.minEach ? `<small>Each of you: at least ${q.minEach}</small>` : ''}</div>`
      : `<div class="legend mt-s"><span>${icon('calendar-check')} Days you both practiced this week</span></div>`}
    <div class="soft qreward mt-s"><span class="tile t-star">${icon(q.claimed ? 'seal-check' : 'treasure-chest', 'duotone')}</span>
      <div><b>${q.claimed ? 'Quest complete!' : '+' + q.xp + ' XP each'}</b><small>${q.claimed ? '+' + q.xp + ' XP for both of you. A new quest on Sunday.' : 'for both of you when the team finishes'}</small></div></div>
    <div class="sub mt-s" style="font-size:12.5px">${esc(q.reason)}</div>
    ${q.kind === 'game' && !q.claimed ? `<button class="btn btn-primary btn-block mt-s" data-duogame="${q.game}">${icon('play')} Play ${GAME_INFO[q.game].name}</button>` : ''}
  </div>`;
}

function bindDuos(){
  ['duos', 'duobanner'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.onclick = async e => {
      const t = e.target.closest('button');
      if (!t || t.disabled) return;
      if (t.dataset.duogame) return startGame(t.dataset.duogame);
      if (t.dataset.duoplay) return startGame(warmupGame(dash));
      if (t.dataset.duofocus) { featuredDuo = t.dataset.duofocus; return refreshDuos(); }
      if (t.dataset.duomenu) return duoMenu(t.dataset.duomenu);
      const act = t.dataset.duonudge ? ['apiDuoNudge', t.dataset.duonudge] : t.dataset.duoyes ? ['apiDuoAnswer', t.dataset.duoyes, true]
        : t.dataset.duono ? ['apiDuoAnswer', t.dataset.duono, false] : null;
      if (!act) return;
      t.disabled = true;
      try {
        const D = await call(act[0], session.name, session.pin, ...act.slice(1));
        if (duelsHome) duelsHome.duos = D;
        toast(t.dataset.duonudge ? 'Nudge sent' : t.dataset.duoyes ? 'Your duo streak starts today!' : 'OK, maybe later');
        refreshDuos();
      } catch(err){ toast(err.message, true); t.disabled = false; }
    };
  });
}

function refreshDuos(){
  const a = document.getElementById('duobanner'), b = document.getElementById('duos');
  if (a) a.outerHTML = duoBanner();
  if (b) b.outerHTML = duoSection();
  bindDuos();
  checkDuoParty();
}

function duoMenu(id){
  const v = duelsHome.duos.active.find(x => x.id === id);
  if (!v) return;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet glass">
    <div class="row-flex between"><span class="label">Duo streak with ${esc(v.partner.name)}</span>
      <button class="btn btn-glass icon-btn" style="width:38px;height:38px;font-size:15px" id="x">${icon('x')}</button></div>
    <div class="sub mt-s">Together since ${longDate(v.since)}. ${v.milestones.length ? 'Badges: ' + v.milestones.join(', ') + ' days.' : ''}</div>
    <div class="jrules" style="--wb:#ea580c">
      <div>${icon('fire', 'duotone')}<span>The streak grows on every day you both practice (a task, a game or a duel).</span></div>
      <div>${icon('shield-check', 'duotone')}<span>One missed day a week is forgiven.</span></div>
      <div>${icon('medal', 'duotone')}<span>Badges at ${duelsHome.duos.milestones.join(', ')} days: +${duelsHome.duos.milestoneXp.join(', +')} XP for both.</span></div>
    </div>
    <button class="btn btn-glass btn-block mt" id="end" style="color:#be123c">Stop this duo streak</button>
  </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) close(); };
  ov.querySelector('#x').onclick = close;
  ov.querySelector('#end').onclick = async e => {
    const b = e.currentTarget;
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Tap again to stop it (' + plural(v.days, 'day') + ' will be gone)'; return; }
    b.disabled = true;
    try { duelsHome.duos = await call('apiDuoEnd', session.name, session.pin, id); close(); refreshDuos(); toast('Duo streak stopped'); }
    catch(err){ toast(err.message, true); b.disabled = false; }
  };
}

// Milestones and finished quests are celebrated once on each phone.
function checkDuoParty(){
  const D = duelsHome && duelsHome.duos;
  if (!D || !session || G || DU || document.querySelector('.evolve')) return;
  const key = 'eq_duoseen_' + session.name, seen = store.get(key) || {};
  for (const v of D.active) {
    const s = seen[v.id] || { m: 0, q: '' }, top = v.milestones.length ? Math.max(...v.milestones) : 0;
    if (!seen[v.id]) { seen[v.id] = { m: top, q: v.quest.claimed ? v.quest.week : '' }; continue; }
    if (top > s.m) { s.m = top; seen[v.id] = s; store.set(key, seen); return duoParty(v, 'streak', top); }
    if (v.quest.claimed && s.q !== v.quest.week) { s.q = v.quest.week; seen[v.id] = s; store.set(key, seen); return duoParty(v, 'quest'); }
  }
  store.set(key, seen);
}

function duoParty(v, kind, m){
  const ov = document.createElement('div');
  ov.className = 'evolve';
  const D = duelsHome.duos, xp = kind === 'quest' ? v.quest.xp : D.milestoneXp[D.milestones.indexOf(m)];
  ov.innerHTML = `<canvas></canvas><div class="flash"></div>
    <div style="position:relative;width:100%;max-width:360px">
      <div class="duoparty">${petPic(meAsPlayer(), 'celebrate', 'dp-a')}
        ${kind === 'quest' ? `<span class="dp-mid chest">${icon('treasure-chest', 'duotone')}</span>` : `<span class="dp-mid flame">${FLAME}<b>${m}</b></span>`}
        ${petPic(v.partner, 'celebrate', 'dp-b flip')}</div>
      <h1 class="reveal hide">${kind === 'quest' ? 'Team quest complete!' : m + '-day duo streak!'}</h1>
      <div class="sub reveal hide">${kind === 'quest' ? 'You and ' + esc(v.partner.name) + ' did it: ' + esc(v.quest.goal) + '.' : 'You and ' + esc(v.partner.name) + ' practiced together ' + m + ' days in a row.'}</div>
      <div class="unlock reveal hide"><span>+${xp} XP for you</span><span>+${xp} XP for ${esc(v.partner.name)}</span></div>
      <button class="btn btn-teal btn-block mt reveal hide" id="dp-ok">${kind === 'quest' ? 'Yay, team!' : 'Keep it going!'}</button>
    </div>`;
  document.body.appendChild(ov);
  const fl = ov.querySelector('.flash');
  [[350, () => fl.classList.add('go')], [550, () => confettiCanvas(ov.querySelector('canvas'))],
   [900, () => ov.querySelectorAll('.reveal').forEach(x => x.classList.remove('hide'))]].forEach(([ms, f]) => setTimeout(f, ms));
  ov.querySelector('#dp-ok').onclick = () => { ov.remove(); checkDuoParty(); };
}

// ---------- Journey ----------
// A world per level (names and rules come from the server). Every daily task is a station; the
// gate at the end of a world is a challenge with questions from the next level, from all four games.
const WORLD_LOOK = {
  a1: { icon: 'flower-tulip', c: ['#86efac', '#16a34a'], bg: ['#f0fdf4', '#bbf7d0'], deco: ['flower', 'sun', 'butterfly', 'plant', 'flower-tulip'] },
  a2: { icon: 'tree-evergreen', c: ['#5eead4', '#0f766e'], bg: ['#f0fdfa', '#99f6e4'], deco: ['tree-evergreen', 'leaf', 'tree', 'bird', 'campfire'] },
  b1: { icon: 'diamond', c: ['#c4b5fd', '#7c3aed'], bg: ['#f5f3ff', '#ddd6fe'], deco: ['diamond', 'sparkle', 'diamonds-four', 'star-four'] },
  'b1-b2': { icon: 'mountains', c: ['#7dd3fc', '#0369a1'], bg: ['#f0f9ff', '#bae6fd'], deco: ['mountains', 'snowflake', 'cloud', 'wind', 'flag-pennant'] },
  b2: { icon: 'cloud-sun', c: ['#f9a8d4', '#db2777'], bg: ['#fdf2f8', '#fbcfe8'], deco: ['cloud', 'balloon', 'bird', 'airplane-tilt', 'sun'] },
  c1: { icon: 'crown', c: ['#fcd34d', '#d97706'], bg: ['#fffbeb', '#fde68a'], deco: ['star', 'moon-stars', 'shooting-star', 'planet', 'sparkle'] }
};
const look = lv => WORLD_LOOK[lv] || WORLD_LOOK.a2;
const worldVars = lv => { const L = look(lv); return `--wa:${L.c[0]};--wb:${L.c[1]};--wbg1:${L.bg[0]};--wbg2:${L.bg[1]}`; };
const SEC_LABEL = { grammar: 'Grammar', vocabulary: 'Vocabulary', listening: 'Listening', reading: 'Reading', writing: 'Writing', 'use-of-english': 'Use of English' };
const dateOf = d => new Date(d + 'T12:00:00');
const dayLabel = d => ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][dateOf(d).getDay()] + ' ' + fmtDate(d);
const longDate = d => dateOf(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const levelLabel = id => (LEVELS.find(x => x[0] === id) || [id, id])[1];

function trackBar(j){
  const n = Math.min(j.stations, j.goal);
  return `<div class="jtrack" style="grid-template-columns:repeat(${j.goal},minmax(0,1fr))">${Array.from({ length: j.goal }, (_, k) => `<i class="${k < n ? 'on' : ''}"></i>`).join('')}</div>`;
}

function gateNote(j){
  const g = j.gate, left = j.goal - j.stations;
  if (g.state === 'open') return `The gate to ${esc(g.nextLabel)} is open!`;
  if (g.state === 'wait') return `The gate opens again on ${dayLabel(g.until)}`;
  if (g.state === 'top') return left > 0 ? `${plural(left, 'station')} to the summit` : 'You reached the summit!';
  // A high average opens the gate early.
  const early = j.avg != null && j.avg >= j.earlyAvg ? j.early - j.stations : left;
  return `${plural(Math.min(left, early), 'more station')} to the gate`;
}

// The world's name, number and progress: the top of the journey card and of the map.
const worldHead = j => `<div class="row-flex" style="gap:12px">
    <span class="tile wtile">${icon(look(j.level).icon, 'duotone')}</span>
    <div style="flex:1;min-width:0"><div class="label">World ${j.world} · Level ${esc(j.label)}</div><h2 style="font-size:19px;margin-top:1px">${esc(j.name)}</h2></div>
    <span class="chip">${Math.min(j.stations, j.goal)}/${j.goal}</span>
  </div>
  <div class="mt-s">${trackBar(j)}</div>`;

function journeyCard(d){
  const j = d.journey;
  if (!j) return '';
  return `<div class="jcard iri" id="jcard" style="${worldVars(j.level)}">
    ${worldHead(j)}
    <div class="row-flex between mt-s" style="gap:8px"><span class="sub" style="margin:0;font-size:13px;color:#3b3f55">${gateNote(j)}</span>
      <span class="jlink">Map ${icon('caret-right')}</span></div>
    ${j.gate.state === 'open' ? `<button class="btn btn-primary btn-block mt-s" id="gatego">${icon('castle-turret')} Take the gate challenge</button>` : ''}
  </div>`;
}

function bindJourney(){
  const jc = document.getElementById('jcard');
  if (jc) jc.onclick = e => e.target.closest('#gatego') ? gateIntro() : renderMap();
}

// The map: station 1 at the bottom, the gate on top, a winding road between them.
function renderMap(){
  G = null; speechStop();
  const d = dash, j = d && d.journey;
  if (!j) return renderDash();
  const g = j.gate, L = look(j.level), nl = look(g.next || j.level), N = j.goal, n = Math.min(j.stations, N);
  const W = 360, DY = 74, TOP = 146, BOT = 86, H = TOP + N * DY + BOT;
  const pts = Array.from({ length: N }, (_, k) => [180 + 100 * Math.sin(k * 0.62), H - BOT - k * DY]).concat([[180, TOP]]);
  const road = list => list.map(([x, y], k) => {
    if (!k) return `M${x} ${y}`;
    const [px, py] = list[k - 1], my = (py + y) / 2;
    return `C${px} ${my} ${x} ${my} ${x} ${y}`;
  }).join(' ');
  const at = (x, y) => `left:${(x / W * 100).toFixed(2)}%;top:${(y / H * 100).toFixed(3)}%`;
  // Decorations fill the bays of the road, on the side away from it.
  let deco = '';
  for (let k = 1; k < N; k += 2) {
    const [x, y] = pts[k], side = x < 180 ? 1 : -1;
    deco += `<i class="ph-duotone ph-${L.deco[(k >> 1) % L.deco.length]} mdeco" style="${at(x + side * (118 + k * 29 % 36), y + 18)};font-size:${26 + k * 17 % 20}px;transform:translate(-50%,-50%) rotate(${k * 41 % 40 - 20}deg)"></i>`;
  }
  const nodes = pts.slice(0, N).map(([x, y], k) => {
    if (k < n) {
      const t = j.done[k] || {};
      return `<button class="mnode done" style="${at(x, y)}" data-st="${k}" aria-label="Station ${k + 1}">${icon((SEC[t.s] || SEC.grammar)[0], 'duotone')}${t.p >= 80 ? `<span class="mstar">${icon('star')}</span>` : ''}</button>`;
    }
    return k === n ? `<button class="mnode cur" style="${at(x, y)}" id="mcur">${k + 1}</button>` : `<div class="mnode" style="${at(x, y)}">${k + 1}</div>`;
  }).join('');
  // The pet stands next to its station, on the roomier side (or beside the gate).
  const [hx, hy] = pts[n], petAt = n >= N ? [hx + 84, hy + 6] : [hx + (hx < 180 ? 62 : -62), hy - 12];
  const gateIcon = { open: 'castle-turret', wait: 'hourglass-medium', top: 'crown', locked: 'lock-key' }[g.state];
  const gateTag = g.state === 'open' ? 'The gate is open' : g.state === 'wait' ? 'Opens ' + dayLabel(g.until)
    : g.state === 'top' ? (j.stations >= N ? 'Summit reached!' : 'The summit') : 'Gate to ' + g.nextLabel;
  const rules = [['footprints', 'Every daily task you finish is one station.']].concat(g.next ? [
    ['castle-turret', `${N} stations open the gate to ${esc(g.nextLabel)}. With an average of ${j.earlyAvg}% or more, ${j.early} are enough${j.avg != null ? ` (yours: ${j.avg}%)` : ''}.`],
    ['seal-check', `At the gate: ${g.items} questions from level ${esc(g.nextLabel)}. Get ${g.need} right to reach ${esc(g.nextName)}.`]
  ] : [['crown', `This is the last world. ${N} stations take you to the summit.`]]);
  if (g.state === 'wait' && g.last) rules.push(['hourglass-medium', `Last try: ${g.last.correct}/${g.last.total}. The gate opens again on ${dayLabel(g.until)}, and the questions you missed come back in your games.`]);
  app.innerHTML = `<div class="stack" style="${worldVars(j.level)}">
    <div class="mapbar">
      <div class="row-flex" style="gap:10px"><button class="btn btn-glass icon-btn" id="back" title="Back">${icon('arrow-left')}</button>
        <div class="wstrip">${j.worlds.map((w, i) => {
          const st = i < j.world - 1 ? 'done' : i === j.world - 1 ? 'cur' : '';
          return `<div class="wdot ${st}" style="${worldVars(w.level)}" title="${esc(w.name)}"><span class="wball">${icon(st === 'done' ? 'check' : st ? look(w.level).icon : 'lock-simple', st === 'done' ? 'bold' : 'duotone')}</span>${esc(w.label)}</div>`;
        }).join('')}</div></div>
      <div class="jcard" style="cursor:default;padding:12px 14px 14px">
        ${worldHead(j)}
        <div class="sub mt-s" style="font-size:13px;color:#3b3f55">${gateNote(j)}</div>
        ${g.state === 'open' ? `<button class="btn btn-primary btn-block mt-s" id="gatego" style="height:46px">${icon('castle-turret')} Take the gate challenge</button>` : ''}
      </div>
    </div>
    <div class="glass panel" style="padding:16px 18px"><div class="jrules" style="margin:0">${rules.map(([ic, t]) => `<div>${icon(ic, 'duotone')}<span>${t}</span></div>`).join('')}</div></div>
    <div class="map" style="aspect-ratio:${W} / ${H}">
      <svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
        <defs><linearGradient id="wroad" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${L.c[0]}"/><stop offset="1" stop-color="${L.c[1]}"/></linearGradient></defs>
        <path d="${road(pts)}" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="16" stroke-linecap="round"/>
        <path d="${road(pts)}" fill="none" stroke="${L.c[1]}" stroke-opacity=".3" stroke-width="3" stroke-dasharray="1 11" stroke-linecap="round"/>
        ${n ? `<path d="${road(pts.slice(0, n + 1))}" fill="none" stroke="url(#wroad)" stroke-width="16" stroke-linecap="round"/>` : ''}
      </svg>
      ${deco}
      <span class="chip mtag" style="${at(180, 36)}">${icon(g.next ? 'lock-simple' : 'sparkle')} ${g.next ? 'Next: ' + esc(g.nextName) + ' · ' + esc(g.nextLabel) : 'The top of English Quest'}</span>
      <span class="chip mtag ${g.state === 'open' ? 'purple' : ''}" style="${at(180, 80)}">${esc(gateTag)}</span>
      <button class="mgate ${g.state}" id="mgate" style="${at(180, TOP)};--na:${nl.c[0]};--nb:${nl.c[1]}" aria-label="Gate">${icon(gateIcon, 'duotone')}</button>
      ${nodes}
      <span class="chip mtag" style="${at(pts[0][0], pts[0][1] + 40)}">${icon('flag-banner')} Start</span>
      ${d.pet ? `${petArt(d.pet, g.state === 'open' ? 'celebrate' : 'happy', 'mpet', { style: at(petAt[0], petAt[1]) })}` : ''}
    </div>
  </div>`;
  const gate = () => {
    if (g.state === 'open') return gateIntro();
    toast(g.state === 'wait' ? 'The gate opens again on ' + dayLabel(g.until)
      : g.state === 'top' ? (j.stations >= N ? 'You reached the summit of English Quest!' : 'The summit of English Quest. Keep going!') : gateNote(j));
  };
  document.getElementById('back').onclick = renderDash;
  document.getElementById('mgate').onclick = gate;
  const go = document.getElementById('gatego');
  if (go) go.onclick = gate;
  const cur = document.getElementById('mcur');
  if (cur) cur.onclick = () => toast('Finish today\'s task to reach station ' + (n + 1));
  app.querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
    const t = j.done[b.dataset.st] || {};
    toast(`Station ${Number(b.dataset.st) + 1} · ${SEC_LABEL[t.s] || 'Task'}${t.p != null ? ' · ' + t.p + '%' : ''}`);
  });
  // Bring the kid's station (or the gate) to the middle of the space under the fixed top part.
  const here = cur || document.getElementById('mgate'), bar = app.querySelector('.mapbar');
  window.scrollTo(0, 0);
  setTimeout(() => {
    const top = bar.offsetHeight, r = here.getBoundingClientRect();
    window.scrollTo(0, Math.max(0, window.scrollY + r.top + r.height / 2 - top - (window.innerHeight - top) / 2));
  }, 30);
  checkGrowth();
}

function gateIntro(){
  const j = dash.journey, g = j.gate, nl = look(g.next);
  if (g.state !== 'open') return renderMap();
  window.scrollTo(0, 0);
  app.innerHTML = `<div class="gscreen" style="--na:${nl.c[0]};--nb:${nl.c[1]}">

// Questions from the next level (a B1+ gate mixes B1 and B2), new ones first.
const GATE_MIX = [['match', 4], ['listen', 4], ['spot', 4], ['build', 3]];
async function startGate(){
  const j = dash && dash.journey;
  if (!j || j.gate.state !== 'open') return renderMap();
  app.innerHTML = '<div class="spinner"></div>';
  let B;
  try { B = await loadBank(); }
  catch(e){ toast(e.message, true); return renderMap(); }
  const seen = store.get(seenKey()) || [], items = [];
  GATE_MIX.forEach(([game, k]) => {
    const pool = shuffle([].concat(...kidLevels(j.gate.next).map(l => bankItems(B, game, l))).filter(x => x.kind !== 'pic'));
    pool.filter(x => seen.indexOf(x.id) < 0).concat(pool.filter(x => seen.indexOf(x.id) >= 0)).slice(0, k).forEach(x => items.push(prepare(B, game, x)));
  });
  if (items.length !== j.gate.items) { toast('Could not prepare the challenge. Try again later.', true); return renderMap(); }
  G = { gate: true, items, i: 0, res: [], missed: [], right: [], built: [], locked: false };
  window.scrollTo(0, 0);
  renderItem();
}

function finishGate(){
  const R = { correct: G.res.filter(Boolean).length, total: G.res.length, missed: G.missed.slice(), right: G.right.slice() };
  store.set(seenKey(), (store.get(seenKey()) || []).concat(G.items.map(x => x.id)).slice(-60));
  G = null;
  saveGate(R);
}

// The certificate as a 1080 x 1080 picture in the new world's colours.
async function certBlob(){
  const j = dash.journey, p = dash.pet, L = look(j.level), S = 1080;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const c = cv.getContext('2d');
  try { await document.fonts.load('800 80px "Plus Jakarta Sans"'); } catch(e){}
  const font = (w, s) => `${w} ${s}px "Plus Jakarta Sans", system-ui, sans-serif`;
  const text = (t, w, s, color, y, max) => {
    c.font = font(w, s);
    const m = c.measureText(t).width;
    if (m > max) c.font = font(w, Math.floor(s * max / m));
    c.fillStyle = color; c.fillText(t, S / 2, y);
  };
  let g = c.createLinearGradient(0, 0, S, S);
  g.addColorStop(0, L.bg[0]); g.addColorStop(1, L.bg[1]);
  c.fillStyle = g; c.fillRect(0, 0, S, S);
  [[170, 150, 440, L.c[0]], [940, 920, 480, L.c[0]], [960, 120, 320, '#c7d2fe']].forEach(([x, y, r, col]) => {
    const rg = c.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, col + 'aa'); rg.addColorStop(1, col + '00');
    c.fillStyle = rg; c.fillRect(0, 0, S, S);
  });
  c.beginPath();
  if (c.roundRect) c.roundRect(80, 80, 920, 920, 64); else c.rect(80, 80, 920, 920);
  c.fillStyle = 'rgba(255,255,255,.62)'; c.fill();
  c.lineWidth = 4; c.strokeStyle = 'rgba(255,255,255,.95)'; c.stroke();
  c.textAlign = 'center';
  text('CERTIFICATE  ·  ENGLISH QUEST', 800, 30, '#6b7083', 180, 800);
  const bx = p ? 400 : S / 2, by = 420;
  g = c.createLinearGradient(bx - 150, by - 150, bx + 150, by + 150);
  g.addColorStop(0, L.c[0]); g.addColorStop(1, L.c[1]);
  c.beginPath(); c.arc(bx, by, 150, 0, Math.PI * 2);
  c.fillStyle = g; c.fill(); c.lineWidth = 10; c.strokeStyle = 'rgba(255,255,255,.85)'; c.stroke();
  c.font = font(800, j.label.length > 2 ? 104 : 128); c.fillStyle = '#fff'; c.textBaseline = 'middle';
  c.fillText(j.label, bx, by + 6);
  c.textBaseline = 'alphabetic';
  // A little lower and smaller than the badge, so a tall hat stays clear of the title.
  if (p) { try { await drawPet(c, p, 'celebrate', 560, 270, 340); } catch(e){} }
  text(dash.girl.name, 800, 92, '#1c1e2b', 720, 840);
  text('reached level ' + j.label, 800, 56, L.c[1], 800, 840);
  text('World ' + j.world + ' unlocked: ' + j.name, 600, 36, '#3b3f55', 868, 840);
  text(longDate(dash.today), 600, 30, '#6b7083', 925, 840);
  return new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('No picture')), 'image/jpeg', .92));
}

// ---------- Opening animation ----------
// The ten pets pop in around a glass portal, orbit it and do a wave; on a phone where a kid is
// remembered, her own pet then jumps into the middle and says hi. A tap skips it; with reduced
// motion it is a short still picture. The app loads underneath meanwhile. Later opens of the same day play the
// same show faster (about 1.2 s).
function splashScreen(quick){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const saved = store.get('eq_auth'), mine = saved ? store.get('eq_pet_' + saved.name) : null;
  const me = mine && PET_ART[mine.id] ? mine : null;
  const el = document.createElement('div');
  el.className = 'splash' + (reduce ? ' still' : '') + (quick ? ' quick' : '');
  el.innerHTML = `<div class="splash-stage">
      <div class="orbit">${PETS.map(([id], i) => `<div class="slot" style="--a:${Math.round(i * 360 / PETS.length - 90)}deg">
        <div class="up"><div class="pop" style="--d:${quick ? 60 + i * 32 : 150 + i * 75}ms"><img src="${petSrc(id, 1, 'happy')}" data-id="${id}" alt="" onload="this.classList.add('ok')"></div></div></div>`).join('')}</div>
      <div class="portal"><div class="portal-in">
        ${me ? petArt(me, 'celebrate', 'me') : ''}
        <div class="ptitle">English Quest</div><div class="psub">10 minutes a day</div></div></div>
      ${Array.from({ length: quick ? 8 : 14 }, () => `<i class="spark" style="--x:${Math.round(Math.random() * 100)}%;--y:${Math.round(Math.random() * 100)}%;--t:${(Math.random() * (quick ? .8 : 1.7)).toFixed(2)}s"></i>`).join('')}
    </div>`;
  document.body.appendChild(el);
  document.body.classList.add('splashing');
  let gone = false, minDone;
  const done = new Promise(r => { minDone = r; });
  const later = (ms, f) => setTimeout(() => { if (!gone) f(); }, ms);
  // The wave: each pet cheers and hops in turn. Then the kid's pet says hi (or the title shines).
  const wave = (from, step, hold) => el.querySelectorAll('.orbit img').forEach((img, i) => later(from + i * step, () => {
    img.src = petSrc(img.dataset.id, 1, 'celebrate');
    img.classList.add('hop');
    later(hold, () => { img.src = petSrc(img.dataset.id, 1, 'happy'); img.classList.remove('hop'); });
  }));
  const hello = () => {
    if (!me) return el.classList.add('shine');
    el.classList.add('hello');
    el.querySelector('.ptitle').textContent = 'Hi ' + saved.name + '!';
    el.querySelector('.psub').textContent = 'Ready to play?';
  };
  if (reduce) later(700, minDone);
  else {
    PETS.forEach(([id]) => { new Image().src = petSrc(id, 1, 'celebrate'); });
    // Later opens of the same day: the same show in about 1.2 s.
    if (quick) { later(380, hello); wave(560, 40, 380); setTimeout(minDone, 1150); }
    else { wave(1350, 60, 520); later(1950, hello); setTimeout(minDone, me ? 2800 : 2450); }
  }
  const close = () => {
    if (gone) return;
    gone = true;
    el.classList.add('out');
    document.body.classList.remove('splashing');
    setTimeout(() => el.remove(), 500);
  };
  el.onclick = close;
  return { done, close };
}

// Starts the app behind the opening animation and lifts it when both are ready (at most 9 s). The full

  await Promise.race([Promise.all([s.done, ready]), new Promise(r => setTimeout(r, 9000))]);
  s.close();
  try { performance.mark('eq-open'); } catch(e){}
}

// Local first: a remembered kid's last dashboard stays on the phone. The next open shows it at once and
// brings fresh data in the background (the refresh button spins meanwhile, and gets a dot if that fails).
const dashKey = name => 'eq_dash_' + name;
let dashFresh = 0, dashSync = null, syncNow = '';
function setDash(d){
  if (!d) return;
  dash = d;
  dashFresh = Date.now();
  if (session && session.keep) store.set(dashKey(session.name), d);
}
const dashSig = d => JSON.stringify(d, (k, v) => k === 'now' ? undefined : v);
const onDashboard = () => !G && !DU && !TW && !!document.getElementById('petimg');
function syncState(s){
  syncNow = s;
  const b = document.getElementById('refresh');
  if (!b) return;
  b.classList.toggle('spin', s === 'busy');
  b.classList.toggle('off', s === 'off');
  b.title = s === 'busy' ? 'Updating…' : s === 'off' ? 'Could not update. Showing what is saved on this phone.' : 'Refresh';
}
function refreshDash(manual){
  if (!session) return Promise.resolve();
  if (dashSync) return dashSync;
  const me = session.name;
  syncState('busy');
  dashSync = (async () => {
    try {
      const d = await call('apiDashboard', session.name, session.pin);
      if (!session || session.name !== me) return;
      const changed = dashSig(d) !== dashSig(dash);
      setDash(d);
      syncState('');
      flushPending(); flushTug();
      if (changed && onDashboard()) { const y = window.scrollY; renderDash(); window.scrollTo(0, y); }
    } catch(e){
      // The PIN was changed in the sheet: this phone signs in again.
      if (e.app && /Wrong PIN/.test(e.message)) { toast('Please sign in again', true); return signOut(); }
      syncState('off');
      if (manual) toast(e.message, true);
    } finally { dashSync = null; }
  })();
  return dashSync;
}
function signOut(){
  if (session) store.del(dashKey(session.name));
  store.del('eq_auth');
  session = null; dash = null; syncNow = ''; SHOP = null;
  loadHome();
}

async function login(name, pin, silent, remember){
  try {
    const d = await call('apiDashboard', name, pin);
    session = { name, pin, keep: !!(remember || silent) };
    SHOP = null;
    if (remember) store.set('eq_auth', { name, pin });
    setDash(d); syncNow = ''; renderDash();
    flushPending(); flushTug();
    if (pendingDuel && !d.levelTest) { const c = pendingDuel; pendingDuel = null; openDuel(c); }
    return true;
  } catch(e){
    if (silent) {
      if (!e.app) { offlineStart(); return true; }
      if (/Wrong PIN/.test(e.message)) store.del('eq_auth'); else toast(e.message, true);
    }
    else toast(e.message.includes('PIN') ? 'Wrong PIN, try again' : e.message, true);
    return false;
  }
}

// No connection on an open without a saved dashboard: the kid stays remembered, a tap tries again.
function offlineStart(){
  app.innerHTML = `<div class="glass panel" style="text-align:center;display:grid;gap:12px;justify-items:center">
    <span class="gate-hero" style="--na:#c7d2fe;--nb:#818cf8">${icon('wifi-slash', 'duotone')}</span>
    <h2>No connection</h2><div class="sub" style="margin:0">Check the internet and try again.</div>
    <button class="btn btn-primary btn-block" id="startagain">${icon('arrows-clockwise')} Try again</button></div>`;
  document.getElementById('startagain').onclick = () => { loading(); start(); };
}

// ---------- Dashboard ----------
function ring(done, total){
  const r = 62, c = 2 * Math.PI * r, p = total ? done / total : 0;
  return `<div class="ring-wrap glass">
    <svg viewBox="0 0 150 150"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b8ffb"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient></defs>
      <circle cx="75" cy="75" r="${r}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="10"/>
      <circle cx="75" cy="75" r="${r}" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" style="transition:stroke-dashoffset 1s"/></svg>
    <div class="ring-center soft"><div><div class="ring-num">${done}/${total}</div><div class="ring-cap">THIS WEEK</div></div></div>
  </div>`;
}

function scoreText(d){
  if (d.section === 'level') return d.levelResult ? 'Level ' + d.levelResult : 'Done';
  return (d.correct !== '' && d.total !== '') ? d.correct + '/' + d.total : (d.percent !== '' ? d.percent + '%' : '');
}

      <div class="row-flex between"><h2>This week</h2><span class="chip">${s.weekDone} done</span></div>

// ---------- Reminders (Web Push) ----------
let pushKey = null, pushSynced = false;
function keyBytes(b64){
  const s = atob(b64.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - b64.length % 4) % 4));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}
async function pushState(){
  if (IN_APPS_SCRIPT || !pushKey || !('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
    return isIos() && !isStandalone() && !IN_APPS_SCRIPT ? { state: 'install' } : { state: 'unsupported' };
  }
  if (Notification.permission === 'denied') return { state: 'denied' };
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  return sub && Notification.permission === 'granted' ? { state: 'on', sub } : { state: 'off' };
}
async function renderPushCard(){
  const el = document.getElementById('pushcard');
  if (!el || !session) return;
  let st;
  try { st = await pushState(); } catch(e){ return; }
  if (st.state === 'on') {
    // Make sure the server knows this device belongs to the kid now signed in (once per app start).
    if (!pushSynced) { pushSynced = true; call('apiPushSubscribe', session.name, session.pin, st.sub.endpoint, navigator.userAgent, false).catch(() => {}); }
    return;
  }
  if (st.state === 'install') {
    el.innerHTML = `<div class="soft stat" style="padding:14px 16px"><span class="tile sm t-fire">${icon('bell-ringing', 'duotone')}</span>
      <div class="sub" style="margin:0;font-size:13px">Want a daily reminder? Install the app first: tap Share, then <b>Add to Home Screen</b>, and open it from there.</div></div>`;
    return;
  }
  if (st.state !== 'off') return;
  el.innerHTML = `<div class="glass panel">
    <div class="row-flex" style="gap:12px"><span class="tile t-fire">${icon('bell-ringing', 'duotone')}</span>
      <div><h2>Daily reminder</h2><div class="sub" style="margin-top:2px;font-size:13px">A nudge on your phone if you haven't practiced yet</div></div></div>
    <button class="btn btn-primary btn-block mt" id="pushon">${icon('bell')} Turn on reminders</button>
  </div>`;
  document.getElementById('pushon').onclick = async e => {
    const btn = e.currentTarget;
    btn.disabled = true; btn.innerHTML = '<span class="mini-spin"></span>Turning on…';
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { el.innerHTML = ''; toast('Notifications are blocked', true); return; }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(pushKey) });
      await call('apiPushSubscribe', session.name, session.pin, sub.endpoint, navigator.userAgent, true);
      pushSynced = true;
      el.innerHTML = `<div class="soft stat" style="padding:14px 16px"><span class="tile sm t-listen">${icon('check', 'bold')}</span>
        <div class="sub" style="margin:0;font-size:13px">Reminders are on — you should get a test notification now.</div></div>`;
    } catch(err){
      toast(err.message || 'Could not turn on reminders', true);
      btn.disabled = false; btn.innerHTML = icon('bell') + ' Turn on reminders';
    }
  };
}

function todayCard(t){
  return `<div class="today iri">
    <div class="row-flex between"><span class="label" style="color:#3b3f55">Today · ${t.day}</span>
      ${t.level ? `<span class="chip">${esc(t.level)}</span>` : ''}</div>
    <div class="row-flex mt-s" style="gap:10px">${tile(t.section)}<b>${esc(t.label)}</b></div>
    <h2>${esc(t.title)}</h2>
    ${t.section === 'level' ? '<div class="sub" style="color:#3b3f55">Takes about 20–30 minutes. At the end you will see your level — remember it!</div>' : ''}
    ${t.done ? `<div class="done-badge"><div class="big-check">${BIG_CHECK}</div>
        <div><b style="font-size:20px">${esc(scoreText(t))}</b><div class="sub" style="color:#3b3f55">+${esc(t.points)} points · great job!</div></div></div>`
      : `<div class="btns"><a class="btn btn-teal" href="${esc(t.url)}" target="_blank" rel="noopener">Open ${icon('arrow-up-right')}</a>
         <button class="btn btn-primary" data-log="${t.date}">I'm done ${icon('check')}</button></div>`}
  </div>`;
}

function taskRow(w){
  const state = w.done ? 'done' : w.isFuture ? 'future' : w.isToday ? 'today' : 'missed';
  const box = w.done ? CHECK : w.isFuture ? icon('lock-simple') : '';
  const end = w.done ? `<span class="chip purple">${esc(scoreText(w))}</span>`
    : state === 'missed' ? ((dash && dash.stats && (dash.stats.saved || []).indexOf(w.date) >= 0) ? `<span class="chip teal" title="Saved by your Streak Shield">${icon('shield-check')} Saved</span>` : '') + '<span class="chip red">Catch up</span>'
    : state === 'today' ? '<span class="chip teal">Today</span>' : '';
  const click = (state === 'missed' || state === 'today') ? `data-log="${w.date}"` : '';
  return `<div class="soft task ${state} ${click ? 'clickable' : ''}" ${click}>
    <div class="box">${box}</div>
    ${tile(w.section, true)}
    <div class="task-main"><div class="task-top">${w.day} · ${esc(w.label)}</div>
      <div class="task-title">${w.title ? esc(w.title) : 'Coming soon'}</div></div>
    ${end}
  </div>`;
}

// ---------- Log result sheet ----------
function openSheet(w){
  if (!w) return;
  const isLevel = w.section === 'level';
  let level = null;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet glass">
    <div class="row-flex between"><span class="row-flex" style="gap:10px">${tile(w.section, true)}<span class="label">${isLevel ? esc(w.label) : w.day + ' ' + fmtDate(w.date) + ' · ' + esc(w.label)}</span></span>
      <button class="btn btn-glass icon-btn" style="width:38px;height:38px;font-size:15px" id="x">${icon('x')}</button></div>
    <h2 style="margin-top:8px;font-size:20px">${esc(w.title)}</h2>
    <a class="btn btn-teal btn-block mt" href="${esc(w.url)}" target="_blank" rel="noopener">Open exercise ${icon('arrow-up-right')}</a>
    <div class="label mt">${isLevel ? 'Which level did you get?' : 'Your score'}</div>
    ${isLevel ? `<div class="levels">${LEVELS.map(([k,l]) => `<button class="btn btn-glass" data-lv="${k}">${l}</button>`).join('')}</div>`
      : `<div class="score-grid">
          <div class="field"><label>Correct</label><input id="c" type="number" inputmode="numeric" min="0" placeholder="8"></div>
          <div class="slash">/</div>
          <div class="field"><label>Out of</label><input id="t" type="number" inputmode="numeric" min="1" placeholder="10"></div>
        </div>`}
    <button class="btn btn-primary btn-block mt" id="save">Save</button>
  </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) close(); };
  ov.querySelector('#x').onclick = close;
  ov.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => {
    level = b.dataset.lv;
    ov.querySelectorAll('[data-lv]').forEach(x => x.classList.toggle('sel', x === b));
  });
  ov.querySelector('#save').onclick = async e => {
    let c = '', t = '';
    if (isLevel) { if (!level) return toast('Choose your level', true); }
    else {
      c = Number(ov.querySelector('#c').value); t = Number(ov.querySelector('#t').value);
      if (!t || t < 1 || ov.querySelector('#c').value === '' || c < 0 || c > t) return toast('Enter a valid score', true);
    }
    e.currentTarget.disabled = true; e.currentTarget.textContent = 'Saving…';
    try {
      const first = !!dash.levelTest, wasOpen = !!dash.journey && dash.journey.gate.state === 'open';
      setDash(await call('apiSubmit', session.name, session.pin, w.date, c, t, level));
      homeStale = true;
      const j = dash.journey;
      close(); renderDash();
      celebrate(dash.justEarned, j && !first ? 'Station ' + Math.min(j.stations, j.goal) + ' of ' + j.goal + ' · ' + j.name : '');
      if (first) setTimeout(() => toast('Level ' + levelLabel(level) + ' saved. Your daily task, the games and your journey are open!'), 1200);
      else if (j && !wasOpen && j.gate.state === 'open') setTimeout(() => toast('The gate to ' + j.gate.nextLabel + ' is open! Take the challenge on your map.'), 2300);
    } catch(err){ toast(err.message, true); e.currentTarget.disabled = false; e.currentTarget.textContent = 'Save'; }
  };
}

function celebrate(pts, line){
  confetti();
  const c = document.createElement('div');
  c.className = 'celebrate';
  c.innerHTML = `<div class="glass"><div class="pts">+${esc(pts)}</div><div style="font-weight:700">points · keep going</div>
    ${line ? `<div class="sub" style="font-size:13px;margin-top:6px">${icon('footprints')} ${esc(line)}</div>` : ''}</div>`;
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 2200);
}

function confetti(){
  const em = ['#8b8ffb', '#5eead4', '#f9a8d4', '#fdba74', '#c4b5fd', '#7dd3fc'];
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.style.background = em[i % em.length]; s.style.borderRadius = i % 3 ? '3px' : '50%';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
    s.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 3800);
  }
}

// ---------- Parent ----------
async function parent(pin, silent, remember){
  try {
    if (silent) loading();
    const p = await call('apiParent', pin);
    if (remember) store.set('eq_admin', pin);
    renderParent(p, pin);
    return true;
  } catch(e){
    if (silent) store.del('eq_admin');
    else toast(e.message.includes('PIN') ? 'Wrong PIN' : e.message, true);
    return false;
  }
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); }
  catch(e){ const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast('Copied');
}

const hourLabel = h => String(h).padStart(2, '0') + ':00';

// ---------- Parent notifications ----------
function notifyCard(p){
  return accordion('notify', accOpen('notify', !p.push.devices.length), accHead('t-star', 'bell-simple-ringing', 'Notifications',
    `Daily summary at ${hourLabel(p.push.summaryHour)} · task updates`), '<div class="glass panel" id="parentpush"><div class="sub" style="margin:0">Checking this device…</div></div>');
}

async function subscribeDevice(){
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('Notifications are blocked');
  const reg = await navigator.serviceWorker.ready;
  return (await reg.pushManager.getSubscription()) || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(pushKey) });
}

async function renderParentPush(p, pin){
  const el = document.getElementById('parentpush');
  if (!el) return;
  pushKey = p.push.key;
  let st;
  try { st = await pushState(); } catch(e){ st = { state: 'unsupported' }; }
  const note = text => el.innerHTML = `<div class="sub" style="margin:0;font-size:13px">${text}</div>`;
  if (st.state === 'install') return note(`On iPhone, notifications work from the installed app: tap Share, then <b>Add to Home Screen</b>, and open it from there.`);
  if (st.state === 'unsupported') return note('This browser can’t receive notifications. Open the installed app on your phone.');
  if (st.state === 'denied') return note('Notifications are blocked for this app. Allow them in the phone’s settings for English Quest, then come back.');
  const device = st.state === 'on' ? p.push.devices.find(d => d.e === st.sub.endpoint) : null;

  if (!device) {
    el.innerHTML = `<div class="sub" style="margin:0;font-size:13px">Get a summary every evening at ${hourLabel(p.push.summaryHour)} and an update whenever a kid finishes a task.</div>
      <button class="btn btn-primary btn-block mt" id="pp-on">${icon('bell')} Turn on on this phone</button>`;
    document.getElementById('pp-on').onclick = async e => {
      const btn = e.currentTarget;
      btn.disabled = true; btn.innerHTML = '<span class="mini-spin"></span>Turning on…';
      try {
        const sub = await subscribeDevice();
        const r = await call('apiParentPushSubscribe', pin, sub.endpoint, navigator.userAgent, true);
        p.push.devices.push({ e: sub.endpoint, instant: r.instant });
        toast('On — a test notification is on its way');
        renderParentPush(p, pin);
      } catch(err){ toast(err.message || 'Could not turn on notifications', true); btn.disabled = false; btn.innerHTML = icon('bell') + ' Turn on on this phone'; }
    };
    return;
  }

  el.innerHTML = `
    <div class="row-flex between">
      <div><b style="font-size:15px">Task updates</b><div class="sub" style="margin-top:2px;font-size:12px">A notification whenever a kid finishes a task</div></div>
      <div class="toggle ${device.instant ? '' : 'off'}" id="pp-instant" role="switch" aria-checked="${device.instant}"></div>
    </div>
    <div class="row-flex between mt">
      <div><b style="font-size:15px">Evening summary</b><div class="sub" style="margin-top:2px;font-size:12px">Every day at ${hourLabel(p.push.summaryHour)}</div></div>
      <span class="chip teal">${icon('check')} On</span>
    </div>
    <button class="btn btn-glass btn-block mt" id="pp-test">${icon('paper-plane-tilt')} Send a test notification</button>`;
  const tg = document.getElementById('pp-instant');
  tg.onclick = async () => {
    const next = !device.instant;
    tg.classList.toggle('off', !next);
    try { await call('apiParentPushPrefs', pin, device.e, next); device.instant = next; toast(next ? 'Task updates on' : 'Task updates off'); }
    catch(err){ tg.classList.toggle('off', !device.instant); toast(err.message, true); }
  };
  document.getElementById('pp-test').onclick = async e => {
    const btn = e.currentTarget, label = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<span class="mini-spin"></span>Sending…';
    try { const r = await call('apiParentPushTest', pin, device.e); toast(r.sent ? 'Sent — check your notifications' : 'This device is no longer registered', !r.sent); }
    catch(err){ toast(err.message, true); }
    btn.disabled = false; btn.innerHTML = label;
  };
}
function settingsCard(p){
  const s = p.settings, hours = Array.from({ length: 17 }, (_, i) => i + 6);
  const opts = (sel, withOff) => (withOff ? `<option value="" ${!sel ? 'selected' : ''}>Off</option>` : '') +
    hours.map(h => `<option value="${h}" ${Number(sel) === h ? 'selected' : ''}>${hourLabel(h)}</option>`).join('');
  const sub = `Daily at ${hourLabel(s.reminderHour)}` + (s.lastCallHour ? ` · last call ${hourLabel(s.lastCallHour)}` : ' · no last call');
  return accordion('settings', accOpen('settings', false), accHead('t-fire', 'bell-ringing', 'Reminders', sub), `
    <div class="glass panel">
      <div class="label">Daily reminder</div>
      <select class="input mt-s" id="st-rem">${opts(s.reminderHour, false)}</select>
      <div class="label mt">Last call</div>
      <select class="input mt-s" id="st-last">${opts(s.lastCallHour, true)}</select>
      <div class="sub mt-s" style="font-size:12px">Phone notifications (and emails, where set) go only to kids who haven't practiced that day.</div>
      <button class="btn btn-primary btn-block mt" id="st-save">${icon('check')} Save</button>
    </div>`);
}

function manageCard(p){
  return accordion('manage', accOpen('manage', false), accHead('t-vocab', 'crown-simple', 'Manage', 'Add groups and kids · open the sheet'), manageBody(p));
}

function manageBody(p){
  return `<div class="glass panel">
    <div class="label">New group</div>
    <input class="input mt-s" id="ng-name" placeholder="Group name, e.g. Cohen family">
    <input class="input mt-s" id="ng-email" type="email" placeholder="Parent email for weekly summary (optional)">
    <button class="btn btn-primary btn-block mt-s" id="ng-btn">${icon('users-three')} Create group</button>
    <div class="label mt">New kid</div>
    <input class="input mt-s" id="nk-name" placeholder="Name (must be unique)">
    <div class="row-flex mt-s" style="gap:10px">
      <input class="input" id="nk-age" type="number" inputmode="numeric" placeholder="Age">
      <select class="input" id="nk-level">${p.levels.map(l => `<option value="${l.id}" ${l.id === 'a2' ? 'selected' : ''}>Start ${l.label}</option>`).join('')}</select>
    </div>
    <select class="input mt-s" id="nk-group">${p.groups.map(g => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')}</select>
    <button class="btn btn-primary btn-block mt-s" id="nk-btn">${icon('user-plus')} Add kid</button>
    <div class="sub mt-s" style="font-size:12px">A PIN is created automatically. New kids take the level test first; their daily tasks and the games open after it.</div>
    <a class="btn btn-glass btn-block mt" href="${esc(p.sheetUrl)}" target="_blank" rel="noopener">Open Google Sheet ${icon('arrow-up-right')}</a>
    <div class="sub mt-s" style="font-size:12px">Edit PINs, levels, reminder emails, redeemed points, goals and rewards in the sheet.</div>
  </div>`;
}

function renderParent(p, pin){
  app.innerHTML = `
  <div class="stack">
    <div class="row-flex between">
      <div><h1>${p.isAdmin ? 'Admin view' : 'Parent view'}</h1><div class="sub">${p.isAdmin ? p.groups.length + ' groups · ' + fmtDate(p.today) : 'English Quest'}</div></div>
      <div class="row-flex" style="gap:8px">
        <button class="btn btn-glass icon-btn" id="refresh">${icon('arrows-clockwise')}</button>
        <button class="btn btn-glass icon-btn" id="logout" title="Exit">${icon('sign-out')}</button>
      </div>
    </div>
    ${createdCard(p.created)}
    ${p.groups.map((g, i) => groupBlock(g, p, i)).join('')}
    ${notifyCard(p)}
    ${p.isAdmin ? settingsCard(p) + manageCard(p) : ''}
  </div>`;
  app.querySelectorAll('details.acc').forEach(d => d.addEventListener('toggle', () => store.set('eq_acc_' + d.dataset.acc, d.open)));
  renderParentPush(p, pin);
  document.getElementById('refresh').onclick = () => parent(pin, true);
  document.getElementById('logout').onclick = () => { store.del('eq_admin'); loadHome(); };
  app.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyText(b.dataset.copy));
  app.querySelectorAll('[data-msg]').forEach(ta => {
    const i = ta.dataset.msg, wa = app.querySelector(`[data-wa="${i}"]`);
    const sync = () => wa.href = waLink(ta.value);
    ta.oninput = sync; sync();
    app.querySelector(`[data-copymsg="${i}"]`).onclick = () => copyText(ta.value);
  });
  if (p.created) window.scrollTo({ top: 0, behavior: 'smooth' });
  if (!p.isAdmin) return;
  app.querySelectorAll('[data-testpush]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await call('apiAdminTestPush', pin, b.dataset.testpush); toast('Sent to ' + r.sent + ' device' + (r.sent === 1 ? '' : 's')); }
    catch(err){ toast(err.message, true); }
    b.disabled = false;
  });
  const busy = (btn, on, label) => { btn.disabled = on; if (label) btn.innerHTML = label; };
  document.getElementById('st-save').onclick = async e => {
    const btn = e.currentTarget, label = btn.innerHTML;
    busy(btn, true, '<span class="mini-spin"></span>Saving…');
    try {
      renderParent(await call('apiAdminSettings', pin, document.getElementById('st-rem').value, document.getElementById('st-last').value), pin);
      toast('Reminder times saved');
    } catch(err){ toast(err.message, true); busy(btn, false, label); }
  };
  document.getElementById('ng-btn').onclick = async e => {
    const btn = e.currentTarget, label = btn.innerHTML;
    busy(btn, true, '<span class="mini-spin"></span>Creating…');
    try { renderParent(await call('apiAdminAddGroup', pin, document.getElementById('ng-name').value, document.getElementById('ng-email').value), pin); }
    catch(err){ toast(err.message, true); busy(btn, false, label); }
  };
  document.getElementById('nk-btn').onclick = async e => {
    const btn = e.currentTarget, label = btn.innerHTML;
    busy(btn, true, '<span class="mini-spin"></span>Adding…');
    try {
      renderParent(await call('apiAdminAddKid', pin, document.getElementById('nk-name').value, document.getElementById('nk-age').value,
        document.getElementById('nk-group').value, document.getElementById('nk-level').value), pin);
    } catch(err){ toast(err.message, true); busy(btn, false, label); }
  };
}

// Where a kid is on her journey, for parents.
function journeyChip(j){
  const g = j.gate, gate = g.state === 'open' ? ' · gate open' : g.state === 'wait' && g.last ? ` · gate ${g.last.correct}/${g.last.total}` : '';
  return `<span class="chip ${g.state === 'open' ? 'teal' : ''}" title="World ${j.world}: ${esc(j.name)}">${icon('map-trifold')} ${esc(j.name)} ${Math.min(j.stations, j.goal)}/${j.goal}${gate}</span>`;
}

function girlCard(g, isAdmin){
  const s = g.stats;
  return `<div class="glass panel">
    <div class="row-flex between">
      <div class="row-flex">${petFace(g.pet, g.girl.color, g.girl.name)}
        <div><h2>${esc(g.girl.name)}</h2><span class="sub" style="font-size:13px">Level ${esc(g.girl.levelLabel)}${g.pet ? ' · ' + esc(g.pet.name) + ' the ' + STAGES[g.pet.stage - 1] : ''}${g.email ? ' · reminders on' : ''}</span></div></div>
      <span class="chip orange">${icon('star')} ${s.balance}</span>
    </div>
    <div class="row-flex mt-s" style="flex-wrap:wrap;gap:8px">
      ${g.levelTest ? `<span class="chip orange">${icon('target')} Level test pending</span>` : `<span class="chip purple">${s.weekDone}/${s.weekTotal} this week</span>`}
      ${g.journey ? journeyChip(g.journey) : ''}
      ${isAdmin && g.pin ? `<span class="chip">${icon('key')} ${esc(g.pin)}</span>` : ''}
      <span class="chip">${icon('target')} ${s.avg == null ? '–' : s.avg + '%'}</span>
      <span class="chip">${icon('fire')} ${s.streak}</span>
      ${g.coins != null ? `<span class="chip" title="Coins for Coco's shop">${coin}${coinsTxt(g.coins)}</span>` : ''}
      ${g.games ? `<span class="chip" title="Mini-games this week">${icon('game-controller')} ${g.games.weekRounds}${g.games.weekAvg != null ? ' · ' + g.games.weekAvg + '%' : ''}</span>` : ''}
      ${isAdmin && g.push ? `<span class="chip ${g.push.devices ? 'teal' : ''}">${icon('bell')} ${g.push.devices}</span>` : ''}
      ${isAdmin && g.push && g.push.devices ? `<button class="chip" style="cursor:pointer" data-testpush="${esc(g.girl.name)}">${icon('paper-plane-tilt')} Test</button>` : ''}
      <span class="chip">${s.total} tasks total</span>
    </div>
    <div class="strip">${g.week.map(w => {
      const st = w.beforeStart ? 'future' : w.done ? 'done' : w.isFuture ? 'future' : w.isToday ? 'pending' : 'missed';
      const v = w.done ? (w.section === 'level' ? (w.levelResult || '✓') : (w.percent !== '' ? w.percent + '%' : '✓')) : st === 'missed' ? '✕' : '';
      return `<div class="cell ${st}" title="${esc(w.title || w.label)}"><div>${w.day}</div><div>${icon((SEC[w.section] || SEC.grammar)[0], 'duotone')}</div><div class="v">${esc(v)}</div></div>`;
    }).join('')}</div>
    ${g.history.length > 1 ? `<div class="label mt">Weekly completion</div>
      <div class="hist">${g.history.map(h => `<div title="${fmtDate(h.week)}: ${h.done}/${h.expected}" style="height:${4 + Math.round(h.done / Math.max(1, h.expected) * 42)}px"></div>`).join('')}</div>
      <div class="row-flex" style="gap:6px;font-size:11px;color:var(--muted);font-weight:700">${g.history.map(h => `<span style="flex:1;text-align:center">${h.done}/${h.expected}</span>`).join('')}</div>` : ''}
    <details><summary>Recent activity ▾</summary>
      <div class="recent">${g.recent.length ? g.recent.map(r => `<div><span>${fmtDate(r.doneOn)}</span>
        <span><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></span>
        <b>${r.section === 'level' ? 'Level' : esc(r.correct) + '/' + esc(r.total)}</b><span>+${esc(r.points)}</span></div>`).join('') : '<div>No activity yet</div>'}</div>
    </details>
    ${g.bought && g.bought.length ? `<details><summary>Coco's shop ▾</summary><div class="recent">${g.bought.map(b => `<div><span>${fmtDate(b.date)}</span>
      <span>"${esc(b.sentence)}"</span><b>${esc(b.name)}</b><span>${coinsTxt(b.paid)}</span></div>`).join('')}</div></details>` : ''}
  </div>`;
}

boot();
</script>
</body>
</html>
