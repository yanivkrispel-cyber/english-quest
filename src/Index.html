// FIT:end
const MOOD_ORDER = ['happy', 'celebrate', 'thinking', 'oops', 'sleepy', 'cool'];
// Items that come in colors are drawn in the first one; the others are a hue turn of the same picture.
const HUE = { red: 355, orange: 28, green: 140, blue: 205, purple: 275, pink: 330 };
const ITEM_HUE = { 'star-beanie': 205, 'big-bow': 335, 'beret': 340, 'heart-glasses': 330, 'bow-tie': 355, 'heart-balloon': 355, 'butterfly-wings': 205 };
const AURAS = ['sparkle-aura', 'heart-aura', 'rainbow-aura', 'galaxy-aura', 'web-aura'];
const itemSrc = id => ASSETS + 'items/' + id + '.webp';
const cocoSrc = mood => ASSETS + 'coco/' + (mood || 'happy') + '.webp';
const wearOf = p => (p && Array.isArray(p.wear)) ? p.wear : [];
const wearId = e => String(e).split(':')[0];
const wearColor = e => String(e).split(':')[1] || '';
const n1 = x => Math.round(x * 10) / 10;

// The layers of a dressed pet, in the sticker's own pixels (the same math as tools/wear_fit.py).
function petLayers(id, stage, mood, wear){
  const st = Math.min(stage || 1, PET_ART[id] || 1), sz = FIT.size[id] && FIT.size[id][st - 1];
  if (!sz) return null;
  const ids = wear.map(wearId);
  if (mood === 'cool' && ids.some(i => FIT.items[i] && FIT.items[i].place === 'face')) mood = 'happy';
  const [W, H] = sz, mi = Math.max(0, MOOD_ORDER.indexOf(mood));
  if (MOOD_ORDER.indexOf(mood) < 0) mood = 'happy';
  const [ex, ey, d, a, cx, cy] = FIT.eyes[id][(st - 1) * 6 + mi];
  const ax = ex * W, ay = ey * H, D = d * W, th = a * Math.PI / 180;
  const ux = Math.cos(th), uy = Math.sin(th), vx = -uy, vy = ux;
  const P = Object.assign({}, FIT.pets[id], FIT.pets[id]['s' + st] || {});
  const out = [];
  let aura = null;
  wear.forEach(w => {
    const it = wearId(w), I = FIT.items[it];
    if (AURAS.indexOf(it) >= 0) { aura = it; return; }
    if (!I) return;
    let tx, ty, wd, z, rot = a;
    if (I.place === 'head') {
      const k = -(P.top - (I.dy || 0)), dx = I.dx || 0;
      tx = ax + vx * k * D + ux * dx * D; ty = ay + vy * k * D + uy * dx * D;
      wd = I.w * P.w * D; rot = a + (I.rot || 0); z = 3;
    } else if (I.place === 'face') {
      const k = I.dy || 0;
      tx = ax + vx * k * D; ty = ay + vy * k * D; wd = I.w * D / I.lens; z = 2;
    } else if (I.place === 'neck') {
      const k = P.chin + (I.dy || 0);
      tx = ax + vx * k * D; ty = ay + vy * k * D; wd = I.w * D; z = 1;
    } else if (I.place === 'back') {
      const nx = ax + vx * P.chin * D, ny = ay + vy * P.chin * D, bx = cx * W, by = cy * H, dx = I.dx || 0, dy = I.dy || 0;
      tx = nx + (bx - nx) * P.back + ux * dx * D + vx * dy * D; ty = ny + (by - ny) * P.back + uy * dx * D + vy * dy * D;
      wd = I.w * D; rot = a / 2; z = -1;
    } else {
      wd = I.w * D;
      const ht = wd * I.px[1] / I.px[0];
      tx = W * 0.9; ty = I.spot === 'air' ? H * 0.16 : H - ht * 0.5;
      out.push({ z: 4, id: it, color: wearColor(w), x: tx - wd / 2, y: ty - ht / 2, w: wd, h: ht, rot: 0, tx, ty, buddy: true });
      return;
    }
    const ht = wd * I.px[1] / I.px[0] * (I.sy || 1), at = I.at || [0.5, 0.5];
    out.push({ z, id: it, color: wearColor(w), x: tx - at[0] * wd, y: ty - at[1] * ht, w: wd, h: ht, rot, tx, ty, behind: I.behind });
  });
  out.sort((p, q) => p.z - q.z);
  return { mood, st, W, H, layers: out, aura };
}

// Shared SVG pieces (color turns, the bands of an item drawn behind the pet, the auras' gradients) live once in
// the page, in a hidden <svg>; every dressed pet refers to them.
function paDefs(){
  let s = document.getElementById('padefs');
  if (!s) {
    s = document.createElementNS('http:' + '/' + '/www.w3.org/2000/svg', 'svg');
    s.id = 'padefs'; s.setAttribute('width', '0'); s.setAttribute('height', '0'); s.setAttribute('aria-hidden', 'true');
    s.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
    s.innerHTML = `<defs>
      <radialGradient id="pa-galaxy" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#4c3fb8"/><stop offset=".55" stop-color="#2b2a7a"/><stop offset=".85" stop-color="#1b1b4d" stop-opacity=".85"/><stop offset="1" stop-color="#1b1b4d" stop-opacity="0"/></radialGradient>
      <radialGradient id="pa-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".55" stop-color="#fde68a" stop-opacity=".35"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
      <radialGradient id="pa-spooky" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fdba74" stop-opacity=".5"/><stop offset=".6" stop-color="#a855f7" stop-opacity=".25"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
      <radialGradient id="pa-love" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fbcfe8" stop-opacity=".85"/><stop offset="1" stop-color="#fbcfe8" stop-opacity="0"/></radialGradient>
    </defs>`;
    document.body.appendChild(s);
  }
  return s.firstElementChild;
}
function paDef(id, markup){
  if (!document.getElementById(id)) paDefs().insertAdjacentHTML('beforeend', markup);
  return id;
}
const paHue = (item, color) => {
  const deg = ((HUE[color] - (ITEM_HUE[item] || 0)) % 360 + 360) % 360;
  return paDef('pa-h' + deg, `<filter id="pa-h${deg}" color-interpolation-filters="sRGB"><feColorMatrix type="hueRotate" values="${deg}"/></filter>`);
};
const paBand = (from, to) => {
  const id = 'pa-c' + Math.round(from * 100) + '-' + Math.round(to * 100);
  return paDef(id, `<clipPath id="${id}" clipPathUnits="objectBoundingBox"><rect x="-0.5" y="${from}" width="2" height="${to - from}"/></clipPath>`);
};

// Auras are drawn here (behind the pet): sparkles, hearts, a rainbow, a galaxy, a spider web.
function auraSvg(id, W, H){
  const cx = W / 2, cy = H / 2, R = Math.max(W, H) * 0.56, ring = (n, r, f) => Array.from({ length: n }, (_, i) => {
    const t = (i / n) * Math.PI * 2 - Math.PI / 2 + 0.3;
    return f(cx + Math.cos(t) * r * (i % 2 ? 0.86 : 1), cy + Math.sin(t) * r * (i % 2 ? 0.86 : 1) * 0.92, i);
  }).join('');
  const star = (x, y, s) => `M${n1(x)} ${n1(y - s)}L${n1(x + s * .28)} ${n1(y - s * .28)}L${n1(x + s)} ${n1(y)}L${n1(x + s * .28)} ${n1(y + s * .28)}L${n1(x)} ${n1(y + s)}L${n1(x - s * .28)} ${n1(y + s * .28)}L${n1(x - s)} ${n1(y)}L${n1(x - s * .28)} ${n1(y - s * .28)}Z`;
  const heart = (x, y, s) => `M${n1(x)} ${n1(y + s * .9)}C${n1(x - s * 1.3)} ${n1(y)} ${n1(x - s * .7)} ${n1(y - s)} ${n1(x)} ${n1(y - s * .35)}C${n1(x + s * .7)} ${n1(y - s)} ${n1(x + s * 1.3)} ${n1(y)} ${n1(x)} ${n1(y + s * .9)}Z`;
  if (id === 'sparkle-aura') return `<g class="pa-aura"><circle cx="${n1(cx)}" cy="${n1(cy)}" r="${n1(R * .78)}" fill="url(#pa-glow)" opacity=".7"/>` +
    ring(10, R * .92, (x, y, i) => `<path class="pa-tw" style="animation-delay:${(i * .27).toFixed(2)}s" d="${star(x, y, R * (i % 3 ? .07 : .11))}" fill="${i % 2 ? '#fde68a' : '#fff'}" stroke="#f6c14d" stroke-width="${n1(R * .012)}"/>`) + '</g>';
  if (id === 'heart-aura') return `<g class="pa-aura"><circle cx="${n1(cx)}" cy="${n1(cy)}" r="${n1(R * .8)}" fill="url(#pa-love)" opacity=".8"/>` +
    ring(8, R * .9, (x, y, i) => `<path class="pa-tw" style="animation-delay:${(i * .33).toFixed(2)}s" d="${heart(x, y, R * (i % 2 ? .07 : .1))}" fill="${['#f472b6', '#fb7185', '#f9a8d4'][i % 3]}"/>`) + '</g>';
  if (id === 'rainbow-aura') {
    const cols = ['#f87171', '#fb923c', '#facc15', '#4ade80', '#60a5fa', '#a78bfa'], bw = R * .07, base = cy + R * .25;
    return `<g class="pa-aura" opacity=".85">${cols.map((c, i) => { const r = R * .95 - i * bw; return `<path d="M${n1(cx - r)} ${n1(base)}A${n1(r)} ${n1(r)} 0 0 1 ${n1(cx + r)} ${n1(base)}" fill="none" stroke="${c}" stroke-width="${n1(bw + .5)}"/>`; }).join('')}
      ${[-1, 1].map(s => `<g fill="#fff"><ellipse cx="${n1(cx + s * R * .78)}" cy="${n1(base)}" rx="${n1(R * .2)}" ry="${n1(R * .1)}"/><circle cx="${n1(cx + s * R * .7)}" cy="${n1(base - R * .07)}" r="${n1(R * .1)}"/><circle cx="${n1(cx + s * R * .86)}" cy="${n1(base - R * .05)}" r="${n1(R * .08)}"/></g>`).join('')}</g>`;
  }
  if (id === 'galaxy-aura') return `<g class="pa-aura"><circle cx="${n1(cx)}" cy="${n1(cy)}" r="${n1(R * .92)}" fill="url(#pa-galaxy)"/>` +
    Array.from({ length: 22 }, (_, i) => { const t = i * 2.39996, r = R * .82 * Math.sqrt((i + .5) / 22);
      return `<circle class="${i % 3 ? '' : 'pa-tw'}" style="animation-delay:${(i * .19).toFixed(2)}s" cx="${n1(cx + Math.cos(t) * r)}" cy="${n1(cy + Math.sin(t) * r)}" r="${n1(R * (i % 4 ? .012 : .024))}" fill="${i % 5 ? '#fff7cc' : '#c4b5fd'}"/>`; }).join('') + '</g>';
  if (id === 'web-aura') {
    const spokes = 10, rings = [.32, .52, .72, .92];
    const pt = (k, r) => { const t = k / spokes * Math.PI * 2 - Math.PI / 2; return [cx + Math.cos(t) * R * r, cy + Math.sin(t) * R * r]; };
    return `<g class="pa-aura"><circle cx="${n1(cx)}" cy="${n1(cy)}" r="${n1(R)}" fill="url(#pa-spooky)"/><g fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="${n1(R * .012)}" stroke-linecap="round">` +
      Array.from({ length: spokes }, (_, k) => { const [x, y] = pt(k, .98); return `<path d="M${n1(cx)} ${n1(cy)}L${n1(x)} ${n1(y)}"/>`; }).join('') +
      rings.map(r => `<path d="${Array.from({ length: spokes + 1 }, (_, k) => { const [x, y] = pt(k % spokes, r), [px, py] = pt((k + .5) % spokes, r * .9);
        return k ? `Q${n1(px)} ${n1(py)} ${n1(x)} ${n1(y)}` : `M${n1(x)} ${n1(y)}`; }).join('')}"/>`).join('') +
      `</g><g class="pa-bob"><path d="M${n1(cx + R * .62)} ${n1(cy - R)}L${n1(cx + R * .62)} ${n1(cy - R * .55)}" stroke="#fff" stroke-width="${n1(R * .008)}"/><circle cx="${n1(cx + R * .62)}" cy="${n1(cy - R * .5)}" r="${n1(R * .06)}" fill="#1f1b2e"/><circle cx="${n1(cx + R * .6)}" cy="${n1(cy - R * .51)}" r="${n1(R * .012)}" fill="#fff"/><circle cx="${n1(cx + R * .645)}" cy="${n1(cy - R * .51)}" r="${n1(R * .012)}" fill="#fff"/></g></g>`;
  }
  return '';
}

// The inside of a dressed pet's <svg>: aura, things behind (wings, the back half of a chain), the sticker, then
// what sits on top (necklace, glasses, hat) and the buddy.
function petSvgInner(id, stage, mood, wear){
  const L = petLayers(id, stage, mood, wear);
  const pic = (l, clip) => `<image href="${itemSrc(l.id)}" x="${n1(l.x)}" y="${n1(l.y)}" width="${n1(l.w)}" height="${n1(l.h)}"${l.color && ITEM_HUE[l.id] != null && HUE[l.color] != null ? ` filter="url(#${paHue(l.id, l.color)})"` : ''}${clip ? ` clip-path="url(#${clip})"` : ''}/>`;
  const g = (l, s) => l.rot ? `<g transform="rotate(${n1(l.rot)} ${n1(l.tx)} ${n1(l.ty)})">${s}</g>` : s;
  let back = L.aura ? auraSvg(L.aura, L.W, L.H) : '', front = '';
  L.layers.forEach(l => {
    if (l.z < 0) back += g(l, pic(l));
    else if (l.buddy) front += `<g class="pa-bob">${pic(l)}</g>`;
    else if (l.behind) {
      back += g(l, pic(l, paBand(l.behind[0], l.behind[1])));
      front += g(l, (l.behind[0] > 0 ? pic(l, paBand(0, l.behind[0])) : '') + (l.behind[1] < 1 ? pic(l, paBand(l.behind[1], 1)) : ''));
    } else front += g(l, pic(l));
  });
  return { L, html: back + `<image class="pa-pet" href="${petSrc(id, L.st, L.mood)}" width="${L.W}" height="${L.H}"/>` + front };
}

// A pet with what it wears, as an <svg> that takes the place (and the CSS class) of the old picture.
// p = { id, stage, wear, move }. opts.mid centres it in its box (default: standing on the bottom).
function petArt(p, mood, cls, opts){
  opts = opts || {};
  if (!p || !PET_ART[p.id] || !FIT.size[p.id]) return '';
  const wear = wearOf(p), r = petSvgInner(p.id, p.stage, mood, wear);
  return `<svg class="pa ${cls || ''}"${opts.id ? ` id="${opts.id}"` : ''}${opts.style ? ` style="${opts.style}"` : ''} viewBox="0 0 ${r.L.W} ${r.L.H}" preserveAspectRatio="xMidYMax meet"
    data-pa="${esc(JSON.stringify({ id: p.id, stage: p.stage, wear, move: p.move || '' }))}" role="img" aria-label="${esc(opts.label || '')}">${r.html}</svg>`;
}
// The same pet in another mood (the clothes come along).
function paMood(el, mood){
  if (!el || !el.dataset || !el.dataset.pa) return;
  const p = JSON.parse(el.dataset.pa);
  el.innerHTML = petSvgInner(p.id, p.stage, mood, p.wear || []).html;
}

const MOVES = ['spin', 'backflip', 'moonwalk', 'rocket-jump'];
function playMove(el, move){
  if (!el || MOVES.indexOf(move) < 0 || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return false;
  MOVES.forEach(m => el.classList.remove('mv-' + m));
  void el.getBoundingClientRect();
  el.classList.add('mv-' + move);
  const done = () => el.classList.remove('mv-' + move);
  el.addEventListener('animationend', done, { once: true });
  setTimeout(done, 2200);
  return true;
}

// The dressed pet on a canvas (the level-up certificate).
async function drawPet(c, p, mood, x, y, size){
  const r = petLayers(p.id, p.stage, mood, wearOf(p));
  if (!r) return;
  const s = size / Math.max(r.W, r.H), ox = x + (size - r.W * s) / 2, oy = y + (size - r.H * s);
  const draw = async (l, from, to) => {
    let im;
    try { im = await loadImage(itemSrc(l.id)); } catch(e){ return; }
    c.save();
    c.translate(ox + l.tx * s, oy + l.ty * s); c.rotate((l.rot || 0) * Math.PI / 180); c.translate(-(ox + l.tx * s), -(oy + l.ty * s));
    if (from != null) { c.beginPath(); c.rect(ox + l.x * s - 2, oy + (l.y + l.h * from) * s, l.w * s + 4, l.h * (to - from) * s); c.clip(); }
    if (l.color && ITEM_HUE[l.id] != null && HUE[l.color] != null) c.filter = 'hue-rotate(' + (((HUE[l.color] - ITEM_HUE[l.id]) % 360 + 360) % 360) + 'deg)';
    c.drawImage(im, ox + l.x * s, oy + l.y * s, l.w * s, l.h * s);
    c.restore();
  };
  for (const l of r.layers) { if (l.z < 0) await draw(l); else if (l.behind) await draw(l, l.behind[0], l.behind[1]); }
  try { c.drawImage(await loadImage(petSrc(p.id, r.st, r.mood)), ox, oy, r.W * s, r.H * s); } catch(e){}
  for (const l of r.layers) {
    if (l.z < 0) continue;
    if (!l.behind) await draw(l);
    else { if (l.behind[0] > 0) await draw(l, 0, l.behind[0]); if (l.behind[1] < 1) await draw(l, l.behind[1], 1); }
  }
}

// ---- Ask Coco: one item ----
// Grades a request: the same rules as cocoGrade() in src/Shop.js (test/sim.js checks they agree).
function cocoGrade(words, name, color){
  const MAP = { 'give me': 'giveme', "i'd like": 'idlike', 'thank you!': 'thanks', 'thank you': 'thanks' };
  const DISCOUNT = [0, 5, 10, 12, 15];
  const item = String(name || '').toLowerCase(), col = String(color || '').toLowerCase();
  const toks = (Array.isArray(words) ? words : []).slice(0, 30).map(w => {
    w = String(w).toLowerCase().replace(/\s+/g, ' ').trim();
    return w === item ? 'X' : col && w === col ? 'C' : MAP[w] || w;
  }).filter(w => w !== '');
  const thanks = toks[toks.length - 1] === 'thanks';
  const core = thanks ? toks.slice(0, -1) : toks.slice();
  const s = core.join(' ');
  const pleases = core.filter(w => w === 'please').length;
  const shapes = {
    imp: /^(please )?giveme the (C )?X( please)? \.$/, want: /^i want the (C )?X( please)? \.$/,
    like: /^idlike the (C )?X( please)? \.$/, ask: /^(can|could|may) i( please)? have the (C )?X( please)? \?$/
  };
  let shape = null;
  Object.keys(shapes).forEach(k => { if (shapes[k].test(s)) shape = k; });
  const chips = { please: pleases === 1, question: shape === 'ask', polite: shape === 'like' || (shape === 'ask' && core[0] !== 'can'), thanks };
  const n = (chips.please ? 1 : 0) + (chips.question ? 1 : 0) + (chips.polite ? 1 : 0) + (chips.thanks ? 1 : 0);
  const ok = !!shape && pleases <= 1 && core.indexOf('thanks') < 0;
  const out = { ok, chips, n, pct: DISCOUNT[n], hint: '' };
  if (ok) return out;
  const thing = 'the ' + (col ? col + ' ' : '') + item, first = core[0], end = core[core.length - 1];
  const ask = first === 'can' || first === 'could' || first === 'may';
  const xi = core.indexOf('X');
  if (!toks.length) out.hint = 'Tap the words to ask me for it, darling.';
  else if (core.indexOf('thanks') >= 0) out.hint = 'Say "Thank you!" at the very end.';
  else if (pleases > 1) out.hint = 'One "please" is enough!';
  else if (xi < 0) out.hint = 'What would you like? Say ' + thing + '.';
  else if (core[xi + 1] === 'C') out.hint = 'In English the color comes first: ' + thing + '.';
  else if (core[xi - 1] !== 'the' && !(core[xi - 1] === 'C' && core[xi - 2] === 'the')) out.hint = 'Don\'t forget "the": ' + thing + '.';
  else if (ask && end !== '?') out.hint = 'That\'s a question, so it ends with a question mark (?).';
  else if (!ask && end === '?') out.hint = 'That isn\'t a question. End it with a full stop (.).';
  else if (end !== '.' && end !== '?') out.hint = 'End your request with . or ?';
  else if (ask && core.indexOf('want') >= 0) out.hint = 'With Can, Could or May, say "have": Could I have ' + thing + '?';
  else out.hint = 'Hmm, I didn\'t quite get that. Try: Can I have ' + thing + ', please?';
  return out;
}
// The live manners meter while she builds (lights up word by word; the price needs a full, correct request).

  const w = words.map(x => x.toLowerCase()), last = w[w.length - 1];

  return { please: core.filter(x => x === 'please').length === 1, question: ['can', 'could', 'may'].indexOf(core[0]) >= 0 && core[core.length - 1] === '?',

}

// The request as it reads (the same as shopSentence in Shop.js).
function shopSentenceLocal(words){
  let out = '';
  words.forEach((x, i) => {
    const low = x.toLowerCase(), next = words[i + 1] || '';
    if (x === '?' || x === '.') { out += x; return; }
    let word = low === 'i' ? 'I' : low === "i'd like" ? "I'd like" : low.indexOf('thank you') === 0 ? 'Thank you!' : low;
    const start = !out || /[.?!]$/.test(out);
    if (start) word = word.charAt(0).toUpperCase() + word.slice(1);
    const comma = low === 'please' && !start && (next === '?' || next === '.') && !/^(i|can|could|may)$/i.test(words[i - 1] || '');
    out += (out ? (comma ? ', ' : ' ') : '') + word;
  });
  return out;
}

// ---- Voice (optional, off by default): the phone's own speech recognition, matched to the tiles ----
const voiceOn = () => !!store.get('eq_voice') && !!(window.SpeechRecognition || window.webkitSpeechRecognition);
function cocoListen(it, color, done, btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('This phone cannot listen. Use the word tiles!', true);
  const r = new SR();
  r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 3;
  if (btn) btn.classList.add('listening');
  r.onresult = e => {
    const alts = Array.from(e.results[0]).map(x => x.transcript);
    let best = null;
    alts.forEach(t => { const w = voiceWords(t, it, color), g = cocoGrade(w, it.name, color); if (!best || (g.ok && !best.g.ok) || (g.ok === best.g.ok && g.n > best.g.n)) best = { w, g }; });
    if (best && best.w.length) done(best.w); else toast('I didn\'t catch that. Try again, or use the tiles!', true);
  };
  r.onerror = () => toast('I didn\'t catch that. Try again, or use the tiles!', true);
  r.onend = () => { if (btn) btn.classList.remove('listening'); };
  try { r.start(); } catch(e){ if (btn) btn.classList.remove('listening'); }
}
// "could i please have the pink star beanie thank you" -> the tiles, with the punctuation a voice cannot say.
function voiceWords(text, it, color){
  let s = ' ' + String(text).toLowerCase().replace(/[^a-z' ]+/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  s = s.replace(/ i would like /g, " i'd like ").replace(/ thanks /g, ' thank you ');
  const multi = [[' ' + it.name.toLowerCase().replace(/-/g, ' ') + ' ', it.name.toLowerCase()], [' give me ', 'Give me'], [" i'd like ", "I'd like"], [' thank you ', 'Thank you!']];
  const marks = [];
  multi.forEach(([k, tile]) => { let i = s.indexOf(k); while (i >= 0) { marks.push([i, k.length - 1, tile]); i = s.indexOf(k, i + 1); } });
  const one = { could: 'Could', can: 'Can', may: 'May', i: 'I', want: 'want', have: 'have', please: 'please', the: 'the' };
  if (color) one[color] = color;
  const out = [];
  for (let i = 1; i < s.length;) {
    const m = marks.find(x => x[0] === i - 1);
    if (m) { out.push(m[2]); i = m[0] + m[1] + 1; continue; }
    const j = s.indexOf(' ', i), w = s.slice(i, j);
    if (one[w]) out.push(one[w]);
    i = j + 1;
  }
  const thanks = out[out.length - 1] === 'Thank you!', core = thanks ? out.slice(0, -1) : out;
  core.push(['Could', 'Can', 'May'].indexOf(core[0]) >= 0 ? '?' : '.');
  return thanks ? core.concat(['Thank you!']) : core;
}

function bankItems(B, game, lv){
  if (game === 'match') {
    const out = (B.match[lv] || []).map(([w, def]) => ({ id: 'm:' + lv + ':' + idKey(w), kind: 'def', word: w, def, lv }));
    if (lv === 'a1') Object.keys(B.pics).forEach(t => B.pics[t].forEach(w => out.push({ id: 'p:' + idKey(w), kind: 'pic', word: w, topic: t, lv })));
    return out;
  }
  return (B[game][lv] || []).map((x, i) => ({ id: game[0] + ':' + lv + ':' + i, data: x, lv }));
}
function itemById(B, id){
  if (!bankIndex) {
    bankIndex = {};
    Object.keys(GAME_INFO).forEach(g => LV_ORDER.forEach(lv => bankItems(B, g, lv).forEach(x => { bankIndex[x.id] = x; })));
  }
  return bankIndex[id];
}
const seenKey = () => 'eq_seen_' + (session ? session.name : '');

// Five items: up to two missed items that are due again, then new ones (not seen lately).
// Two strong rounds in a row swap one item for the next level.
function makeRound(B, game){
  const levels = kidLevels(dash.girl.level);
  const pool = [].concat(...levels.map(l => bankItems(B, game, l)));
  const pre = game === 'match' ? ['m:', 'p:'] : [game[0] + ':'];
  const due = (dash.games.review || []).filter(id => pre.some(p => id.indexOf(p) === 0)).map(id => itemById(B, id)).filter(Boolean).slice(0, 2);
  const taken = new Set(due.map(x => x.id)), seen = store.get(seenKey()) || [];
  let fresh = shuffle(pool.filter(x => !taken.has(x.id) && seen.indexOf(x.id) < 0));
  if (fresh.length + due.length < ROUND) fresh = fresh.concat(shuffle(pool.filter(x => !taken.has(x.id) && fresh.indexOf(x) < 0)));
  const items = due.concat(fresh).slice(0, ROUND);
  const recent = (dash.games.recent || {})[game] || [], nxt = levels.length === 1 ? NEXT_LV[levels[0]] : null;
  if (nxt && recent.length >= 2 && recent.slice(-2).every(p => p >= 90)) {
    const extra = shuffle(bankItems(B, game, nxt))[0];
    if (extra) items[items.length - 1] = extra;
  }
  return shuffle(items).map(x => prepare(B, game, x));
}

// Each prepared item knows its game, so one round can mix games (the gate challenge).
const prepare = (B, game, x, rnd) => Object.assign(prepareItem(B, game, x, rnd), { game });
function prepareItem(B, game, x, rnd){
  if (game === 'match') {
    const others = x.kind === 'pic' ? B.pics[x.topic].filter(w => w !== x.word) : B.match[x.lv].map(m => m[0]).filter(w => w !== x.word);
    return Object.assign({ answer: x.word, options: shuffle([x.word].concat(shuffle(others, rnd).slice(0, 3)), rnd) }, x);
  }
  if (game === 'listen') {
    const [say, q, a, ...wrong] = x.data;
    return Object.assign({ say, q: q || 'Which word do you hear?', answer: a, options: shuffle([a].concat(wrong), rnd) }, x);
  }
  if (game === 'build') {
    const words = x.data.split(' ');
    let order = shuffle(words.map((_, i) => i), rnd);
    if (order.every((v, i) => words[v] === words[i])) order = order.reverse();
    return Object.assign({ sentence: x.data, words, order }, x);
  }
  const [s, fix, tip] = x.data, raw = s.split(' '), wrong = raw.findIndex(t => t.indexOf('*') >= 0);
  return Object.assign({ tokens: raw.map(t => t.replace(/\*/g, '')), wrong, fix, tip, raw: raw[wrong] }, x);
}
const fixedWord = it => it.fix ? it.raw.replace(/\*(.*?)\*/, it.fix) : '';
const fixedSentence = it => it.tokens.map((w, k) => k === it.wrong ? fixedWord(it) : w).filter(Boolean).join(' ');

async function startGame(game){
  if (!dash) return;
  if (dash.levelTest) { toast('Do the level test first, then the games open', true); return renderDash(); }
  if (!dash.games) dash.games = Object.assign({}, GAMES_DEFAULT);
  app.innerHTML = '<div class="spinner"></div>';
  let B;
  try { B = await loadBank(); }
  catch(e){ toast(e.message, true); return renderDash(); }
  G = { game, items: makeRound(B, game), i: 0, res: [], missed: [], right: [], built: [], locked: false };
  window.scrollTo(0, 0);
  renderItem();
}

function gameBars(){
  return G.items.map((_, k) => `<i class="${k < G.res.length ? (G.res[k] ? 'ok' : 'no') : k === G.i ? 'on' : ''}"></i>`).join('');
}

function renderItem(){
  if (!G) return;
  if (G.i >= G.items.length) return finishRound();
  G.locked = false; G.built = [];
  const it = G.items[G.i], n = G.items.length, game = it.game, info = GAME_INFO[game];
  let body;
  if (game === 'match') {
    body = `<div class="glass qcard">${it.kind === 'pic'
        ? `<div class="qprompt">What is this?</div><img class="qpic" src="${picSrc(it.word)}" alt="">`
        : `<div class="qprompt">Which word matches?</div><div class="qbig">${esc(it.def)}</div>`}</div>
      <div class="opts">${it.options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if (game === 'listen') {

      <div class="opts ${it.options.some(o => o.length > 13) ? 'one' : ''}">${it.options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;

  } else {
    body = `<div class="glass qcard"><div class="qprompt">One word is wrong. Tap it!</div>
      <div class="sentence">${it.tokens.map((t, k) => `<button class="tok" data-k="${k}">${esc(t)}</button>`).join('')}</div></div>`;
  }
  const hint = { match: 'Hmm… which one is it?', listen: 'Listen carefully!', build: 'Let\'s build it together!', spot: 'Can you find it?' }[game];
  app.innerHTML = `<div class="gscreen" id="gs">
    <div class="gtop"><button class="btn btn-glass icon-btn" id="gquit" title="Stop">${icon('x')}</button>
      <div style="flex:1;min-width:0"><h2>${G.duel ? G.duel.title : G.gate ? 'Gate challenge' : info.name}</h2><div class="sub" style="font-size:12px;margin:0">${G.duel
        ? info.name + ' · level ' + esc(G.duel.label) : G.gate ? info.name + ' · level ' + esc(dash.journey.gate.nextLabel) : 'Level ' + esc(dash.girl.levelLabel)} · ${G.i + 1} of ${n}</div></div>
      ${G.duel ? `<span class="chip" id="dtimer">${icon('timer')} ${duelClockText()}</span>` : `<span class="tile ${info.tile}">${icon(info.icon, 'duotone')}</span>`}</div>
    ${G.duel ? duelRaceCard() : `<div class="gprog" id="gprog">${gameBars()}</div>`}
    ${body}
    <div class="react">${dash.pet ? petArt(dash.pet, 'thinking', 'gpet', { id: 'gpet' }) : ''}
      <div class="bubble" id="fb">${hint}</div></div>
    <div id="explain"></div><div style="flex:1"></div><div id="gnext"></div>
    ${G.duel && DU && DU.boss ? bossAssist() : ''}${G.duel && DU && DU.live ? reactionsBar() : ''}
  </div>`;
  document.getElementById('gs').onclick = onGameClick;
  if (G.duel) duelAfterRender();
  if (game === 'listen') setTimeout(() => sayIt(false), 300);
}

function onGameClick(e){
  const t = e.target.closest('button');
  if (!t || !G) return;
  if (t.dataset.react != null) return sendReaction(Number(t.dataset.react));
  if (t.dataset.hint) return bossSendHint();
  if (t.id === 'gquit') {
    // Leaving the gate challenge or a duel halfway takes a second tap; nothing is saved then.
    if ((G.gate || G.duel) && !(G.quitAt > Date.now() - 3000)) { G.quitAt = Date.now(); return toast(G.duel ? 'Tap again to leave the duel.' : 'Tap again to leave. This try won\'t count.'); }
    const gate = G.gate;
    if (G.duel) stopDuel();
    G = null; speechStop();
    return gate ? renderMap() : renderDash();
  }
  if (t.id === 'gnext-btn') { G.i++; return renderItem(); }
  if (t.id === 'say') return sayIt(false);
  if (t.id === 'slow') return sayIt(true);
  if (G.locked) return;
  const it = G.items[G.i];
  if (t.classList.contains('opt')) {
    const ok = t.dataset.v === it.answer;
    app.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.v === it.answer) b.classList.add('ok'); });
    if (!ok) t.classList.add('no', 'shake');
    if (it.game === 'listen') return answered(ok, `You heard: <b>${esc(it.say)}</b>`);
    return answered(ok, it.kind === 'pic' ? `This is a <b>${esc(it.word)}</b>.` : `<b>${esc(it.word)}</b>: ${esc(it.def)}`);
  }
  if (it.game === 'build' && t.classList.contains('tok')) {
    const k = Number(t.dataset.k);
    if (t.closest('#bank')) { G.built.push(k); t.classList.add('used'); }
    else { G.built.splice(G.built.indexOf(k), 1); app.querySelector('#bank .tok[data-k="' + k + '"]').classList.remove('used'); }
    document.getElementById('slots').innerHTML = G.built.map(x => `<button class="tok placed" data-k="${x}">${esc(it.words[x])}</button>`).join('');
    document.getElementById('check').disabled = G.built.length !== it.words.length;
    return;
  }
  if (t.id === 'check') {
    const ok = G.built.map(x => it.words[x]).join(' ') === it.sentence;
    const sl = document.getElementById('slots');
    sl.style.borderColor = ok ? '#34d399' : '#fb7185';
    if (!ok) sl.classList.add('shake');
    t.disabled = true;
    app.querySelectorAll('#gs .tok').forEach(b => { b.disabled = true; });
    return answered(ok, `<b>${esc(it.sentence)}</b>`);
  }
  if (it.game === 'spot' && t.classList.contains('tok')) {
    const k = Number(t.dataset.k), ok = k === it.wrong;
    app.querySelectorAll('.sentence .tok').forEach(b => { b.disabled = true; });
    const w = app.querySelector('.sentence .tok[data-k="' + it.wrong + '"]');
    w.classList.add('fixed');
    w.innerHTML = '<s>' + esc(it.tokens[it.wrong]) + '</s>' + esc(fixedWord(it));
    if (!ok) t.classList.add('wrongpick', 'shake');
    return answered(ok, `<b>${esc(fixedSentence(it))}</b><br>${esc(it.tip)}`);
  }
}

// Right: quick praise and on to the next item. Wrong: show the answer and wait for "Next".
function answered(ok, explain){
  G.locked = true;
  const it = G.items[G.i];
  G.res.push(ok);
  (ok ? G.right : G.missed).push(it.id);
  if (G.duel) duelAnswer(ok); else document.getElementById('gprog').innerHTML = gameBars();
  const fb = document.getElementById('fb');
  fb.className = 'bubble ' + (ok ? 'ok' : 'no');
  fb.textContent = ok ? pick(['Correct!', 'Great!', 'Yes! You got it!', 'Perfect!', 'Well done!'])
    : pick(['Oops! Let\'s look at the answer.', 'Almost! Here is the answer.', 'Not quite. Now you know!']);
  petReact(ok ? 'celebrate' : 'oops');
  const learn = it.game === 'listen' || it.game === 'spot';
  if (ok) {
    xpPop();
    if (learn) document.getElementById('explain').innerHTML = `<div class="answer-box">${explain}</div>`;
    setTimeout(() => { if (G && G.items[G.i] === it) { G.i++; renderItem(); } }, learn ? 1900 : 1100);
    return;
  }
  document.getElementById('explain').innerHTML = `<div class="answer-box">${explain}</div>`;
  document.getElementById('gnext').innerHTML = `<button class="btn btn-primary btn-block" id="gnext-btn">Next ${icon('arrow-right')}</button>`;
}

function petReact(mood){
  const img = document.getElementById('gpet');
  if (!img || !dash.pet) return;
  paMood(img, mood);
  img.classList.remove('pop'); void img.getBoundingClientRect(); img.classList.add('pop');
  setTimeout(() => img.classList.remove('pop'), 300);
}

function xpPop(){
  const earned = G.right.length * 2;
  if (G.gate || dash.games.todayXp + earned > dash.games.dayCap) return;
  const img = document.getElementById('gpet'), r = img ? img.getBoundingClientRect() : { left: window.innerWidth - 90, top: 30 };
  const s = document.createElement('div');
  s.className = 'xp-pop';
  s.textContent = '+2 XP';
  s.style.left = Math.max(8, r.left - 20) + 'px'; s.style.top = (r.top + 10) + 'px';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1000);
}

function finishRound(){
  if (G.gate) return finishGate();
  if (G.duel) return finishDuel();
  const correct = G.res.filter(Boolean).length, total = G.res.length, pct = total ? correct / total : 0;
  const mood = pct >= .8 ? 'celebrate' : pct >= .5 ? 'happy' : 'oops';
  store.set(seenKey(), (store.get(seenKey()) || []).concat(G.items.map(x => x.id)).slice(-60));
  const R = { game: G.game, level: dash.girl.level, correct, total, missed: G.missed.slice(), right: G.right.slice() };
  G = null;
  app.innerHTML = `<div class="gscreen">
    <div class="result">
      ${dash.pet ? petArt(dash.pet, mood, 'pet-img', { id: 'resultpet' }) : ''}
      <h1>${correct}/${total}</h1>
      <h2>${pct === 1 ? 'Perfect round!' : pct >= .8 ? 'Great job!' : pct >= .5 ? 'Nice work!' : 'Good try. Keep going!'}</h2>
      <div class="saved wait" id="savest"><span class="mini-spin"></span>Saving…</div>
      ${R.missed.length ? '<div class="sub" style="font-size:13px;max-width:290px">The ones you missed will come back in another game, so you can learn them.</div>' : ''}
    </div>
    <div class="stack" style="gap:10px">
      <button class="btn btn-primary btn-block" id="again">${icon('arrows-clockwise')} Play again</button>
      <button class="btn btn-glass btn-block" id="home">Back</button></div>
  </div>`;
  if (pct >= .8) confetti();
  if (pct >= .8 && dash.pet && dash.pet.move) setTimeout(() => playMove(document.getElementById('resultpet'), dash.pet.move), 450);
  document.getElementById('again').onclick = () => startGame(R.game);
  document.getElementById('home').onclick = renderDash;
  saveRound(R);
}

async function saveRound(R){
  const status = (cls, html) => { const el = document.getElementById('savest'); if (el) { el.className = 'saved ' + cls; el.innerHTML = html; } };
  try {
    setDash(await call('apiGameResult', session.name, session.pin, R.game, R.level, R.correct, R.total, R.missed, R.right));
    homeStale = true;
    status('', icon('check') + (dash.gameXp ? ' Saved · +' + dash.gameXp + ' XP for ' + esc(dash.pet ? dash.pet.name : 'you') : ' Saved · XP is full for today'));
    checkGrowth();
  } catch(e){
    queueResult(R);
    status('err', icon('wifi-slash') + ' Saved on this phone. It will sync when you are online.');
  }
}

// Rounds that could not be sent wait on the phone and go up on the next sign-in.
const pendKey = () => 'eq_pending_' + session.name;
function queueResult(R){ store.set(pendKey(), (store.get(pendKey()) || []).concat([R]).slice(-20)); }
async function flushPending(){
  if (!session) return;
  const q = store.get(pendKey()) || [];
  if (!q.length) return;
  store.del(pendKey());
  for (let i = 0; i < q.length; i++) {
    try { setDash(await call('apiGameResult', session.name, session.pin, q[i].game, q[i].level, q[i].correct, q[i].total, q[i].missed, q[i].right)); }
    catch(e){ store.set(pendKey(), q.slice(i).concat(store.get(pendKey()) || [])); return; }
  }
  if (!G && document.getElementById('petimg')) renderDash();
}

// Read-aloud for Hear it: the phone's own English voice (no recordings, no cost).
let voice = null;
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /^en-GB/i.test(v.lang)) || vs.find(v => /^en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch(e){}
}
if ('speechSynthesis' in window) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch(e){} }
function sayIt(slow){
  const it = G && G.items[G.i];
  if (!it || !it.say) return;
  const btn = document.getElementById('say'), tr = document.getElementById('transcript');
  if (!('speechSynthesis' in window)) { if (tr) tr.innerHTML = `<div class="answer-box">No sound on this device, so read it: <b>${esc(it.say)}</b></div>`; return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(it.say);
    u.lang = voice ? voice.lang : 'en-GB';
    if (voice) u.voice = voice;
    u.rate = slow ? .7 : .95;
    if (btn) btn.classList.add('talk');
    u.onend = u.onerror = () => { if (btn) btn.classList.remove('talk'); };
    speechSynthesis.speak(u);
  } catch(e){}
}
function speechStop(){ try { speechSynthesis.cancel(); } catch(e){} }

// ---------- Play together: Word Duel and Challenge ----------
// Spec: specs/play-together.md. Both phones build the same game sequence from the duel's seed;
// each player's questions come from her own level. A live duel syncs by polling the server.
const DUEL_ITEMS = 7;
const DUEL_GAMES = ['match', 'listen', 'build', 'spot', 'match', 'listen', 'spot'];
const DUEL_REACTIONS = ['Good luck!', 'Nice one!', 'So close!', 'Wow!', 'GG', 'Let\'s go!'];
let DU = null, duelsHome = null, homeTimer = null, duelTick = null, pendingDuel = null, duelOffset = 0, homeStale = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lvIndex = lv => LEVELS.findIndex(x => x[0] === lv);
const secs = ms => Math.round((Number(ms) || 0) / 1000) + ' s';
const appBase = () => IN_APPS_SCRIPT ? ASSETS : location.origin + location.pathname;
function rng32(a){
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hashStr(s){ let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

// Same seed and level: the same questions in the same order, with the same options.
function duelItems(B, seed, level, count){
  const n = count || DUEL_ITEMS;
  const order = shuffle(DUEL_GAMES, rng32(seed)).concat(n > DUEL_GAMES.length ? shuffle(DUEL_GAMES, rng32(seed + 1)) : []).slice(0, n), rnd = rng32((seed ^ hashStr(level)) >>> 0), used = new Set();
  return order.map(game => {
    const pool = [].concat(...kidLevels(level).map(l => bankItems(B, game, l))).filter(x => !used.has(x.id));
    const x = pool[Math.floor(rnd() * pool.length)];
    used.add(x.id);
    return prepare(B, game, x, rnd);
  });
}
const parseTrack = s => String(s || '').split(',').filter(String).map(x => { const p = x.split(':'); return { ok: p[0] === '1', t: Number(p[1]) || 0 }; });
const ghostScore = (track, ms) => track.filter(x => x.ok && x.t <= ms).length;

const meAsPlayer = () => ({ name: dash.girl.name, level: dash.girl.level, label: dash.girl.levelLabel, color: dash.girl.color,
  pet: dash.pet ? { id: dash.pet.id, stage: dash.pet.stage, wear: dash.pet.wear || [], move: dash.pet.move || '' } : null });
const duelMe = v => (v.role === 'guest' ? v.guest : v.host) || meAsPlayer();
const duelThem = v => v.role === 'guest' ? v.host : v.guest;
const faceOf = p => petFace(p && p.pet, (p && p.color) || '#8b8ffb', p ? p.name : '?');
function petPic(p, mood, cls){
  if (p && p.pet && PET_ART[p.pet.id]) return petArt(p.pet, mood, cls);
  return `<span class="duel-av ${cls || ''}" style="background:${esc((p && p.color) || '#8b8ffb')}">${esc(String((p && p.name) || '?')[0])}</span>`;
}
// Time left on an invite or a challenge: '24h left' / '5 min left', or in words: '24 hours' / '5 minutes'.
function duelLeft(v, words){
  const ms = (v.expires || 0) - (v.now || Date.now());
  if (!(ms > 0)) return words ? 'no time' : 'time is up';
  const h = Math.round(ms / 3600000), m = Math.max(1, Math.ceil(ms / 60000));
  if (ms >= 3600000) return words ? plural(h, 'hour') : h + 'h left';
  return words ? plural(m, 'minute') : m + ' min left';
}

async function dcall(fn, ...args){
  const t0 = Date.now();
  const v = await call(fn, session.name, session.pin, ...args);
  if (v && v.now) duelOffset = v.now - (t0 + Date.now()) / 2;
  return v;
}

function togetherCard(){

// From a notification, a shared link or a row on the home screen.
async function openDuel(code){

  try { routeDuel(await dcall('apiDuelPoll', code, null)); }
  catch(e){
    if (/not yours/.test(e.message)) {
      try { return routeDuel(await dcall('apiDuelJoin', code)); } catch(e2){ toast(e2.message, true); }
    } else toast(e.message, true);

async function duelRematch(code){
  const h = duelsHome, v = h && h.results.find(x => x.code === code) || (DU && DU.view && DU.view.code === code ? DU.view : null);
  if (!v) return;
  const them = duelThem(v), mate = h && h.friends.some(f => f.name === (them && them.name));
  loading();
  try { routeDuel(await dcall('apiDuelInvite', mate ? them.name : '', rematchMode(v))); }
  catch(e){ toast(e.message, true); renderDash(); }
}

// Where a duel goes next, from its state and the kid's role in it.
function routeDuel(v){
  if (!v) return renderDash();
  const me = duelMe(v);
  if (v.state === 'done') return duelResult(v);
  if (v.state === 'cancelled') return duelNotice(v, 'This invite was cancelled');
  if (v.state === 'playing' && me.score != null) { duelSession(v); Object.assign(DU, { finished: true, score: me.score, team: null }); return duelWait(v); }
  if (v.role === 'host') {
    if (v.state === 'invited' || v.state === 'declined' || (v.state === 'expired' && v.mode === 'live' && me.score == null)) return duelLobby(v);
    if (v.state === 'solo') return duelIntro(v);
    if (v.state === 'challenge') return duelSent(v);
    if (v.state === 'playing') return duelLobby(v);
  } else if (v.role === 'guest') {
    if (v.state === 'invited' || v.state === 'declined') return duelInvitation(v);
    if (v.state === 'playing') return duelLobby(v);
    if (v.state === 'challenge' && me.score == null) return duelIntro(v);
  }
  duelNotice(v, v.state === 'expired' ? 'This duel has expired' : 'This duel is not open right now');
}

// ---- Duel session and sync ----
function duelSession(v){
  if (!DU || DU.code !== v.code) { stopDuel(); DU = { code: v.code, view: v, seenRt: null, reaction: -1, reactionAt: 0, score: 0, answered: 0, lastMs: 0, finished: false }; }
  else DU.view = v;
  return DU;
}
function stopDuel(){
  if (DU) DU.stop = true;
  DU = null;
  clearInterval(duelTick);
}
function duelProgress(){
  return { n: DU.answered, s: DU.score, ms: DU.lastMs, f: DU.finished, r: DU.reaction, rt: DU.reactionAt,
    dmg: DU.boss ? DU.boss.dmg : 0, hint: DU.boss ? DU.boss.hintAt : 0, p: DU.talk ? DU.talk.mine.join(',') : '' };
}
async function duelLoop(){
  const me = DU;
  if (!me || me.looping) return;
  me.looping = true;
  while (DU === me && !me.stop) {
    try {
      const v = await dcall('apiDuelPoll', me.code, duelProgress());
      if (DU !== me || me.stop) break;
      me.fails = 0;
      onDuelUpdate(v);
    } catch(e){ me.fails = (me.fails || 0) + 1; if (me.fails === 4) toast('The connection is slow…', true); }
    await sleep(600);
  }
  me.looping = false;
}
function onDuelUpdate(v){
  DU.view = v;
  DU.them = v.them;
  if (DU.boss) bossPartner(v.them);
  const r = v.them && v.them.rt;
  if (r && r !== DU.seenRt) { if (DU.seenRt !== null && v.them.r >= 0) showReaction(duelThem(v), v.them.r); DU.seenRt = r; }
  else if (DU.seenRt === null) DU.seenRt = r || 0;
  if (DU.screen === 'talk') return talkUpdate(v);
  if (DU.screen === 'lobby') return lobbyUpdate(v);
  if (DU.screen === 'play') return updateRace();
  if (DU.screen === 'wait') { if (v.state === 'done') return duelResult(v); updateRace(); return waitUpdate(v); }
}

function reactionsBar(){
  return `<div class="reacts" id="reacts">${DUEL_REACTIONS.map((r, i) => `<button data-react="${i}">${esc(r)}</button>`).join('')}</div>`;
}
function sendReaction(i){
  if (!DU || Date.now() - DU.reactionAt < 2500) return;
  DU.reaction = i; DU.reactionAt = Date.now();
  const b = document.querySelector('[data-react="' + i + '"]');
  if (b) { b.classList.add('sent'); setTimeout(() => b.classList.remove('sent'), 1500); }
}
function showReaction(p, i){
  if (!p || !DUEL_REACTIONS[i]) return;
  document.querySelectorAll('.rtoast').forEach(x => x.remove());
  const t = document.createElement('div');
  t.className = 'rtoast';
  t.innerHTML = `${faceOf(p)}<span>${esc(p.name)}: ${esc(DUEL_REACTIONS[i])}</span>`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ---- Lobby: the host waits; both count down together ----
function duelLobby(v){
  duelSession(v);
  DU.screen = 'lobby';
  G = null; speechStop();
  window.scrollTo(0, 0);
  const me = duelMe(v);
  app.innerHTML = `<div class="gscreen" id="lobby">

      ${v.role === 'host' ? `<span class="chip purple">${icon('key')} ${esc(v.code)}</span>` : ''}</div>
    <div class="glass panel iri" style="padding:18px 14px 16px">
      <div class="duo">
        <div class="side">${petPic(me, 'happy')}<b>${esc(me.name)}</b><span class="chip purple">${esc(me.label || '')}</span></div>

        <div class="side wait" id="lthem"></div>
      </div>
      <div class="sub" style="text-align:center;margin-top:10px;font-size:13px">${v.mode === 'talk' ? 'One describes a word in English, the other picks it. Sit face to face (no peeking!) or call each other.'
        : (v.mode === 'boss' ? 'Team up: right answers hit the boss.' : 'Same game.') + ' Questions at each player\'s level.'}</div>
    </div>
    <div id="lstat"></div>
    <div style="flex:1"></div>
    <div id="lact" class="stack" style="gap:10px"></div>
    <div id="lreact"></div>
  </div>`;
  document.getElementById('lobby').onclick = async e => {
    const t = e.target.closest('button');
    if (!t || !DU) return;
    if (t.dataset.react != null) return sendReaction(Number(t.dataset.react));
    if (t.dataset.copy) return copyText(t.dataset.copy);
    const act = t.id === 'lquit' ? (DU.view.role === 'host' && DU.view.state === 'invited' ? 'cancel' : 'home') : t.dataset.act;
    if (act === 'home') { stopDuel(); homeStale = true; return renderDash(); }
    if (act === 'cancel' || act === 'solo') {
      t.disabled = true;
      try {
        const nv = await dcall(act === 'cancel' ? 'apiDuelCancel' : 'apiDuelSolo', DU.code);
        stopDuel();
        if (act === 'cancel') { homeStale = true; return renderDash(); }
        return duelIntro(nv);
      } catch(err){ toast(err.message, true); t.disabled = false; }
    }
  };
  lobbyUpdate(v);
  duelLoop();
}

function lobbyUpdate(v){
  if (!DU || DU.screen !== 'lobby') return;
  const sub = document.getElementById('lsub');
  if (!sub) return;
  const them = duelThem(v), name = them ? them.name : 'your friend';
  const stat = document.getElementById('lstat'), act = document.getElementById('lact'), th = document.getElementById('lthem');
  th.className = 'side' + (v.state === 'playing' ? '' : ' wait');
  th.innerHTML = them ? `${petPic(them, v.state === 'playing' ? 'cool' : 'sleepy', 'flip')}<b>${esc(them.name)}</b><span class="chip orange">${esc(them.label || '')}</span>`
    : `<span class="duel-av" style="background:rgba(255,255,255,.7);color:var(--faint)">?</span><b>Friend</b><span class="chip">Code ${esc(v.code)}</span>`;
  if (v.state === 'playing') {
    sub.textContent = 'Get ready…';
    stat.innerHTML = '';
    act.innerHTML = '';
    if (!document.getElementById('reacts')) document.getElementById('lreact').innerHTML = reactionsBar();
    return duelCountdown(v);
  }
  if (v.state === 'invited') {
    sub.textContent = them ? 'Waiting for ' + them.name + '…' : 'Waiting for your friend…';
    stat.innerHTML = them ? `<div class="soft stat" style="padding:12px 14px"><span class="tile sm t-listen">${icon(v.reply === 'wait' ? 'hourglass-medium' : 'bell-ringing', 'duotone')}</span>
        <div class="sub" style="margin:0;font-size:13px">${v.reply === 'wait' ? '<b style="color:var(--ink)">' + esc(them.name) + ':</b> Give me 5 minutes!' : esc(them.name) + ' got a notification.'} · ${duelLeft(v)}</div></div>` : codeShare(v);
    act.innerHTML = `<button class="btn btn-glass btn-block" data-act="solo">${icon('ghost')} Play it as a challenge instead</button>
      <button class="btn btn-glass btn-block" data-act="cancel">Cancel</button>`;
    return;
  }
  if (v.state === 'declined' || v.state === 'expired') {
    sub.textContent = v.state === 'declined' ? name + ' can\'t play now' : 'No answer from ' + name;
    stat.innerHTML = `<div class="soft stat" style="padding:12px 14px"><span class="tile sm t-read">${icon('ghost', 'duotone')}</span>
      <div class="sub" style="margin:0;font-size:13px">Send it as a challenge: you play now, ${esc(name)} plays within 24 hours.</div></div>`;
    act.innerHTML = `<button class="btn btn-primary btn-block" data-act="solo">${icon('ghost')} Send as a challenge</button>
      <button class="btn btn-glass btn-block" data-act="home">Back</button>`;
    return;
  }
  stopDuel();
  routeDuel(v);
}

// ---- Playing: the game screens of the mini-games, plus the race, a timer and reactions ----
async function startDuelPlay(v){
  const me = duelMe(v);
  app.innerHTML = '<div class="spinner"></div>';
  let B;
  try { B = await loadBank(); }
  catch(e){ toast(e.message, true); stopDuel(); return renderDash(); }
  duelSession(v);
  if (v.mode === 'talk') return talkStart(DU.view, B);
  const live = v.state === 'playing';
  Object.assign(DU, { screen: 'play', live, answered: 0, score: 0, lastMs: 0, finished: false, track: [], xp: null,
    localStart: live ? v.start - duelOffset : Date.now(),
    ghost: !live && v.role === 'guest' && v.host.track ? parseTrack(v.host.track) : null,
    boss: v.mode === 'boss' && live ? { dmg: 0, prev: 0, themDmg: 0, themRight: -1e9, themS: 0, hintAt: 0, seenHint: null, hintPending: false, won: false } : null });
  G = { game: 'duel', items: duelItems(B, v.seed, me.level, v.items), i: 0, res: [], missed: [], right: [], built: [], locked: false,
    duel: { label: me.label || dash.girl.levelLabel, title: v.mode === 'challenge' ? (v.role === 'guest' ? esc(v.host.name) + '\'s challenge' : 'Challenge') : modeTitle(v) } };
  window.scrollTo(0, 0);
  renderItem();
  duelClock();
  if (live) duelLoop();
}

function duelRaceCard(){
  if (DU.talk) return talkTeamCard();
  if (DU.boss) return bossCard();
  const v = DU.view, them = duelThem(v), me = meAsPlayer();
  const stations = Array.from({ length: DUEL_ITEMS }, (_, k) => `<i class="stn" style="left:${(k + 1) * 12.5}%"></i>`).join('') + `<span class="fin">${icon('flag-checkered', 'duotone')}</span>`;
  const runner = (p, id, cls) => p && p.pet && PET_ART[p.pet.id]
    ? petArt(p.pet, 'happy', 'runner ' + cls, { id, style: 'left:3%' })
    : `<span class="runner dot ${cls}" id="${id}" style="left:3%;background:${esc((p && p.color) || '#8b8ffb')}"></span>`;
  const racing = DU.live || DU.ghost;
  return `<div class="glass race" id="race">
    <div class="lane"><span class="lwho">${faceOf(me)}<span>You</span></span><div class="track">${stations}${runner(me, 'run-me', '')}</div><b id="sc-me">${DU.score}</b></div>
    <div class="lane"><span class="lwho">${faceOf(them)}<span>${esc(them ? them.name : 'Friend')}</span></span><div class="track">${stations}${racing && them ? runner(them, 'run-them', DU.ghost ? 'ghost' : '') : ''}</div>
      <b id="sc-them">${racing ? 0 : '–'}</b></div>
  </div>`;
}

function updateRace(){
  if (!DU || DU.talk) return;
  if (DU.boss) return updateBoss();
  const pos = s => (s ? s / DUEL_ITEMS * 87.5 : 3) + '%';
  const me = document.getElementById('run-me'), them = document.getElementById('run-them');
  if (me) me.style.left = pos(DU.score);
  const sm = document.getElementById('sc-me');
  if (sm) sm.textContent = DU.score;
  let ts = null;
  if (DU.ghost) ts = ghostScore(DU.ghost, Date.now() - DU.localStart);
  else if (DU.live && DU.them) ts = DU.them.s;
  if (ts == null) return;
  if (them) them.style.left = pos(ts);
  const st = document.getElementById('sc-them');
  if (st) st.textContent = ts;
}

function duelAnswer(ok){
  const ms = Math.max(0, Math.round(Date.now() - DU.localStart));
  DU.track.push((ok ? 1 : 0) + ':' + ms);
  DU.answered = G.res.length; DU.score = G.res.filter(Boolean).length; DU.lastMs = ms;
  if (DU.boss) bossHit(ok, ms);
  updateRace();
}

function duelClockText(){
  if (!DU || !DU.localStart) return '3:00';
  const s = Math.ceil(Math.max(0, DU.view.maxMs - (Date.now() - DU.localStart)) / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function duelClock(){
  clearInterval(duelTick);
  duelTick = setInterval(() => {
    if (!DU || !G || !G.duel) return clearInterval(duelTick);
    const el = document.getElementById('dtimer');
    if (el) el.innerHTML = icon('timer') + ' ' + duelClockText();
    if (DU.ghost) updateRace();
    if (Date.now() - DU.localStart >= DU.view.maxMs) { clearInterval(duelTick); toast('Time is up!'); finishDuel(); }
  }, 250);
}

// The last question (or the time limit): unanswered questions count as missed.
async function finishDuel(){
  if (!DU || DU.finished || !G) return;
  clearInterval(duelTick);
  const items = G.items, v = DU.view;
  const ms = Math.min(v.maxMs, Math.round(Date.now() - DU.localStart));
  // A boss battle reports the questions answered; a Word Duel all seven (unanswered ones as missed).
  const boss = v.mode === 'boss';
  if (!boss) while (DU.track.length < items.length) { DU.track.push('-:' + ms); G.missed.push(items[DU.track.length - 1].id); }
  const R = { correct: G.res.filter(Boolean).length, total: boss ? DU.track.length : items.length, ms, track: DU.track.join(','), missed: G.missed.slice(0, v.items), right: G.right.slice(0, v.items) };
  Object.assign(DU, { finished: true, score: R.correct, answered: R.total, lastMs: ms, screen: 'saving' });
  G = null; speechStop();
  saveDuel(R);
}

async function saveDuel(R, head){
  if (!DU) return;
  const code = DU.code;
  app.innerHTML = `<div class="gscreen"><div class="result">
      ${dash.pet ? `${petArt(dash.pet, 'thinking', 'pet-img')}` : ''}
      <h1>${head || R.correct + '/' + R.total}</h1>
      <div class="saved wait" id="dsave"><span class="mini-spin"></span>Saving…</div></div>
    <div class="stack" style="gap:10px" id="dsavebtns"></div></div>`;
  try {
    const r = await dcall('apiDuelFinish', code, R);
    if (!DU || DU.code !== code) return;
    if (r.dash) { setDash(r.dash); checkGrowth(); }
    DU.xp = r.xp;
    homeStale = true;
    if (r.state === 'done') return duelResult(r);
    if (r.state === 'challenge') return duelSent(r);
    duelWait(r);
  } catch(e){
    const st = document.getElementById('dsave');
    if (!st) return;
    st.className = 'saved err'; st.innerHTML = icon('wifi-slash') + ' ' + esc(e.message);
    document.getElementById('dsavebtns').innerHTML = `<button class="btn btn-primary btn-block" id="dretry">${icon('arrows-clockwise')} Try again</button>
      <button class="btn btn-glass btn-block" id="dleave">Home</button>`;
    document.getElementById('dretry').onclick = () => saveDuel(R, head);
    document.getElementById('dleave').onclick = () => { stopDuel(); renderDash(); };
  }
}

// The result, then "Learn together": my misses with the answers (ask the stronger partner),
// and the partner's misses I can explain (a Helper star each).
async function duelResult(v){
  const xp = DU && DU.code === v.code ? DU.xp : null;
  stopDuel();
  G = null; speechStop();
  window.scrollTo(0, 0);
  app.innerHTML = '<div class="spinner"></div>';
  let B = null;
  try { B = await loadBank(); } catch(e){}
  const me = duelMe(v), them = duelThem(v) || { name: 'Friend' };
  const boss = v.mode === 'boss', talk = v.mode === 'talk', team = boss || talk;
  const won = team ? v.winner === 'team' : v.winner === me.name, draw = !team && v.winner === 'draw';
  const rows = talk && B ? talkRows(B, v) : null, best = rows ? talkStreak(rows.filter(r => r.pick).map(r => r.pick)).best : 0;
  const dmg = boss && v.damage ? { me: v.role === 'guest' ? v.damage.guest : v.damage.host, them: v.role === 'guest' ? v.damage.host : v.damage.guest, total: v.damage.total } : null;
  const winner = won ? me : draw ? null : them, loser = won ? them : draw ? null : me;
  const head = talk ? (v.team >= v.items ? 'Perfect! You understood each other every time.' : won ? 'Great teamwork!' : 'Good try! Keep talking.')
    : boss ? (won ? 'Victory! The Word Thief is beaten.' : 'The Word Thief got away this time.') : won ? (them.score == null ? 'You won! ' + esc(them.name) + ' left the duel.' : me.score - them.score === 1 || me.score === them.score ? 'You won. Close one!' : 'You won!')
    : draw ? 'A draw! Same score, same time.' : esc(them.name) + ' won this time.';
  const learn = rows ? talkLearn(rows, me) : B && !talk ? learnTogether(B, v, me, them) : '';
  app.innerHTML = `<div class="gscreen" id="dres">
    <div class="gtop"><button class="btn btn-glass icon-btn" data-act="home">${icon('x')}</button>
      <div style="flex:1;min-width:0"><h2>${modeTitle(v)}</h2><div class="sub" style="font-size:12px;margin:0">${esc(me.name)} and ${esc(them.name)} · ${fmtDate(v.date || dash.today)}</div></div></div>
    <div class="result" style="flex:none">
      <div class="podium ${team ? 'team' : ''}">${team ? petPic(me, won ? 'celebrate' : talk ? 'happy' : 'oops', 'big') + (won ? `<span class="crown">${icon('crown-simple', 'duotone')}</span>` : '') + petPic(them, won ? 'celebrate' : talk ? 'happy' : 'oops', 'big flip')
        : draw ? petPic(me, 'happy', 'big') + petPic(them, 'happy', 'small flip')
        : petPic(winner, 'celebrate', 'big') + `<span class="crown">${icon('crown-simple', 'duotone')}</span>` + petPic(loser, won ? 'oops' : 'happy', 'small flip')}</div>
      <div class="score2">${talk ? (v.team == null ? '–' : v.team) + '<span>/</span>' + v.items + '<small>words right</small>'
        : dmg ? Math.max(0, v.boss.hp - dmg.total) + '<span>/</span>' + v.boss.hp + '<small>boss HP left</small>' : (me.score == null ? '–' : me.score) + '<span>:</span>' + (them.score == null ? '–' : them.score)}</div>
      <h2>${head}</h2>
      <div class="row-flex" style="gap:6px;flex-wrap:wrap;justify-content:center">
        ${xp != null ? `<span class="chip purple">${icon('lightning')} +${xp} XP</span>` : ''}
        ${won ? `<span class="chip orange">${icon('crown-simple')} ${team ? 'Team win' : 'Winner'}</span>` : ''}
        ${talk ? `<span class="chip">${icon('fire')} Best streak ${best}</span>` : dmg ? `<span class="chip">${icon('sword')} You hit ${dmg.me} · ${esc(them.name)} ${dmg.them}</span>` : `<span class="chip">${icon('timer')} You ${me.ms == null ? '–' : secs(me.ms)}${them.ms == null ? '' : ' · ' + esc(them.name) + ' ' + secs(them.ms)}</span>`}</div>
    </div>
    ${learn}
    <div class="stack" style="gap:10px">
      <button class="btn btn-primary btn-block" data-act="again">${icon('arrows-clockwise')} Rematch</button>
      <button class="btn btn-glass btn-block" data-act="home">Back</button></div>
  </div>`;
  if (won || draw) confetti();
  if (won || (!team && !draw)) setTimeout(() => app.querySelectorAll('.podium svg.big').forEach(el => playMove(el, petMoveOf(el))), 450);
  document.getElementById('dres').onclick = async e => {

    if (t.dataset.act === 'home') { homeStale = true; return renderDash(); }

      const mate = duelsHome && duelsHome.friends.some(f => f.name === them.name);

  };
}

function itemAnswer(it){
  if (it.game === 'match') return it.kind === 'pic' ? `This is a <b>${esc(it.word)}</b>.` : `<b>${esc(it.word)}</b>: ${esc(it.def)}`;
  if (it.game === 'listen') return `You heard: <b>${esc(it.say)}</b>`;
  if (it.game === 'build') return `<b>${esc(it.sentence)}</b>`;
  return `<b>${esc(fixedSentence(it))}</b>${it.tip ? '<br>' + esc(it.tip) : ''}`;
}

function learnTogether(B, v, me, them){
  const mine = me.track ? parseTrack(me.track) : [], theirs = them.track ? parseTrack(them.track) : [];
  const myItems = duelItems(B, v.seed, me.level, v.items), theirItems = them.level ? duelItems(B, v.seed, them.level, v.items) : [];
  const myLv = lvIndex(me.level), theirLv = lvIndex(them.level), same = me.level === them.level;
  const missed = myItems.map((it, k) => ({ it, k })).filter(x => mine[x.k] && !mine[x.k].ok);
  const canAsk = k => theirLv > myLv || (same && theirs[k] && theirs[k].ok);
  const canHelp = k => myLv > theirLv || (same && mine[k] && mine[k].ok);
  const helpable = theirItems.map((it, k) => ({ it, k })).filter(x => theirs[x.k] && !theirs[x.k].ok && canHelp(x.k));
  const done = new Set((v.helped || []).filter(h => h.indexOf(me.name + ':') === 0).map(h => h.slice(me.name.length + 1)));
  const rows = missed.map(x => `<div class="lrow"><span class="x">${icon('x')}</span><div class="lt">${itemAnswer(x.it)}</div>
      ${canAsk(x.k) ? `<span class="chip purple">${icon('hand-waving')} Ask ${esc(them.name)}</span>` : ''}</div>`).join('');
  const help = helpable.map(x => `<div class="lrow"><span class="x ok">${icon('lightbulb')}</span><div class="lt">${itemAnswer(x.it)}</div>
      ${done.has(x.it.id) ? `<span class="chip teal">${icon('star')} Helper</span>` : `<button class="btn btn-glass btn-sm" data-helped="${esc(x.it.id)}">I explained it</button>`}</div>`).join('');
  return `<div class="glass panel" style="padding:16px">

}

// After the first dashboard: the game bank and the pictures the app shows next load in the background
// (and the service worker keeps them on the phone).
let prefetched = false;
function prefetch(){
  if (prefetched) return;
  prefetched = true;
  const idle = window.requestIdleCallback || (f => setTimeout(f, 1500));
  idle(() => {
    loadBank().catch(() => {});
    const sw = !IN_APPS_SCRIPT && navigator.serviceWorker && navigator.serviceWorker.controller;
    if (!sw) return;
    const abs = u => new URL(u, location.href).href, urls = [abs(ASSETS + 'games.js?v=' + BANK_V)];
    PETS.forEach(([id]) => ['happy', 'celebrate'].forEach(m => urls.push(abs(petSrc(id, 1, m)))));
    if (dash && dash.pet) ['happy', 'thinking', 'celebrate', 'oops', 'cool', 'sleepy'].forEach(m => urls.push(abs(petSrc(dash.pet.id, dash.pet.stage, m))));
    if (dash && dash.pet) wearOf(dash.pet).forEach(e => { if (FIT.items[wearId(e)]) urls.push(abs(itemSrc(wearId(e)))); });
    if (dash && dash.shop) ['happy', 'sleepy', 'celebrate'].forEach(m => urls.push(abs(cocoSrc(m))));
    sw.postMessage({ type: 'precache', urls });
  });
}

if (!IN_APPS_SCRIPT && 'serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'eq-update') return updateReady();
    const u = e.data && e.data.url;
    if (!u) return;
    const c = new URL(u, location.href).searchParams.get('duel');
    if (!c) return;
    if (session && dash && !dash.levelTest) openDuel(c); else pendingDuel = c;
  });
}

// ---------- Talk & Tap ----------
// Spec: specs/talk-tap.md. One kid describes a word, the other picks it from four; the roles swap every
// word. Both phones build the same words from the duel's seed; only the picks travel, with the polls.
const TALK_ITEMS = 8, TALK_FLASH = 1700;
const TALK_TIPS = ['Speak slowly. You can do it!', 'Short sentences work best.', 'Stuck? Tap Need help.', 'Explain it like to a little kid.'];
const TALK_ASK = ['Can you say that again?', 'Another clue, please!', 'Is it a…?'];
const TALK_HELP = ["It's…", 'You use it when…', 'For example, …'];
// The host describes words 1, 3, 5, 7 (k = 0, 2, 4, 6); the guest the others.
const talkDescriber = k => k % 2 ? 'guest' : 'host';
const talkKey = code => 'eq_talk_' + (session ? session.name : '') + '_' + code;
const talkTheirs = () => String((DU && DU.them && DU.them.p) || '').split(',').filter(String);
const talkStreak = picks => picks.reduce((a, p) => { a.s = p.ok ? a.s + 1 : 0; a.best = Math.max(a.best, a.s); return a; }, { s: 0, best: 0 });

// The lower level of the two kids (a B1+ kid counts as B1), so both can follow.
function talkLevel(v){
  const at = p => LV_ORDER.indexOf(kidLevels(p && p.level)[0]);
  return LV_ORDER[Math.max(0, Math.min(at(v.host), at(v.guest)))];
}

// The 8 words of a game, each with its don't-say words and four options from its topic. The words take
// turns between the topics, so one game has animals, food, feelings… and not four things from home.
function talkItems(B, v){
  const lv = talkLevel(v), T = (B.talk || {})[lv] || {}, rnd = rng32((v.seed ^ hashStr('talk:' + lv)) >>> 0);
  const pics = new Set([].concat(...Object.values(B.pics || {})));
  const all = [].concat(...Object.keys(T).map(topic => T[topic].map(([word, a, b]) => ({ word, avoid: [a, b], topic }))));
  const topics = shuffle(Object.keys(T), rnd), pools = topics.map(t => shuffle(all.filter(x => x.topic === t), rnd)), words = [];
  for (let r = 0; words.length < TALK_ITEMS && r < 40; r++) pools.forEach(p => { if (p[r] && words.length < TALK_ITEMS) words.push(p[r]); });
  return words.map(x => {
    let others = shuffle(all.filter(y => y.topic === x.topic && y.word !== x.word), rnd).slice(0, 3);
    if (others.length < 3) others = others.concat(shuffle(all.filter(y => y.topic !== x.topic), rnd).slice(0, 3 - others.length));
    const m = (B.match[lv] || []).find(y => y[0] === x.word), pic = lv === 'a1' && pics.has(x.word);
    return Object.assign({}, x, { lv, pic, def: m ? m[1] : '', options: shuffle([x.word].concat(others.map(o => o.word)), rnd),
      id: (pic ? 'p:' : 'm:' + lv + ':') + idKey(x.word) });
  });
}

// The picks so far, word by word, up to the first word nobody picked yet.
function talkPicks(v, mine, theirs){
  const out = [];
  for (let k = 0; k < TALK_ITEMS; k++) {
    const myTurn = talkDescriber(k) !== v.role, x = (myTurn ? mine : theirs)[k >> 1];
    if (!x) break;
    const [ok, ms, o] = x.split(':');
    out.push({ ok: ok === '1', ms: Number(ms), o: Number(o), mine: myTurn });
  }
  return out;
}

function talkStart(v, B){
  // After a reload the picks come back from this phone or from the server, whichever knows more.
  const fromServer = String((v.mine && v.mine.p) || '').split(',').filter(String), kept = store.get(talkKey(v.code)) || [];
  const mine = kept.length > fromServer.length ? kept : fromServer;
  Object.assign(DU, { screen: 'talk', live: true, finished: false, track: [], xp: null, localStart: v.start - duelOffset,
    talk: { items: talkItems(B, v), starters: B.starters || {}, mine, shown: 0, busy: false, help: false } });
  G = null; speechStop();
  DU.talk.shown = talkPicks(v, mine, talkTheirs()).length;
  talkRender();
  talkClock();
  duelLoop();
}

function talkRender(){
  const T = DU && DU.talk;
  if (!T || DU.screen !== 'talk') return;
  const v = DU.view, k = T.shown;
  if (k >= TALK_ITEMS) return talkFinish();
  const it = T.items[k], them = duelThem(v) || { name: 'your friend' }, describe = talkDescriber(k) === v.role;
  const picks = talkPicks(v, T.mine, talkTheirs()).slice(0, k);
  window.scrollTo(0, 0);
  app.innerHTML = `<div class="gscreen talk" id="talk">
    <div class="gtop"><button class="btn btn-glass icon-btn" id="tquit" title="Stop">${icon('x')}</button>
      <div style="flex:1;min-width:0"><h2>Talk &amp; Tap</h2><div class="sub" style="font-size:12px;margin:0">Word ${k + 1} of ${TALK_ITEMS} · ${describe ? 'you describe' : 'you listen'}</div></div>
      <span class="chip orange" id="tstreak" title="Team streak">${icon('fire')} ${talkStreak(picks).s}</span><span class="chip" id="dtimer">${icon('timer')} ${duelClockText()}</span></div>
    <div class="gprog">${Array.from({ length: TALK_ITEMS }, (_, j) => `<i class="${j < k ? (picks[j].ok ? 'ok' : 'no') : j === k ? 'on' : ''}"></i>`).join('')}</div>
    ${describe ? talkDescribeHtml(it, them, T) : talkListenHtml(it, them)}
  </div>`;
  document.getElementById('talk').onclick = talkClick;
}

function talkDescribeHtml(it, them, T){
  const help = T.starters[it.topic] || TALK_HELP;
  return `<div class="glass qcard talkcard">
      <div class="qprompt">Describe this word to ${esc(them.name)}</div>
      ${it.pic ? `<img class="qpic" src="${picSrc(it.word)}" alt="">` : ''}
      <div class="tword">${esc(it.word)}</div>
      <div class="taboo"><span>Don't say</span>${it.avoid.map(w => `<span class="chip red">${esc(w)}</span>`).join('')}</div></div>
    <div class="soft mic"><span class="micb">${icon('microphone', 'duotone')}</span>
      <div class="drow-main"><b>Talk in English</b><small id="tstatus">${esc(them.name)} picks the word on the other phone</small></div></div>
    <button class="soft drow" id="thelp"><span class="tile sm t-star">${icon('lightbulb', 'duotone')}</span>
      <span class="drow-main"><b>Need help?</b><small>Sentence starters and what it means</small></span>${icon(T.help ? 'caret-up' : 'caret-down')}</button>
    <div class="glass thelp" id="thelpbox"${T.help ? '' : ' hidden'}>${help.map(s => `<div class="st">${esc(s)}</div>`).join('')}
      ${it.def ? `<div class="sub" style="margin:4px 0 0;font-size:13px"><b style="color:var(--ink)">It means:</b> ${talkMarked(it)}</div>` : ''}</div>
    <div class="react">${dash.pet ? `${petArt(dash.pet, 'thinking', 'gpet')}` : ''}<div class="bubble">${esc(TALK_TIPS[(DU.view.seed + T.shown) % TALK_TIPS.length])}</div></div>`;
}

// The meaning with the don't-say words marked, so the one describing knows not to read them out.
function talkMarked(it){
  return it.avoid.reduce((s, w) => s.replace(new RegExp('\\b(' + w.replace(/[^A-Za-z]/g, '') + ')\\b', 'gi'), '<span class="tabooin">$1</span>'), esc(it.def));
}

function talkListenHtml(it, them){
  return `<div class="glass qcard tlisten"><span class="ear">${icon('ear', 'duotone')}</span>
      <div class="qbig">${esc(them.name)} is describing a word. Which one?</div></div>
    <div class="opts">${it.options.map((o, i) => `<button class="opt" data-pick="${i}">${esc(o)}</button>`).join('')}</div>
    <div class="label" style="text-align:center">Ask in English</div>
    <div class="tasks">${TALK_ASK.map(a => `<span class="chip">${esc(a)}</span>`).join('')}</div>
    <div class="react">${dash.pet ? `${petArt(dash.pet, 'happy', 'gpet')}` : ''}<div class="bubble">A wrong pick sends the team streak back to 0.</div></div>`;
}

function talkClick(e){
  const t = e.target.closest('button');
  if (!t || !DU || !DU.talk) return;
  const T = DU.talk;
  if (t.id === 'tquit') {
    // Leaving saves the words played so far; the friend's phone then ends the game too.
    if (!(T.quitAt > Date.now() - 3000)) { T.quitAt = Date.now(); return toast('Tap again to stop the game. Your words so far are saved.'); }
    return talkFinish();
  }
  if (t.id === 'thelp') {
    T.help = !T.help;
    const box = document.getElementById('thelpbox');
    if (box) box.hidden = !T.help;
    t.lastElementChild.outerHTML = icon(T.help ? 'caret-up' : 'caret-down');
    return;
  }
  if (t.dataset.pick != null) talkPick(Number(t.dataset.pick));
}

// My pick (I listen): kept on the phone at once, sent with the next poll.
function talkPick(i){
  const T = DU.talk, v = DU.view, k = T.shown, it = T.items[k];
  if (!it || T.busy || DU.finished || talkDescriber(k) === v.role || T.mine.length > (k >> 1)) return;
  T.busy = true;
  const ok = it.options[i] === it.word, ms = Math.min(999999, Math.max(0, Math.round(Date.now() - DU.localStart)));
  T.mine.push((ok ? 1 : 0) + ':' + ms + ':' + i);
  store.set(talkKey(v.code), T.mine);
  app.querySelectorAll('[data-pick]').forEach(b => { b.disabled = true; if (it.options[b.dataset.pick] === it.word) b.classList.add('ok'); });
  if (!ok) { const b = app.querySelector('[data-pick="' + i + '"]'); if (b) b.classList.add('no', 'shake'); }
  talkFlash(k, { ok, o: i, mine: true });
}

// The result of one word on both phones, then the next word with the roles swapped.
function talkFlash(k, p){
  const T = DU.talk, v = DU.view, it = T.items[k], them = duelThem(v) || { name: 'Your friend' };
  T.busy = true;
  const streak = talkStreak(talkPicks(v, T.mine, talkTheirs()).slice(0, k + 1)).s, word = '<b>' + esc(it.word) + '</b>';
  const text = p.ok ? (p.mine ? 'Right! It is ' : esc(them.name) + ' got it: ') + word
    : (p.mine ? 'It was ' : esc(them.name) + ' picked ' + esc(it.options[p.o] || '?') + '. It was ') + word;
  const ov = document.createElement('div');
  ov.className = 'tflash ' + (p.ok ? 'ok' : 'no');
  ov.innerHTML = `<div class="glass"><div class="tfpet">${petPic(meAsPlayer(), p.ok ? 'celebrate' : 'oops')}<span class="tfi">${icon(p.ok ? 'check-circle' : 'x-circle', 'duotone')}</span></div><div class="tft">${text}</div>
    <div class="tfs">${p.ok ? icon('fire') + ' Team streak ' + streak : 'The streak starts again'}</div></div>`;
  document.body.appendChild(ov);
  try { navigator.vibrate && navigator.vibrate(p.ok ? 40 : [70, 50, 70]); } catch(e){}
  const st = document.getElementById('tstreak');
  if (st) st.innerHTML = icon('fire') + ' ' + streak;
  setTimeout(() => {
    ov.remove();
    if (!DU || DU.talk !== T) return;
    T.shown = k + 1; T.busy = false;
    talkRender();
    talkUpdate(DU.view);
  }, TALK_FLASH);
}

// A poll answer: the friend picked the word I describe, or stopped the game.
function talkUpdate(v){
  const T = DU && DU.talk;
  if (!T || T.busy || DU.screen !== 'talk' || DU.finished) return;
  const p = talkPicks(v, T.mine, talkTheirs())[T.shown], them = duelThem(v) || { name: 'Your friend' };
  if (p) return talkFlash(T.shown, p);
  if (DU.them && DU.them.f) { toast(them.name + ' stopped the game. Your words are saved.'); return talkFinish(); }
  const st = document.getElementById('tstatus');
  if (st) st.textContent = v.themOnline === false ? them.name + ' seems offline…' : them.name + ' picks the word on the other phone';
}

function talkClock(){
  clearInterval(duelTick);
  duelTick = setInterval(() => {
    if (!DU || !DU.talk || DU.screen !== 'talk') return clearInterval(duelTick);
    const el = document.getElementById('dtimer');
    if (el) el.innerHTML = icon('timer') + ' ' + duelClockText();
    if (Date.now() - DU.localStart >= DU.view.maxMs) { clearInterval(duelTick); toast('Time is up!'); talkFinish(); }
  }, 250);
}

// All words played, the time is up, or someone stopped: save my picks (the words I listened to).
function talkFinish(){
  if (!DU || DU.finished || !DU.talk) return;
  clearInterval(duelTick);
  const T = DU.talk, v = DU.view, mine = T.mine.slice(0, TALK_ITEMS / 2);
  const heard = T.items.filter((_, k) => talkDescriber(k) !== v.role), missed = [], right = [];
  mine.forEach((x, j) => { if (heard[j]) (x[0] === '1' ? right : missed).push(heard[j].id); });
  const team = talkPicks(v, T.mine, talkTheirs()).filter(p => p.ok).length;
  const R = { correct: mine.filter(x => x[0] === '1').length, total: mine.length, ms: Math.min(v.maxMs, Math.round(Date.now() - DU.localStart)),
    track: mine.join(','), missed, right };
  Object.assign(DU, { finished: true, score: R.correct, answered: R.total, lastMs: R.ms, screen: 'saving', team });
  store.del(talkKey(v.code));
  saveDuel(R, team + '/' + TALK_ITEMS);
}

function talkTeamCard(){
  const them = duelThem(DU.view), me = meAsPlayer();
  return `<div class="glass panel" id="race" style="padding:14px"><div class="team">
    <div class="tm">${petPic(me, 'happy', 'tmpet')}<b>You</b></div><div class="feed">${icon('chats-circle')} Talk &amp; Tap</div>
    <div class="tm">${petPic(them, 'happy', 'tmpet flip')}<b>${esc(them ? them.name : 'Friend')}</b></div></div></div>`;
}

// Each word of a finished game: who described it, who picked it, and the pick (from both kids' tracks).
function talkRows(B, v){
  const split = s => String(s || '').split(',').filter(String), tracks = { host: split(v.host.track), guest: split(v.guest && v.guest.track) };
  return talkItems(B, v).map((it, k) => {
    const d = talkDescriber(k), l = d === 'host' ? 'guest' : 'host', x = tracks[l][k >> 1], p = x ? x.split(':') : null;
    return { it, describer: v[d], listener: v[l], pick: p ? { ok: p[0] === '1', o: Number(p[2]) } : null };
  });
}

function talkLearn(rows, me){
  const mine = r => r && r.name === me.name;
  const missed = rows.filter(r => r.pick && !r.pick.ok && mine(r.listener)).length;
  const list = rows.map(r => {
    const who = mine(r.listener) ? 'You' : esc(r.listener ? r.listener.name : 'Friend'), by = mine(r.describer) ? 'you' : esc(r.describer ? r.describer.name : 'your friend');
    const res = !r.pick ? 'not played' : r.pick.ok ? who + ' got it' : who + ' picked ' + esc(r.it.options[r.pick.o] || '?');
    return `<div class="lrow"><span class="x ${!r.pick ? 'skip' : r.pick.ok ? 'good' : ''}">${icon(!r.pick ? 'minus' : r.pick.ok ? 'check' : 'x')}</span>
      ${r.it.pic ? `<img class="lpic" src="${picSrc(r.it.word)}" alt="">` : ''}
      <div class="lt"><b>${esc(r.it.word)}</b>${r.it.def ? ': ' + esc(r.it.def) : ''}<br><small>Described by ${by} · ${res}</small></div>
      <button class="btn btn-glass icon-btn tsay" data-say="${esc(r.it.word)}" aria-label="Hear it">${icon('speaker-high')}</button></div>`;
  }).join('');
  return `<div class="glass panel" style="padding:16px">
    <div class="row-flex between"><h2>Learn together</h2>${missed ? `<span class="chip">${missed} to review</span>` : ''}</div>
    <div class="sub mt-s" style="font-size:12.5px">Say each word out loud together. Tap ${icon('speaker-high')} to hear it.</div>
    <div class="stack mt-s" style="gap:8px">${list}</div>
    ${missed ? '<div class="sub mt-s" style="font-size:12px">The words you missed come back in Match it.</div>' : ''}</div>`;
}

// One word read aloud by the phone's English voice.
function sayWord(text){
  if (!('speechSynthesis' in window)) return toast('No sound on this device');
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : 'en-GB';
    if (voice) u.voice = voice;
    u.rate = .9;
    speechSynthesis.speak(u);
  } catch(e){}
}

// ---------- Tug of War (one phone, two players) ----------
// Spec: specs/boss-tug.md. The top half is turned to the second kid; each half has its own questions
// at its player's level. A right answer pulls the knot one step; five steps win.
let TW = null;
const TUG_STEPS = 5, TUG_MS = 120000, TUG_FREEZE = 1500;

function tugSheet(){
  const h = duelsHome, list = (h ? h.friends : []).filter(f => f.ready);

// The second kid types her PIN on this phone; the server checks it.
function tugPin(name){
  let pin = '';
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet glass" style="text-align:center">
    <div class="row-flex between"><span class="label">${esc(name)}, your PIN</span>
      <button class="btn btn-glass icon-btn" style="width:38px;height:38px;font-size:15px" id="x">${icon('x')}</button></div>
    <div class="dots" id="tdots">${'<div class="dot"></div>'.repeat(4)}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="btn btn-glass" data-k="${n}">${n}</button>`).join('')}
      <span></span><button class="btn btn-glass" data-k="0">0</button><button class="btn btn-glass" data-k="del">${icon('backspace')}</button></div>
    <div class="sub mt-s" style="font-size:12px">So the game saves XP for both of you.</div>
  </div>`;

  const paint = () => dots.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i < pin.length));
  ov.querySelector('#x').onclick = () => ov.remove();
  pad.onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.k === 'del') pin = pin.slice(0, -1); else if (pin.length < 4) pin += b.dataset.k;
    paint();
    if (pin.length < 4) return;
    pad.classList.add('busy');
    try { const mate = await call('apiTugCheck', name, pin); ov.remove(); tugStart(mate, mate.token || pin); }
    catch(err){ toast(err.message.includes('PIN') ? 'Wrong PIN, try again' : err.message, true); pin = ''; paint(); pad.classList.remove('busy'); dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); }
