<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Quest</title>
<meta name="theme-color" content="#ece6e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Quest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
:root{
  --ink:#1c1e2b; --muted:#6b7083; --faint:#9aa0b2;
  --primary:#6366f1; --primary-2:#8b8ffb; --teal:#3cc7b6; --teal-2:#b9f5ec; --orange:#f6a04d;
  --danger:#e8687a;
  --glass:linear-gradient(140deg,rgba(255,255,255,.52),rgba(255,255,255,.2));
  --glass-soft:linear-gradient(140deg,rgba(255,255,255,.42),rgba(255,255,255,.14));
  --stroke:rgba(255,255,255,.72);
  --shadow:0 26px 50px -18px rgba(38,40,80,.28);
  --inner:inset 0 1px 1px rgba(255,255,255,.95), inset 0 -1px 1px rgba(255,255,255,.3);
  --iri:conic-gradient(from 200deg,#a5b4fc,#99f6e4,#f9a8d4,#fde68a,#c4b5fd,#a5b4fc);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,#f4ede5 0%,#e9e3dd 38%,#b8c2cf 78%,#7d8a9c 100%);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;
}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:float 18s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:#a5a8ff;top:-80px;left:-90px}
.b2{width:300px;height:300px;background:#8ff0e2;top:32%;right:-110px;animation-delay:-6s}
.b3{width:280px;height:280px;background:#ffc79a;bottom:-60px;left:-40px;animation-delay:-11s;opacity:.6}
.b4{width:220px;height:220px;background:#f5b8e8;bottom:22%;right:12%;animation-delay:-3s;opacity:.5}
@keyframes float{to{transform:translate(40px,60px) scale(1.12)}}

#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:20px 16px 48px}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--stroke);box-shadow:var(--shadow),var(--inner);border-radius:30px}
.soft{background:var(--glass-soft);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid rgba(255,255,255,.62);box-shadow:0 14px 28px -16px rgba(38,40,80,.3),var(--inner);border-radius:22px}
.panel{padding:24px 20px}
.iri{position:relative}
.iri::before{content:'';position:absolute;inset:0;padding:2px;border-radius:inherit;background:var(--iri);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

h1{font-size:30px;font-weight:800;letter-spacing:-.6px;margin:0}
h2{font-size:18px;font-weight:700;margin:0}
.sub{color:var(--muted);font-size:15px;margin-top:4px}
.label{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.row-flex{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.mt{margin-top:18px}.mt-s{margin-top:10px}

.btn{border:0;font:inherit;font-weight:700;font-size:16px;height:52px;padding:0 24px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .15s ease,filter .15s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-primary{color:#fff;background:linear-gradient(180deg,var(--primary-2),var(--primary));
  box-shadow:0 16px 30px -12px rgba(99,102,241,.75),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-teal{color:#0e4440;background:linear-gradient(180deg,var(--teal-2),#86e0d4);
  box-shadow:0 16px 30px -12px rgba(60,199,182,.7),inset 0 1px 0 rgba(255,255,255,.8)}
.btn-glass{color:var(--ink);background:var(--glass);border:1px solid var(--stroke);box-shadow:0 10px 24px -14px rgba(38,40,80,.4),var(--inner)}
.btn-block{width:100%}
.btn-sm{height:38px;font-size:14px;padding:0 16px}
.icon-btn{width:46px;height:46px;border-radius:50%;padding:0;font-size:18px}

.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);color:var(--ink)}
.chip.purple{background:rgba(99,102,241,.14);color:#4338ca;border-color:rgba(99,102,241,.25)}
.chip.teal{background:rgba(60,199,182,.16);color:#0f766e;border-color:rgba(60,199,182,.3)}
.chip.orange{background:rgba(246,160,77,.18);color:#b45309;border-color:rgba(246,160,77,.35)}
.chip.red{background:rgba(232,104,122,.15);color:#be123c;border-color:rgba(232,104,122,.3)}

[class^="ph-"],[class*=" ph-"]{line-height:1}
.icon-btn i{font-size:20px}
.btn i{font-size:18px}
.tile{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;font-size:22px;
  box-shadow:0 10px 18px -10px var(--tc),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.08)}
.tile.sm{width:32px;height:32px;border-radius:11px;font-size:18px}
.t-level{background:linear-gradient(145deg,#fda4af,#e11d48);--tc:#e11d48}
.t-grammar{background:linear-gradient(145deg,#a5b4fc,#4f46e5);--tc:#4f46e5}
.t-vocab{background:linear-gradient(145deg,#d8b4fe,#9333ea);--tc:#9333ea}
.t-listen{background:linear-gradient(145deg,#5eead4,#0d9488);--tc:#0d9488}
.t-read{background:linear-gradient(145deg,#7dd3fc,#0284c7);--tc:#0284c7}
.t-write{background:linear-gradient(145deg,#fcd34d,#d97706);--tc:#d97706}
.t-uoe{background:linear-gradient(145deg,#f9a8d4,#db2777);--tc:#db2777}
.t-fire{background:linear-gradient(145deg,#fdba74,#ea580c);--tc:#ea580c}
.t-star{background:linear-gradient(145deg,#fde68a,#d97706);--tc:#d97706}
.t-target{background:linear-gradient(145deg,#a5b4fc,#4f46e5);--tc:#4f46e5}
.tile.ghost{background:rgba(255,255,255,.7);color:var(--faint);--tc:transparent;border:1px solid rgba(255,255,255,.9)}
.tile.ghost.on{color:#4f46e5;--tc:rgba(99,102,241,.6)}
.box i{font-size:15px;color:var(--faint)}
.cell i{font-size:17px}
/* Home */
.word-card{padding:18px 20px;border-radius:26px;background:linear-gradient(155deg,rgba(196,181,253,.78),rgba(165,180,252,.55) 45%,rgba(153,246,228,.72));
  border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow),var(--inner)}
.word{font-size:28px;font-weight:800;letter-spacing:-.4px;margin-top:4px}
.who{display:grid;gap:14px}
.who button{height:72px;border-radius:999px;justify-content:flex-start;padding:0 12px;font-size:20px}
.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;flex:none;
  box-shadow:0 10px 20px -8px currentColor,inset 0 1px 0 rgba(255,255,255,.5)}
.who .age{margin-left:auto;margin-right:10px;color:var(--muted);font-size:14px;font-weight:600}

/* PIN */
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0}
.dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);transition:.2s}
.dot.on{background:linear-gradient(180deg,var(--primary-2),var(--primary));box-shadow:0 6px 14px -4px rgba(99,102,241,.8)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:300px;margin:0 auto}
.pad button{height:68px;border-radius:24px;font-size:24px;font-weight:700}
.shake{animation:shake .4s}
.pad.busy{opacity:.4;pointer-events:none;transition:opacity .2s}
.dots.pulse .dot{animation:pulse 1s ease-in-out infinite}
.dots.pulse .dot:nth-child(2){animation-delay:.15s}.dots.pulse .dot:nth-child(3){animation-delay:.3s}.dots.pulse .dot:nth-child(4){animation-delay:.45s}
@keyframes pulse{50%{transform:scale(1.4);opacity:.55}}
.mini-spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(99,102,241,.25);border-top-color:var(--primary);
  animation:spin .8s linear infinite;vertical-align:-2px;margin-right:8px}
#app>*{animation:fade .25s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.toggle{width:58px;height:32px;border-radius:999px;position:relative;cursor:pointer;flex:none;
  background:linear-gradient(90deg,#8b8ffb,#a5b4fc);box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
.toggle.off{background:rgba(255,255,255,.55)}
.toggle::after{content:'';position:absolute;top:3px;left:29px;width:26px;height:26px;border-radius:50%;background:var(--orange);
  box-shadow:0 4px 10px -2px rgba(246,160,77,.8);transition:.2s}
.toggle.off::after{left:3px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}

/* Dashboard */
.hero{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.ring-wrap{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring-wrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring-center{width:92px;height:92px;border-radius:30px;display:grid;place-items:center;text-align:center}
.ring-num{font-size:26px;font-weight:800;line-height:1}
.ring-cap{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.stat{padding:10px 14px;display:flex;align-items:center;gap:10px}
.stat b{font-size:20px}
.stat span{color:var(--muted);font-size:13px;font-weight:600}
.stat .tile{color:#fff}
.today{padding:22px 20px;border-radius:30px;background:linear-gradient(155deg,rgba(196,181,253,.8),rgba(165,180,252,.55) 45%,rgba(153,246,228,.75));
  border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow),var(--inner)}
.today h2{font-size:21px;line-height:1.25;margin-top:8px}
.today .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.done-badge{display:flex;align-items:center;gap:14px;margin-top:16px}
.big-check{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.75);box-shadow:var(--inner),0 10px 20px -10px rgba(99,102,241,.6)}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:default}
.task.clickable{cursor:pointer}
.box{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.75);
  border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.task-main{flex:1;min-width:0}
.task-top{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.task-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.future{opacity:.5}
.task.missed .task-title{color:var(--muted)}
.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.55);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--primary-2),#7dd3fc,var(--teal))}
.reward{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,.5)}
.reward:last-child{border:0}
.reward .pts{margin-left:auto;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}
.reward.got .pts{color:#4338ca}

/* Sheet */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(40,44,70,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:linear-gradient(140deg,rgba(255,255,255,.9),rgba(255,255,255,.72));width:100%;max-width:480px;margin:0 8px 8px;padding:24px 20px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(60px);opacity:0}}
.score-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;margin-top:16px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px 6px}
.field input{width:100%;height:64px;border-radius:22px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.7);
  font:inherit;font-size:28px;font-weight:800;text-align:center;color:var(--ink);box-shadow:inset 0 2px 4px rgba(0,0,0,.06);outline:none}
.field input:focus{border-color:#a5b4fc;box-shadow:0 0 0 4px rgba(165,180,252,.35)}
.slash{font-size:28px;font-weight:300;color:var(--faint);padding-bottom:14px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.levels button{height:50px;border-radius:18px;font-size:17px}
.levels button.sel{color:#fff;background:linear-gradient(180deg,var(--primary-2),var(--primary));border-color:transparent}

/* Parent */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.cell{border-radius:14px;padding:8px 0 6px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.7)}
.cell .v{font-size:13px;margin-top:4px;color:var(--ink);height:18px}
.cell.done{background:linear-gradient(180deg,rgba(139,143,251,.9),rgba(99,102,241,.9));color:rgba(255,255,255,.85)}
.cell.done .v{color:#fff}
.cell.missed{background:rgba(232,104,122,.14);border-color:rgba(232,104,122,.35)}
.cell.pending{border:2px dashed rgba(99,102,241,.5)}
.cell.future{opacity:.45}
.hist{display:flex;gap:6px;align-items:flex-end;height:50px;margin-top:8px}
.hist div{flex:1;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#a5b4fc,#6366f1);min-height:4px}
.recent{font-size:13px;margin-top:10px}
.recent div{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.5)}
.recent div span:nth-child(2){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);margin-top:12px;list-style:none}
summary::-webkit-details-marker{display:none}
.acc>summary.acc-head{margin:0;padding:14px 16px;border-radius:24px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  color:var(--ink);font-size:inherit;font-weight:inherit;user-select:none}
.acc>summary.acc-head .sub i{font-size:12px;vertical-align:-1px}
.acc-chev{display:inline-flex;font-size:20px;color:var(--muted);transition:transform .25s;flex:none}
.acc[open]>summary .acc-chev{transform:rotate(180deg)}
.acc-body{margin-top:14px}
.acc[open]>.acc-body{animation:fade .25s}
.input{width:100%;min-width:0;height:50px;border-radius:18px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.65);
  font:inherit;font-size:15px;font-weight:600;padding:0 16px;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.input:focus{border-color:#a5b4fc;box-shadow:0 0 0 4px rgba(165,180,252,.35)}
select.input{cursor:pointer;padding-right:40px;background-repeat:no-repeat;background-size:6px 6px,6px 6px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px}
textarea{width:100%;min-height:150px;border-radius:20px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.65);
  font:inherit;font-size:14px;padding:14px;color:var(--ink);resize:vertical;outline:none}

.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:40;padding:12px 20px;font-weight:700;border-radius:22px;
  animation:fade .2s;width:max-content;max-width:calc(100vw - 32px);text-align:center;line-height:1.35}
.toast.err{color:#be123c}
.spinner{width:42px;height:42px;border-radius:50%;margin:80px auto;border:4px solid rgba(255,255,255,.6);border-top-color:var(--primary);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.confetti{position:fixed;top:-20px;z-index:50;width:9px;height:14px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
.celebrate{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none}
.celebrate .glass{padding:26px 34px;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.celebrate .pts{font-size:44px;font-weight:800;background:linear-gradient(90deg,#6366f1,#3cc7b6);-webkit-background-clip:text;background-clip:text;color:transparent}
a{color:inherit}

/* Pets */
.pet-card{display:grid;grid-template-columns:128px minmax(0,1fr);gap:14px;align-items:center;padding:16px 18px 18px}
.pet-img{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 14px rgba(38,40,80,.22));cursor:pointer;-webkit-user-select:none;user-select:none}
.pet-img.bounce{animation:bounce .65s}
@keyframes bounce{30%{transform:translateY(-14px) scale(1.05)}60%{transform:translateY(0) scale(.97)}}
.pet-name{font-size:21px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble{position:relative;margin-top:8px;padding:9px 12px;border-radius:16px;background:rgba(255,255,255,.78);font-size:13.5px;font-weight:600;color:#3b3f55;line-height:1.35;border:1px solid rgba(255,255,255,.95)}
.bubble::before{content:'';position:absolute;left:-7px;top:14px;border:7px solid transparent;border-right-color:rgba(255,255,255,.85);border-left:0}
.xp-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.pet-face{width:50px;height:50px;border-radius:50%;flex:none;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 20px -10px rgba(38,40,80,.35)}
.pet-face img{width:94px;height:94px;max-width:none;flex:none;object-fit:contain;margin-top:-1px}
.pick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{padding:12px 8px 14px;border-radius:26px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);border:2px solid rgba(255,255,255,.75)}
.pick img{width:100%;max-width:130px;aspect-ratio:1;object-fit:contain;display:block;margin:0 auto}
.pick b{display:block;font-size:16px;margin-top:4px}
.pick.sel{border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,.18),var(--shadow)}
.evo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.evo>div{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.evo .slot{aspect-ratio:1;border-radius:16px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);display:grid;place-items:center;margin-bottom:4px;font-size:18px;color:var(--faint)}
.evo .slot img{width:92%;height:92%;object-fit:contain}
.evo .slot.now{border:2px solid var(--primary)}
.sheet .pet-big{width:170px;max-width:60%;display:block;margin:0 auto;filter:drop-shadow(0 14px 14px rgba(38,40,80,.2))}

/* Games */
.game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game-tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:24px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;position:relative;border:1px solid rgba(255,255,255,.62)}
.game-tile b{font-size:16px}
.game-tile span.sub{margin:0;font-size:12.5px;line-height:1.3}
.game-tile .chip{position:absolute;top:10px;right:10px;height:24px;font-size:11px;padding:0 9px}
.game-tile.rec{border:2px solid rgba(99,102,241,.55)}
.game-tile.locked{cursor:default;opacity:.6;filter:saturate(.6)}

/* Opening animation */
#app{transition:opacity .45s ease}
body.splashing #app{opacity:0}
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;cursor:pointer;-webkit-user-select:none;user-select:none;
  background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.6),rgba(255,255,255,0) 62%);transition:opacity .45s ease,transform .45s ease}
.splash.out{opacity:0;transform:scale(1.12);pointer-events:none}
.splash-stage{position:relative;width:min(88vw,400px);aspect-ratio:1}
.splash img{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s;filter:drop-shadow(0 8px 8px rgba(38,40,80,.25))}
.splash img.ok{opacity:1}
.orbit{position:absolute;inset:0;animation:spin 18s linear infinite;transition:opacity .4s}
.orbit .slot{position:absolute;left:40.5%;top:40.5%;width:19%;height:19%;transform:rotate(var(--a)) translateX(205%) rotate(calc(-1 * var(--a)))}
.orbit .up{width:100%;height:100%;animation:spin 18s linear infinite reverse}
.orbit .pop{width:100%;height:100%;animation:petIn .55s cubic-bezier(.3,1.7,.5,1) both;animation-delay:var(--d)}
.orbit img.hop{animation:hop .5s ease}
@keyframes petIn{from{transform:scale(0) rotate(-25deg);opacity:0}}
@keyframes hop{50%{transform:translateY(-30%) scale(1.12)}}
.portal{position:absolute;inset:23%;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:linear-gradient(140deg,rgba(255,255,255,.72),rgba(255,255,255,.32));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.85);box-shadow:0 30px 60px -24px rgba(38,40,80,.4),inset 0 1px 1px rgba(255,255,255,.95);
  animation:portalIn .65s cubic-bezier(.2,1.5,.4,1) both}
.portal::before{content:'';position:absolute;inset:-4px;border-radius:50%;padding:4px;background:var(--iri);pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite}
@keyframes portalIn{from{transform:scale(.3);opacity:0}}
.portal-in{display:grid;justify-items:center;gap:3px;padding:10px}
.ptitle{font-size:clamp(17px,5.2vw,23px);font-weight:800;letter-spacing:-.4px;line-height:1.1}
.psub{font-size:12px;font-weight:700;color:var(--muted)}
.splash .me{display:none;width:46%;height:auto}
.splash.hello .me{display:block;animation:petIn .6s cubic-bezier(.3,1.7,.5,1) both}
.splash.hello .orbit{opacity:.3}
.splash.shine .ptitle{background:linear-gradient(90deg,var(--ink) 25%,#8b8ffb 42%,#3cc7b6 52%,var(--ink) 70%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.1s ease forwards}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
.spark{position:absolute;left:var(--x);top:var(--y);width:6px;height:6px;border-radius:50%;background:#fff;opacity:0;pointer-events:none;
  box-shadow:0 0 10px 3px rgba(253,230,138,.85);animation:twinkle 1.7s ease-in-out infinite;animation-delay:var(--t)}
@keyframes twinkle{50%{opacity:1;transform:scale(1.4)}}
.splash.still *{animation:none!important}
.splash.still img{opacity:1}
.gscreen{display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 68px)}
.gtop{display:flex;align-items:center;gap:12px}
.gtop h2{flex:1;font-size:20px}
.react{display:flex;align-items:center;gap:12px;min-height:100px}
.react .bubble{margin:0;flex:1;font-size:15px;font-weight:800;color:var(--ink)}
.react .bubble.ok{color:#047857}
.react .bubble.no{color:#be123c}
.gpet{width:100px;height:100px;object-fit:contain;object-position:bottom;flex:none;filter:drop-shadow(0 10px 10px rgba(38,40,80,.2));transition:transform .25s}
.gpet.pop{transform:scale(1.12) rotate(-4deg)}
.gprog{display:flex;gap:6px}
.gprog i{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.65)}
.gprog i.on{background:linear-gradient(90deg,var(--primary-2),var(--primary))}
.gprog i.ok{background:#34d399}
.gprog i.no{background:var(--danger)}
.qcard{padding:18px 16px;display:grid;gap:10px;justify-items:center;text-align:center}
.qprompt{font-size:14px;color:var(--muted);font-weight:700}
.qbig{font-size:20px;font-weight:700;line-height:1.35}
.qpic{width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(38,40,80,.18))}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{font:inherit;font-weight:700;font-size:16px;min-height:56px;padding:8px 12px;border-radius:20px;cursor:pointer;color:var(--ink);
  background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 20px -14px rgba(38,40,80,.45),var(--inner);transition:transform .12s}
.opt:active{transform:scale(.97)}
.opt.ok{background:linear-gradient(180deg,#a7f3d0,#6ee7b7);border-color:#34d399}
.opt.no{background:linear-gradient(180deg,#fecdd3,#fda4af);border-color:#fb7185}
.opt[disabled]{cursor:default}
.speak-row{display:flex;gap:12px;align-items:center;justify-content:center}
.speak{width:92px;height:92px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:40px;
  background:linear-gradient(145deg,#5eead4,#0d9488);box-shadow:0 18px 30px -14px #0d9488,inset 0 1px 0 rgba(255,255,255,.5)}
.speak.talk{animation:talk 1s ease-in-out infinite}
@keyframes talk{50%{transform:scale(1.08)}}
.slots{min-height:100px;width:100%;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;padding:10px;border-radius:20px;border:2px dashed rgba(99,102,241,.35);background:rgba(255,255,255,.35)}
.bank{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.tok{font:inherit;font-weight:700;font-size:16px;min-height:42px;padding:0 13px;border-radius:14px;cursor:pointer;color:var(--ink);
  background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);box-shadow:0 8px 16px -12px rgba(38,40,80,.5)}
.tok.used{visibility:hidden}
.tok.placed{background:linear-gradient(180deg,#e0e7ff,#c7d2fe)}
.tok.fixed{background:linear-gradient(180deg,#a7f3d0,#6ee7b7)}
.tok.wrongpick{background:linear-gradient(180deg,#fecdd3,#fda4af)}
.tok s{opacity:.55;margin-right:5px;font-weight:600}
.sentence{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.answer-box{padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.7);font-size:14px;line-height:1.4;text-align:left}
.answer-box b{color:#047857}
.fb{min-height:22px;font-weight:800;font-size:15px;text-align:center}
.fb.ok{color:#047857}.fb.no{color:#be123c}
.xp-pop{position:fixed;z-index:30;font-weight:800;font-size:22px;color:#4338ca;pointer-events:none;animation:xpfly 1s ease-out forwards}
@keyframes xpfly{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
.result{flex:1;display:grid;place-items:center;align-content:center;text-align:center;gap:12px}
.result .pet-img{width:170px;cursor:default}
.saved{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(16,185,129,.14);color:#047857;font-weight:700;font-size:13px}
.saved.wait{background:rgba(99,102,241,.12);color:#4338ca}
.saved.err{background:rgba(232,104,122,.14);color:#be123c}

/* Pet grows */
.evolve{position:fixed;inset:0;z-index:60;display:grid;place-items:center;text-align:center;color:#fff;padding:24px;
  background:radial-gradient(circle at 50% 38%,#5b4fd0 0%,#2a2366 48%,#15123a 100%);animation:fade .3s}
.evolve canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.evolve .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.evolve .flash.go{animation:flash .7s ease-out}
@keyframes flash{30%{opacity:.95}to{opacity:0}}
.evolve .halo{position:relative;width:240px;height:240px;margin:0 auto}
.evolve .halo::before{content:'';position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(253,230,138,.55),rgba(253,230,138,0) 65%)}
.evolve .halo img{position:absolute;inset:16px;width:calc(100% - 32px);height:calc(100% - 32px);object-fit:contain;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.evolve h1{font-size:34px;color:#fff;background:linear-gradient(90deg,#fde68a,#f9a8d4,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:10px}
.evolve .sub{color:rgba(255,255,255,.82);font-weight:600}
.evolve .reveal{transition:opacity .5s,transform .5s}
.evolve .hide{opacity:0;transform:translateY(10px)}

/* Journey: --wa/--wb = the world's colours, --wbg1/--wbg2 = its background, --na/--nb = the next world's */
.jcard{display:block;padding:16px 18px 18px;border-radius:28px;cursor:pointer;color:var(--ink);
  background:linear-gradient(150deg,var(--wbg1),var(--wbg2));border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow),var(--inner)}
.wtile{background:linear-gradient(145deg,var(--wa),var(--wb));--tc:var(--wb)}
.jtrack{display:grid;gap:3px}
.jtrack i{height:9px;border-radius:4px;background:rgba(255,255,255,.72);box-shadow:inset 0 1px 1px rgba(0,0,0,.05)}
.jtrack i.on{background:linear-gradient(180deg,var(--wa),var(--wb));box-shadow:none}
.jlink{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:800;color:var(--wb);white-space:nowrap}
.jrules{display:grid;gap:9px;margin-top:14px;font-size:13px;font-weight:600;color:#3b3f55}
.jrules div{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.jrules i{font-size:18px;color:var(--wb);flex:none}
/* The top of the map screen (back, worlds, world card) stays on screen while the map scrolls under it */
.mapbar{position:sticky;top:0;z-index:6;margin:-20px -16px 0;padding:12px 16px;display:grid;gap:10px;
  background:linear-gradient(180deg,rgba(244,239,233,.93),rgba(238,234,238,.86));
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,.7);box-shadow:0 16px 30px -22px rgba(38,40,80,.5)}
.wstrip{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:flex-end;gap:2px}
.wdot{flex:1;display:grid;justify-items:center;gap:4px;font-size:10.5px;font-weight:800;color:var(--faint)}
.wball{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:16px;color:var(--faint);
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 16px -10px rgba(38,40,80,.35)}
.wdot.done{color:var(--muted)}
.wdot.done .wball,.wdot.cur .wball{color:#fff;background:linear-gradient(145deg,var(--wa),var(--wb));border-color:rgba(255,255,255,.75)}
.wdot.cur{color:var(--ink)}
.wdot.cur .wball{width:42px;height:42px;border-radius:15px;font-size:21px;box-shadow:0 12px 22px -10px var(--wb),inset 0 1px 0 rgba(255,255,255,.55)}
.map{position:relative;width:100%;border-radius:32px;overflow:hidden;border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow),var(--inner);
  background:radial-gradient(240px 240px at 12% 9%,rgba(255,255,255,.6),rgba(255,255,255,0)),radial-gradient(280px 280px at 92% 33%,rgba(255,255,255,.5),rgba(255,255,255,0)),
    radial-gradient(260px 260px at 8% 61%,rgba(255,255,255,.5),rgba(255,255,255,0)),radial-gradient(300px 300px at 88% 88%,rgba(255,255,255,.55),rgba(255,255,255,0)),
    linear-gradient(180deg,var(--wbg2) 0%,var(--wbg1) 45%,var(--wbg2) 100%)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.mdeco{position:absolute;color:var(--wb);opacity:.22;pointer-events:none;line-height:1}
.mnode{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;display:grid;place-items:center;padding:0;
  font:inherit;font-weight:800;font-size:14px;color:var(--muted);background:rgba(255,255,255,.75);border:2px solid rgba(255,255,255,.95);
  box-shadow:0 10px 18px -10px rgba(38,40,80,.45),var(--inner)}
.mnode.done{color:#fff;font-size:20px;cursor:pointer;background:linear-gradient(145deg,var(--wa),var(--wb));border-color:rgba(255,255,255,.85)}
.mnode.cur{width:56px;height:56px;margin:-28px 0 0 -28px;color:var(--wb);font-size:17px;background:#fff;border:3px solid var(--wb);cursor:pointer}
.mnode.cur::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--wa);animation:ping 1.8s ease-out infinite;pointer-events:none}
@keyframes ping{from{transform:scale(.8);opacity:.9}to{transform:scale(1.3);opacity:0}}
.mstar{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;
  background:linear-gradient(145deg,#fde68a,#f59e0b);border:2px solid #fff}
.mpet{position:absolute;width:78px;height:78px;margin:-46px 0 0 -39px;object-fit:contain;object-position:bottom;pointer-events:none;
  filter:drop-shadow(0 10px 10px rgba(38,40,80,.25));animation:hover 2.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-6px)}}
.mgate{position:absolute;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:30px;padding:0;display:grid;place-items:center;font-size:44px;cursor:pointer;
  color:var(--faint);background:rgba(255,255,255,.78);border:3px solid rgba(255,255,255,.95);box-shadow:var(--shadow),var(--inner)}
.mgate.open,.mgate.top{color:#fff;background:linear-gradient(145deg,var(--na),var(--nb))}
.mgate.open{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,255,255,.55),0 18px 50px -6px var(--nb)}}
.mtag{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;box-shadow:0 8px 16px -10px rgba(38,40,80,.35)}
.gate-hero{width:120px;height:120px;border-radius:38px;display:grid;place-items:center;font-size:60px;color:#fff;
  background:linear-gradient(145deg,var(--na),var(--nb));box-shadow:0 24px 40px -18px var(--nb),inset 0 1px 0 rgba(255,255,255,.55)}
/* Level up */
.lvbadge{position:absolute;inset:30px;border-radius:50%;display:grid;place-items:center;font-size:66px;font-weight:800;color:#fff;letter-spacing:-1px;
  background:linear-gradient(145deg,var(--wa),var(--wb));border:4px solid rgba(255,255,255,.7);box-shadow:0 0 60px rgba(253,230,138,.35),inset 0 2px 0 rgba(255,255,255,.5);
  transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.evolve .halo img.lvpet{inset:auto -30px -16px auto;width:130px;height:130px}
.cert{margin-top:14px;padding:14px 16px;border-radius:22px;display:grid;gap:3px;
  background:linear-gradient(140deg,rgba(255,255,255,.22),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.35)}
.cert small{font-size:11px;font-weight:700;letter-spacing:1.4px;color:rgba(255,255,255,.72)}
.cert b{font-size:18px}
.unlock{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.unlock span{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.btn-ghost{color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3)}
/* Play together */
.t-together{background:linear-gradient(145deg,#8b8ffb,#3cc7b6);--tc:#3cc7b6}
.gdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.2)}
.friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.fr{display:grid;justify-items:center;align-content:start;gap:2px;padding:10px 4px 9px;border-radius:20px;font:inherit;color:var(--ink);cursor:pointer;
  background:rgba(255,255,255,.52);border:1px solid rgba(255,255,255,.88);transition:transform .12s}
.fr:active{transform:scale(.96)}
.fr b{font-size:14px;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr small{font-size:11px;font-weight:700;color:var(--muted)}
.fr small.ok{color:#047857}
.fr.off{opacity:.55}
.fr .av{position:relative;display:block}
.fr .av .pet-face,.fr .av .avatar{width:54px;height:54px}
.fr .av .pet-face img{width:100px;height:100px}
.fr .av .on{position:absolute;right:0;bottom:2px;width:14px;height:14px;border-radius:50%;background:#10b981;border:2.5px solid #fff}
.addc{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--primary);font-size:22px;border:2px dashed rgba(99,102,241,.45);background:rgba(255,255,255,.5)}
.drow,.mrow{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;font:inherit;color:var(--ink);text-align:left;cursor:pointer;border-radius:20px}
.drow .avatar,.drow .pet-face{width:42px;height:42px}
.drow .pet-face img{width:78px;height:78px}
.drow-main{flex:1;min-width:0;display:block}
.drow-main b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow-main small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.mrow{background:rgba(255,255,255,.72);border:1.5px solid rgba(255,255,255,.95);box-shadow:0 8px 16px -14px rgba(38,40,80,.5)}
.mrow.sel{border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,.14)}
.mrow[disabled]{opacity:.6}
.radio{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;color:transparent;font-size:13px;border:2px solid rgba(99,102,241,.35)}
.mrow.sel .radio{color:#fff;border-color:transparent;background:linear-gradient(180deg,var(--primary-2),var(--primary))}
.code-in{text-transform:uppercase;letter-spacing:6px;font-size:22px;font-weight:800;text-align:center}
.codebig{font-size:46px;font-weight:800;letter-spacing:8px;color:#4338ca;margin:2px 0 8px}
.duel-banner h2{font-size:19px}
#together .chip{white-space:nowrap;flex:none}
.duo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:4px}
.side{display:grid;justify-items:center;gap:4px;min-width:0;transition:opacity .3s}
.side img,.side .duel-av{width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 12px 12px rgba(38,40,80,.25))}
.side b{font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side.wait{opacity:.5}
.duel-av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;font-size:40px;flex:none}
.flip{transform:scaleX(-1)}
.count{position:relative;width:84px;height:84px;margin-bottom:46px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:800;color:#4338ca;
  background:linear-gradient(140deg,rgba(255,255,255,.92),rgba(255,255,255,.55));box-shadow:0 18px 30px -16px rgba(38,40,80,.45)}
.count::before{content:'';position:absolute;inset:-4px;border-radius:50%;padding:4px;background:var(--iri);animation:spin 5s linear infinite;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.count i{font-size:32px;color:var(--faint)}
.race{padding:18px 14px 10px;display:grid;gap:9px}
.lane{display:grid;grid-template-columns:76px minmax(0,1fr) 20px;align-items:center;gap:8px}
.lwho{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;min-width:0}
.lwho span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lwho .pet-face,.lwho .avatar{width:26px;height:26px;box-shadow:none;font-size:12px}
.lwho .pet-face img{width:50px;height:50px}
.track{position:relative;height:28px;border-radius:999px;background:rgba(255,255,255,.62);box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.track .stn{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(99,102,241,.25)}
.track .fin{position:absolute;right:-3px;top:50%;margin-top:-9px;font-size:18px;color:var(--muted)}
.runner{position:absolute;bottom:3px;width:40px;height:40px;margin-left:-20px;object-fit:contain;object-position:bottom;transition:left .6s cubic-bezier(.3,1.4,.5,1);
  filter:drop-shadow(0 4px 4px rgba(38,40,80,.25))}

function confettiCanvas(cv){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, ctx = cv.getContext('2d');
  cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.scale(dpr, dpr);
  const cols = ['#fde68a', '#f9a8d4', '#a5b4fc', '#99f6e4', '#fdba74', '#fff'], P = [];
  for (let i = 0; i < 150; i++) P.push({ x: r.width / 2, y: r.height * .38, vx: (Math.random() - .5) * 10, vy: -Math.random() * 10 - 2,
    s: Math.random() * 6 + 4, c: cols[i % cols.length], a: Math.random() * 6, va: (Math.random() - .5) * .3 });
  const t0 = performance.now();
  (function f(t){
    ctx.clearRect(0, 0, r.width, r.height);
    P.forEach(p => { p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - t0 < 3400) requestAnimationFrame(f); else ctx.clearRect(0, 0, r.width, r.height);
  })(t0);
}

const BANK_V = 1, ROUND = 5;
const LV_ORDER = ['a1', 'a2', 'b1', 'b2', 'c1'];
const NEXT_LV = { a1: 'a2', a2: 'b1', b1: 'b2', b2: 'c1' };
let bankPromise = null, bankIndex = null, G = null;
function loadBank(){
  if (window.EQ_GAMES) return Promise.resolve(window.EQ_GAMES);
  return bankPromise = bankPromise || new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = ASSETS + 'games.js?v=' + BANK_V;
    s.onload = () => res(window.EQ_GAMES);
    s.onerror = () => { bankPromise = null; s.remove(); rej(new Error('Could not load the games. Check the connection and try again.')); };
    document.head.appendChild(s);
  });
}
const shuffle = (a, rnd = Math.random) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const idKey = w => String(w).replace(/[^A-Za-z0-9-]/g, '_');
const picSrc = w => ASSETS + 'pics/' + String(w).replace(/ /g, '-') + '.webp';
// A B1+ kid plays B1 and B2 items together.
const kidLevels = lv => lv === 'b1-b2' ? ['b1', 'b2'] : [LV_ORDER.indexOf(lv) >= 0 ? lv : 'a2'];

function bankItems(B, game, lv){
  if (game === 'match') {
    const out = (B.match[lv] || []).map(([w, def]) => ({ id: 'm:' + lv + ':' + idKey(w), kind: 'def', word: w, def, lv }));
    if (lv === 'a1') Object.keys(B.pics).forEach(t => B.pics[t].forEach(w => out.push({ id: 'p:' + idKey(w), kind: 'pic', word: w, topic: t, lv })));
    return out;
  }
  return (B[game][lv] || []).map((x, i) => ({ id: game[0] + ':' + lv + ':' + i, data: x, lv }));
}
function itemById(B, id){
  if (!bankIndex) {
    bankIndex = {};
    Object.keys(GAME_INFO).forEach(g => LV_ORDER.forEach(lv => bankItems(B, g, lv).forEach(x => { bankIndex[x.id] = x; })));
  }
  return bankIndex[id];
}
const seenKey = () => 'eq_seen_' + (session ? session.name : '');

// Five items: up to two missed items that are due again, then new ones (not seen lately).
// Two strong rounds in a row swap one item for the next level.
function makeRound(B, game){
  const levels = kidLevels(dash.girl.level);
  const pool = [].concat(...levels.map(l => bankItems(B, game, l)));
  const pre = game === 'match' ? ['m:', 'p:'] : [game[0] + ':'];
  const due = (dash.games.review || []).filter(id => pre.some(p => id.indexOf(p) === 0)).map(id => itemById(B, id)).filter(Boolean).slice(0, 2);
  const taken = new Set(due.map(x => x.id)), seen = store.get(seenKey()) || [];
  let fresh = shuffle(pool.filter(x => !taken.has(x.id) && seen.indexOf(x.id) < 0));
  if (fresh.length + due.length < ROUND) fresh = fresh.concat(shuffle(pool.filter(x => !taken.has(x.id) && fresh.indexOf(x) < 0)));
  const items = due.concat(fresh).slice(0, ROUND);
  const recent = (dash.games.recent || {})[game] || [], nxt = levels.length === 1 ? NEXT_LV[levels[0]] : null;
  if (nxt && recent.length >= 2 && recent.slice(-2).every(p => p >= 90)) {
    const extra = shuffle(bankItems(B, game, nxt))[0];
    if (extra) items[items.length - 1] = extra;
  }
  return shuffle(items).map(x => prepare(B, game, x));
}

// Each prepared item knows its game, so one round can mix games (the gate challenge).
const prepare = (B, game, x, rnd) => Object.assign(prepareItem(B, game, x, rnd), { game });
function prepareItem(B, game, x, rnd){
  if (game === 'match') {
    const others = x.kind === 'pic' ? B.pics[x.topic].filter(w => w !== x.word) : B.match[x.lv].map(m => m[0]).filter(w => w !== x.word);
    return Object.assign({ answer: x.word, options: shuffle([x.word].concat(shuffle(others, rnd).slice(0, 3)), rnd) }, x);
  }
  if (game === 'listen') {
    const [say, q, a, ...wrong] = x.data;
    return Object.assign({ say, q: q || 'Which word do you hear?', answer: a, options: shuffle([a].concat(wrong), rnd) }, x);
  }
  if (game === 'build') {
    const words = x.data.split(' ');
    let order = shuffle(words.map((_, i) => i), rnd);
    if (order.every((v, i) => words[v] === words[i])) order = order.reverse();
    return Object.assign({ sentence: x.data, words, order }, x);
  }
  const [s, fix, tip] = x.data, raw = s.split(' '), wrong = raw.findIndex(t => t.indexOf('*') >= 0);
  return Object.assign({ tokens: raw.map(t => t.replace(/\*/g, '')), wrong, fix, tip, raw: raw[wrong] }, x);
}
const fixedWord = it => it.fix ? it.raw.replace(/\*(.*?)\*/, it.fix) : '';
const fixedSentence = it => it.tokens.map((w, k) => k === it.wrong ? fixedWord(it) : w).filter(Boolean).join(' ');

async function startGame(game){
  if (!dash) return;
  if (dash.levelTest) { toast('Do the level test first, then the games open', true); return renderDash(); }
  if (!dash.games) dash.games = Object.assign({}, GAMES_DEFAULT);
  app.innerHTML = '<div class="spinner"></div>';
  let B;
  try { B = await loadBank(); }
  catch(e){ toast(e.message, true); return renderDash(); }
  G = { game, items: makeRound(B, game), i: 0, res: [], missed: [], right: [], built: [], locked: false };
  window.scrollTo(0, 0);
  renderItem();
}

function gameBars(){
  return G.items.map((_, k) => `<i class="${k < G.res.length ? (G.res[k] ? 'ok' : 'no') : k === G.i ? 'on' : ''}"></i>`).join('');
}

function renderItem(){
  if (!G) return;
  if (G.i >= G.items.length) return finishRound();
  G.locked = false; G.built = [];

      <div class="opts">${it.options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if (game === 'listen') {

          <button class="btn btn-glass btn-sm" id="slow">${icon('gauge')} Slow</button></div>
        <div class="qbig" style="font-size:18px">${esc(it.q)}</div><div id="transcript"></div></div>
      <div class="opts ${it.options.some(o => o.length > 13) ? 'one' : ''}">${it.options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if (game === 'build') {
    body = `<div class="qprompt" style="text-align:center">Tap the words in the right order</div>
      <div class="slots" id="slots"></div>
      <div class="bank" id="bank">${it.order.map(k => `<button class="tok" data-k="${k}">${esc(it.words[k])}</button>`).join('')}</div>
      <button class="btn btn-primary btn-block" id="check" disabled>Check ${icon('check')}</button>`;
  } else {
    body = `<div class="glass qcard"><div class="qprompt">One word is wrong. Tap it!</div>
      <div class="sentence">${it.tokens.map((t, k) => `<button class="tok" data-k="${k}">${esc(t)}</button>`).join('')}</div></div>`;
  }
  const hint = { match: 'Hmm… which one is it?', listen: 'Listen carefully!', build: 'Let\'s build it together!', spot: 'Can you find it?' }[game];
  app.innerHTML = `<div class="gscreen" id="gs">
    <div class="gtop"><button class="btn btn-glass icon-btn" id="gquit" title="Stop">${icon('x')}</button>
      <div style="flex:1;min-width:0"><h2>${G.duel ? G.duel.title : G.gate ? 'Gate challenge' : info.name}</h2><div class="sub" style="font-size:12px;margin:0">${G.duel
        ? info.name + ' · level ' + esc(G.duel.label) : G.gate ? info.name + ' · level ' + esc(dash.journey.gate.nextLabel) : 'Level ' + esc(dash.girl.levelLabel)} · ${G.i + 1} of ${n}</div></div>
      ${G.duel ? `<span class="chip" id="dtimer">${icon('timer')} ${duelClockText()}</span>` : `<span class="tile ${info.tile}">${icon(info.icon, 'duotone')}</span>`}</div>
    ${G.duel ? duelRaceCard() : `<div class="gprog" id="gprog">${gameBars()}</div>`}
    ${body}

function onGameClick(e){
  const t = e.target.closest('button');
  if (!t || !G) return;
  if (t.dataset.react != null) return sendReaction(Number(t.dataset.react));
  if (t.dataset.hint) return bossSendHint();
  if (t.id === 'gquit') {
    // Leaving the gate challenge or a duel halfway takes a second tap; nothing is saved then.
    if ((G.gate || G.duel) && !(G.quitAt > Date.now() - 3000)) { G.quitAt = Date.now(); return toast(G.duel ? 'Tap again to leave the duel.' : 'Tap again to leave. This try won\'t count.'); }
    const gate = G.gate;
    if (G.duel) stopDuel();
    G = null; speechStop();
    return gate ? renderMap() : renderDash();
  }
  if (t.id === 'gnext-btn') { G.i++; return renderItem(); }
  if (t.id === 'say') return sayIt(false);
  if (t.id === 'slow') return sayIt(true);
  if (G.locked) return;
  const it = G.items[G.i];
  if (t.classList.contains('opt')) {
    const ok = t.dataset.v === it.answer;
    app.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.v === it.answer) b.classList.add('ok'); });
    if (!ok) t.classList.add('no', 'shake');
    if (it.game === 'listen') return answered(ok, `You heard: <b>${esc(it.say)}</b>`);
    return answered(ok, it.kind === 'pic' ? `This is a <b>${esc(it.word)}</b>.` : `<b>${esc(it.word)}</b>: ${esc(it.def)}`);
  }
  if (it.game === 'build' && t.classList.contains('tok')) {
    const k = Number(t.dataset.k);
    if (t.closest('#bank')) { G.built.push(k); t.classList.add('used'); }
    else { G.built.splice(G.built.indexOf(k), 1); app.querySelector('#bank .tok[data-k="' + k + '"]').classList.remove('used'); }
    document.getElementById('slots').innerHTML = G.built.map(x => `<button class="tok placed" data-k="${x}">${esc(it.words[x])}</button>`).join('');
    document.getElementById('check').disabled = G.built.length !== it.words.length;
    return;
  }
  if (t.id === 'check') {
    const ok = G.built.map(x => it.words[x]).join(' ') === it.sentence;
    const sl = document.getElementById('slots');
    sl.style.borderColor = ok ? '#34d399' : '#fb7185';
    if (!ok) sl.classList.add('shake');
    t.disabled = true;
    app.querySelectorAll('#gs .tok').forEach(b => { b.disabled = true; });
    return answered(ok, `<b>${esc(it.sentence)}</b>`);
  }
  if (it.game === 'spot' && t.classList.contains('tok')) {
    const k = Number(t.dataset.k), ok = k === it.wrong;
    app.querySelectorAll('.sentence .tok').forEach(b => { b.disabled = true; });
    const w = app.querySelector('.sentence .tok[data-k="' + it.wrong + '"]');
    w.classList.add('fixed');
    w.innerHTML = '<s>' + esc(it.tokens[it.wrong]) + '</s>' + esc(fixedWord(it));
    if (!ok) t.classList.add('wrongpick', 'shake');
    return answered(ok, `<b>${esc(fixedSentence(it))}</b><br>${esc(it.tip)}`);
  }
}

// Right: quick praise and on to the next item. Wrong: show the answer and wait for "Next".
function answered(ok, explain){
  G.locked = true;
  const it = G.items[G.i];
  G.res.push(ok);
  (ok ? G.right : G.missed).push(it.id);
  if (G.duel) duelAnswer(ok); else document.getElementById('gprog').innerHTML = gameBars();
  const fb = document.getElementById('fb');
  fb.className = 'bubble ' + (ok ? 'ok' : 'no');
  fb.textContent = ok ? pick(['Correct!', 'Great!', 'Yes! You got it!', 'Perfect!', 'Well done!'])
    : pick(['Oops! Let\'s look at the answer.', 'Almost! Here is the answer.', 'Not quite. Now you know!']);
  petReact(ok ? 'celebrate' : 'oops');
  const learn = it.game === 'listen' || it.game === 'spot';
  if (ok) {
    xpPop();
    if (learn) document.getElementById('explain').innerHTML = `<div class="answer-box">${explain}</div>`;
    setTimeout(() => { if (G && G.items[G.i] === it) { G.i++; renderItem(); } }, learn ? 1900 : 1100);
    return;
  }
  document.getElementById('explain').innerHTML = `<div class="answer-box">${explain}</div>`;
  document.getElementById('gnext').innerHTML = `<button class="btn btn-primary btn-block" id="gnext-btn">Next ${icon('arrow-right')}</button>`;
}

const pendKey = () => 'eq_pending_' + session.name;

async function flushPending(){

let voice = null;
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /^en-GB/i.test(v.lang)) || vs.find(v => /^en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch(e){}
}
if ('speechSynthesis' in window) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch(e){} }
function sayIt(slow){
  const it = G && G.items[G.i];
  if (!it || !it.say) return;
  const btn = document.getElementById('say'), tr = document.getElementById('transcript');
  if (!('speechSynthesis' in window)) { if (tr) tr.innerHTML = `<div class="answer-box">No sound on this device, so read it: <b>${esc(it.say)}</b></div>`; return; }
  try {

}

// ---------- Play together: Word Duel and Challenge ----------
// Spec: specs/play-together.md. Both phones build the same game sequence from the duel's seed;
// each player's questions come from her own level. A live duel syncs by polling the server.
const DUEL_ITEMS = 7;
const DUEL_GAMES = ['match', 'listen', 'build', 'spot', 'match', 'listen', 'spot'];
const DUEL_REACTIONS = ['Good luck!', 'Nice one!', 'So close!', 'Wow!', 'GG', 'Let\'s go!'];
let DU = null, duelsHome = null, homeTimer = null, duelTick = null, pendingDuel = null, duelOffset = 0, homeStale = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lvIndex = lv => LEVELS.findIndex(x => x[0] === lv);
const secs = ms => Math.round((Number(ms) || 0) / 1000) + ' s';
const appBase = () => IN_APPS_SCRIPT ? ASSETS : location.origin + location.pathname;
function rng32(a){
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hashStr(s){ let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

// Same seed and level: the same questions in the same order, with the same options.
function duelItems(B, seed, level, count){
  const n = count || DUEL_ITEMS;
  const order = shuffle(DUEL_GAMES, rng32(seed)).concat(n > DUEL_GAMES.length ? shuffle(DUEL_GAMES, rng32(seed + 1)) : []).slice(0, n), rnd = rng32((seed ^ hashStr(level)) >>> 0), used = new Set();
  return order.map(game => {
    const pool = [].concat(...kidLevels(level).map(l => bankItems(B, game, l))).filter(x => !used.has(x.id));
    const x = pool[Math.floor(rnd() * pool.length)];
    used.add(x.id);
    return prepare(B, game, x, rnd);
  });
}
const parseTrack = s => String(s || '').split(',').filter(String).map(x => { const p = x.split(':'); return { ok: p[0] === '1', t: Number(p[1]) || 0 }; });
const ghostScore = (track, ms) => track.filter(x => x.ok && x.t <= ms).length;

const meAsPlayer = () => ({ name: dash.girl.name, level: dash.girl.level, label: dash.girl.levelLabel, color: dash.girl.color, pet: dash.pet ? { id: dash.pet.id, stage: dash.pet.stage } : null });
const duelMe = v => (v.role === 'guest' ? v.guest : v.host) || meAsPlayer();
const duelThem = v => v.role === 'guest' ? v.host : v.guest;
const faceOf = p => petFace(p && p.pet, (p && p.color) || '#8b8ffb', p ? p.name : '?');
function petPic(p, mood, cls){
  if (p && p.pet && PET_ART[p.pet.id]) return `<img class="${cls || ''}" src="${petSrc(p.pet.id, p.pet.stage, mood)}" alt="">`;
  return `<span class="duel-av ${cls || ''}" style="background:${esc((p && p.color) || '#8b8ffb')}">${esc(String((p && p.name) || '?')[0])}</span>`;
}
// Time left on an invite or a challenge: '24h left' / '5 min left', or in words: '24 hours' / '5 minutes'.
function duelLeft(v, words){
  const ms = (v.expires || 0) - (v.now || Date.now());
  if (!(ms > 0)) return words ? 'no time' : 'time is up';
  const h = Math.round(ms / 3600000), m = Math.max(1, Math.ceil(ms / 60000));
  if (ms >= 3600000) return words ? plural(h, 'hour') : h + 'h left';
  return words ? plural(m, 'minute') : m + ' min left';
}

async function dcall(fn, ...args){

  if (v && v.now) duelOffset = v.now - (t0 + Date.now()) / 2;

}

async function duelRematch(code){

// Where a duel goes next, from its state and the kid's role in it.
function routeDuel(v){
  if (!v) return renderDash();
  const me = duelMe(v);
  if (v.state === 'done') return duelResult(v);
  if (v.state === 'cancelled') return duelNotice(v, 'This invite was cancelled');
  if (v.role === 'host') {
    if (v.state === 'invited' || v.state === 'declined' || (v.state === 'expired' && v.mode === 'live' && me.score == null)) return duelLobby(v);
    if (v.state === 'solo') return duelIntro(v);
    if (v.state === 'challenge') return duelSent(v);
    if (v.state === 'playing') return duelLobby(v);
  } else if (v.role === 'guest') {
    if (v.state === 'invited' || v.state === 'declined') return duelInvitation(v);
    if (v.state === 'playing') return duelLobby(v);
    if (v.state === 'challenge' && me.score == null) return duelIntro(v);
  }
  duelNotice(v, v.state === 'expired' ? 'This duel has expired' : 'This duel is not open right now');
}

// ---- Duel session and sync ----
function duelSession(v){
  if (!DU || DU.code !== v.code) { stopDuel(); DU = { code: v.code, view: v, seenRt: null, reaction: -1, reactionAt: 0, score: 0, answered: 0, lastMs: 0, finished: false }; }
  else DU.view = v;
  return DU;
}
function stopDuel(){
  if (DU) DU.stop = true;
  DU = null;
  clearInterval(duelTick);
}
function duelProgress(){
  return { n: DU.answered, s: DU.score, ms: DU.lastMs, f: DU.finished, r: DU.reaction, rt: DU.reactionAt,
    dmg: DU.boss ? DU.boss.dmg : 0, hint: DU.boss ? DU.boss.hintAt : 0 };
}
async function duelLoop(){
  const me = DU;
  if (!me || me.looping) return;
  me.looping = true;
  while (DU === me && !me.stop) {
    try {
      const v = await dcall('apiDuelPoll', me.code, duelProgress());
      if (DU !== me || me.stop) break;
      me.fails = 0;
      onDuelUpdate(v);
    } catch(e){ me.fails = (me.fails || 0) + 1; if (me.fails === 4) toast('The connection is slow…', true); }
    await sleep(600);
  }
  me.looping = false;
}
function onDuelUpdate(v){
  DU.view = v;
  DU.them = v.them;
  if (DU.boss) bossPartner(v.them);
  const r = v.them && v.them.rt;
  if (r && r !== DU.seenRt) { if (DU.seenRt !== null && v.them.r >= 0) showReaction(duelThem(v), v.them.r); DU.seenRt = r; }
  else if (DU.seenRt === null) DU.seenRt = r || 0;
  if (DU.screen === 'lobby') return lobbyUpdate(v);
  if (DU.screen === 'play') return updateRace();
  if (DU.screen === 'wait') { if (v.state === 'done') return duelResult(v); updateRace(); return waitUpdate(v); }
}

function reactionsBar(){
  return `<div class="reacts" id="reacts">${DUEL_REACTIONS.map((r, i) => `<button data-react="${i}">${esc(r)}</button>`).join('')}</div>`;
}
function sendReaction(i){
  if (!DU || Date.now() - DU.reactionAt < 2500) return;
  DU.reaction = i; DU.reactionAt = Date.now();
  const b = document.querySelector('[data-react="' + i + '"]');
  if (b) { b.classList.add('sent'); setTimeout(() => b.classList.remove('sent'), 1500); }
}
function showReaction(p, i){
  if (!p || !DUEL_REACTIONS[i]) return;
  document.querySelectorAll('.rtoast').forEach(x => x.remove());
  const t = document.createElement('div');
  t.className = 'rtoast';
  t.innerHTML = `${faceOf(p)}<span>${esc(p.name)}: ${esc(DUEL_REACTIONS[i])}</span>`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function lobbyUpdate(v){
  if (!DU || DU.screen !== 'lobby') return;

  if (v.state === 'playing') {
    sub.textContent = 'Get ready…';
    stat.innerHTML = '';
    act.innerHTML = '';

  }
  if (v.state === 'declined' || v.state === 'expired') {
    sub.textContent = v.state === 'declined' ? name + ' can\'t play now' : 'No answer from ' + name;
    stat.innerHTML = `<div class="soft stat" style="padding:12px 14px"><span class="tile sm t-read">${icon('ghost', 'duotone')}</span>

    return;
  }
  stopDuel();
  routeDuel(v);
}

function duelCountdown(v){

    if (el) el.textContent = Math.ceil(left / 1000);

  };

// ---- Playing: the game screens of the mini-games, plus the race, a timer and reactions ----
async function startDuelPlay(v){
  const me = duelMe(v);
  app.innerHTML = '<div class="spinner"></div>';
  let B;
  try { B = await loadBank(); }
  catch(e){ toast(e.message, true); stopDuel(); return renderDash(); }
  duelSession(v);
  const live = v.state === 'playing';
  Object.assign(DU, { screen: 'play', live, answered: 0, score: 0, lastMs: 0, finished: false, track: [], xp: null,
    localStart: live ? v.start - duelOffset : Date.now(),
    ghost: !live && v.role === 'guest' && v.host.track ? parseTrack(v.host.track) : null,
    boss: v.mode === 'boss' && live ? { dmg: 0, prev: 0, themDmg: 0, themRight: -1e9, themS: 0, hintAt: 0, seenHint: null, hintPending: false, won: false } : null });
  G = { game: 'duel', items: duelItems(B, v.seed, me.level, v.items), i: 0, res: [], missed: [], right: [], built: [], locked: false,
    duel: { label: me.label || dash.girl.levelLabel, title: v.mode === 'challenge' ? (v.role === 'guest' ? esc(v.host.name) + '\'s challenge' : 'Challenge') : modeTitle(v) } };
  window.scrollTo(0, 0);
  renderItem();
  duelClock();
  if (live) duelLoop();
}

function duelRaceCard(){

  const runner = (p, id, cls) => p && p.pet && PET_ART[p.pet.id]
    ? `<img class="runner ${cls}" id="${id}" src="${petSrc(p.pet.id, p.pet.stage, 'happy')}" alt="" style="left:3%">`
    : `<span class="runner dot ${cls}" id="${id}" style="left:3%;background:${esc((p && p.color) || '#8b8ffb')}"></span>`;
  const racing = DU.live || DU.ghost;
  return `<div class="glass race" id="race">
    <div class="lane"><span class="lwho">${faceOf(me)}<span>You</span></span><div class="track">${stations}${runner(me, 'run-me', '')}</div><b id="sc-me">${DU.score}</b></div>

      <b id="sc-them">${racing ? 0 : '–'}</b></div>
  </div>`;

function updateRace(){
  if (!DU) return;
  if (DU.boss) return updateBoss();
  const pos = s => (s ? s / DUEL_ITEMS * 87.5 : 3) + '%';
  const me = document.getElementById('run-me'), them = document.getElementById('run-them');
  if (me) me.style.left = pos(DU.score);
  const sm = document.getElementById('sc-me');
  if (sm) sm.textContent = DU.score;
  let ts = null;
  if (DU.ghost) ts = ghostScore(DU.ghost, Date.now() - DU.localStart);
  else if (DU.live && DU.them) ts = DU.them.s;
  if (ts == null) return;
  if (them) them.style.left = pos(ts);
  const st = document.getElementById('sc-them');
  if (st) st.textContent = ts;
}

function duelAnswer(ok){
  const ms = Math.max(0, Math.round(Date.now() - DU.localStart));
  DU.track.push((ok ? 1 : 0) + ':' + ms);
  DU.answered = G.res.length; DU.score = G.res.filter(Boolean).length; DU.lastMs = ms;
  if (DU.boss) bossHit(ok, ms);
  updateRace();
}

function duelClockText(){
  if (!DU || !DU.localStart) return '3:00';
  const s = Math.ceil(Math.max(0, DU.view.maxMs - (Date.now() - DU.localStart)) / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function duelClock(){
  clearInterval(duelTick);
  duelTick = setInterval(() => {
    if (!DU || !G || !G.duel) return clearInterval(duelTick);
    const el = document.getElementById('dtimer');
    if (el) el.innerHTML = icon('timer') + ' ' + duelClockText();
    if (DU.ghost) updateRace();
    if (Date.now() - DU.localStart >= DU.view.maxMs) { clearInterval(duelTick); toast('Time is up!'); finishDuel(); }
  }, 250);
}

// The last question (or the time limit): unanswered questions count as missed.
async function finishDuel(){
  if (!DU || DU.finished || !G) return;
  clearInterval(duelTick);
  const items = G.items, v = DU.view;
  const ms = Math.min(v.maxMs, Math.round(Date.now() - DU.localStart));
  // A boss battle reports the questions answered; a Word Duel all seven (unanswered ones as missed).
  const boss = v.mode === 'boss';
  if (!boss) while (DU.track.length < items.length) { DU.track.push('-:' + ms); G.missed.push(items[DU.track.length - 1].id); }
  const R = { correct: G.res.filter(Boolean).length, total: boss ? DU.track.length : items.length, ms, track: DU.track.join(','), missed: G.missed.slice(0, v.items), right: G.right.slice(0, v.items) };
  Object.assign(DU, { finished: true, score: R.correct, answered: R.total, lastMs: ms, screen: 'saving' });
  G = null; speechStop();
  saveDuel(R);
}

function itemAnswer(it){
  if (it.game === 'match') return it.kind === 'pic' ? `This is a <b>${esc(it.word)}</b>.` : `<b>${esc(it.word)}</b>: ${esc(it.def)}`;
  if (it.game === 'listen') return `You heard: <b>${esc(it.say)}</b>`;
  if (it.game === 'build') return `<b>${esc(it.sentence)}</b>`;
  return `<b>${esc(fixedSentence(it))}</b>${it.tip ? '<br>' + esc(it.tip) : ''}`;
}

function learnTogether(B, v, me, them){
  const mine = me.track ? parseTrack(me.track) : [], theirs = them.track ? parseTrack(them.track) : [];
  const myItems = duelItems(B, v.seed, me.level, v.items), theirItems = them.level ? duelItems(B, v.seed, them.level, v.items) : [];
  const myLv = lvIndex(me.level), theirLv = lvIndex(them.level), same = me.level === them.level;
  const missed = myItems.map((it, k) => ({ it, k })).filter(x => mine[x.k] && !mine[x.k].ok);
  const canAsk = k => theirLv > myLv || (same && theirs[k] && theirs[k].ok);
  const canHelp = k => myLv > theirLv || (same && mine[k] && mine[k].ok);
  const helpable = theirItems.map((it, k) => ({ it, k })).filter(x => theirs[x.k] && !theirs[x.k].ok && canHelp(x.k));
  const done = new Set((v.helped || []).filter(h => h.indexOf(me.name + ':') === 0).map(h => h.slice(me.name.length + 1)));
  const rows = missed.map(x => `<div class="lrow"><span class="x">${icon('x')}</span><div class="lt">${itemAnswer(x.it)}</div>
      ${canAsk(x.k) ? `<span class="chip purple">${icon('hand-waving')} Ask ${esc(them.name)}</span>` : ''}</div>`).join('');
  const help = helpable.map(x => `<div class="lrow"><span class="x ok">${icon('lightbulb')}</span><div class="lt">${itemAnswer(x.it)}</div>
      ${done.has(x.it.id) ? `<span class="chip teal">${icon('star')} Helper</span>` : `<button class="btn btn-glass btn-sm" data-helped="${esc(x.it.id)}">I explained it</button>`}</div>`).join('');
  return `<div class="glass panel" style="padding:16px">
    <div class="row-flex between"><h2>Learn together</h2>${missed.length ? `<span class="chip">${missed.length} to review</span>` : ''}</div>
    ${rows ? `<div class="stack mt-s" style="gap:8px">${rows}</div><div class="sub mt-s" style="font-size:12px">These come back in your games.</div>`
      : `<div class="sub mt-s" style="font-size:13px">${me.track ? 'No mistakes. Well done!' : ''}</div>`}
    ${help ? `<div class="label mt">${esc(them.name)} missed these. Can you explain one?</div><div class="stack mt-s" style="gap:8px">${help}</div>` : ''}
  </div>`;
}

      <button class="fr" data-tugmate=""><span class="addc">${icon('user')}</span><b>Guest</b><small>No XP</small></button></div>
  </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.onclick = e => {
    if (e.target === ov) return close();
    const t = e.target.closest('[data-tugmate]');
    if (t) { close(); return t.dataset.tugmate ? tugPin(t.dataset.tugmate) : tugStart(null, ''); }
  };
  ov.querySelector('#x').onclick = close;
}

// The second kid types her PIN on this phone; the server checks it.
function tugPin(name){
  let pin = '';
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet glass" style="text-align:center">
    <div class="row-flex between"><span class="label">${esc(name)}, your PIN</span>
      <button class="btn btn-glass icon-btn" style="width:38px;height:38px;font-size:15px" id="x">${icon('x')}</button></div>
    <div class="dots" id="tdots">${'<div class="dot"></div>'.repeat(4)}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="btn btn-glass" data-k="${n}">${n}</button>`).join('')}
      <span></span><button class="btn btn-glass" data-k="0">0</button><button class="btn btn-glass" data-k="del">${icon('backspace')}</button></div>
    <div class="sub mt-s" style="font-size:12px">So the game saves XP for both of you.</div>
  </div>`;
  document.body.appendChild(ov);
  const dots = ov.querySelector('#tdots'), pad = ov.querySelector('.pad');
  const paint = () => dots.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i < pin.length));
  ov.querySelector('#x').onclick = () => ov.remove();
  pad.onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.k === 'del') pin = pin.slice(0, -1); else if (pin.length < 4) pin += b.dataset.k;
    paint();
    if (pin.length < 4) return;
    pad.classList.add('busy');
    try { const mate = await call('apiTugCheck', name, pin); ov.remove(); tugStart(mate, pin); }
    catch(err){ toast(err.message.includes('PIN') ? 'Wrong PIN, try again' : err.message, true); pin = ''; paint(); pad.classList.remove('busy'); dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); }
  };
}

function tugQueue(B, level){
  const items = [].concat(...kidLevels(level).map(l => bankItems(B, 'match', l).concat(bankItems(B, 'spot', l))));
  return { all: shuffle(items), i: 0 };
}
function tugNext(B, p){
  if (p.q.i >= p.q.all.length) { p.q.all = shuffle(p.q.all); p.q.i = 0; }
  const x = p.q.all[p.q.i++];
  p.cur = prepare(B, x.id.indexOf('s:') === 0 ? 'spot' : 'match', x);
}

async function tugStart(mate, matePin){
  app.innerHTML = '<div class="spinner"></div>';
  let B;
  try { B = await loadBank(); } catch(e){ toast(e.message, true); return renderDash(); }
  const me = meAsPlayer(), guest = !mate;
  const two = [Object.assign({}, me, { pin: session.pin }), guest ? { name: 'Guest', level: me.level, label: me.label, color: '#94a3b8', pet: null, guest: true } : Object.assign({}, mate, { pin: matePin })];
  TW = { B, pos: 0, end: Date.now() + TUG_MS, over: false, quitAt: 0,
    p: two.map(x => Object.assign(x, { q: tugQueue(B, x.level), cur: null, frozen: 0, correct: 0, total: 0, missed: [], right: [] })) };
  TW.p.forEach(p => tugNext(B, p));
  G = null; stopDuel();
  app.innerHTML = `<div class="tugscreen" id="tug">
    <div class="tughalf top" data-half="1"></div>
    <div class="tugmid">
      <div class="tsc top">${faceOf(TW.p[1])}<b id="tsc1">0</b></div>
      <div class="rope" id="rope">${[-5, -2.5, 0, 2.5, 5].map(k => `<i class="mk ${k === 0 ? 'mid' : k === 5 ? 'end0' : k === -5 ? 'end1' : ''}" style="top:${50 + k * 9}%"></i>`).join('')}<span class="knot" id="knot"></span></div>
      <div class="tsc">${faceOf(TW.p[0])}<b id="tsc0">0</b></div>
      <button class="btn btn-glass icon-btn tquit" id="tquit">${icon('x')}</button>
      <span class="chip ttime" id="ttime">2:00</span>
    </div>
    <div class="tughalf" data-half="0"></div>
  </div>`;
  tugHalf(0); tugHalf(1);
  document.getElementById('tug').onclick = tugClick;
  TW.tick = setInterval(tugTick, 250);
}

function tugHalf(i){
  const p = TW.p[i], el = document.querySelector('.tughalf[data-half="' + i + '"]'), it = p.cur;
  if (!el || !it) return;
  const q = it.game === 'match'
    ? `<div class="glass qcard">${it.kind === 'pic' ? `<div class="qprompt">What is this?</div><img class="qpic" src="${picSrc(it.word)}" alt="">` : `<div class="qprompt">Which word matches?</div><div class="qbig">${esc(it.def)}</div>`}</div>
       <div class="opts">${it.options.map(o => `<button class="opt" data-p="${i}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`
    : `<div class="glass qcard"><div class="qprompt">One word is wrong. Tap it!</div>
       <div class="sentence">${it.tokens.map((t, k) => `<button class="tok" data-p="${i}" data-k="${k}">${esc(t)}</button>`).join('')}</div></div>`;
  el.innerHTML = `<div class="row-flex between"><span class="chip ${i ? 'orange' : 'purple'}">${esc(p.name)} · ${esc(p.label || '')}</span>
      <span class="sub" style="margin:0;font-size:12px">${p.correct} right</span></div>${q}<div class="tfreeze" hidden></div>`;
}

function tugClick(e){
  const t = e.target.closest('button');
  if (!t || !TW || TW.over) return;
  if (t.id === 'tquit') {
    if (TW.quitAt > Date.now() - 3000) return tugEnd(true);
    TW.quitAt = Date.now();
    return toast('Tap again to stop. Nothing is saved.');
  }
  const i = Number(t.dataset.p), p = TW.p[i];
  if (isNaN(i) || p.frozen > Date.now() || p.busy) return;
  const it = p.cur, ok = it.game === 'match' ? t.dataset.v === it.answer : Number(t.dataset.k) === it.wrong;
  p.total++; p.busy = true;
  (ok ? p.right : p.missed).push(it.id);
  const half = document.querySelector('.tughalf[data-half="' + i + '"]');
  if (it.game === 'match') half.querySelectorAll('.opt').forEach(b => { if (b.dataset.v === it.answer) b.classList.add('ok'); });
  else { const w = half.querySelector('.tok[data-k="' + it.wrong + '"]'); if (w) { w.classList.add('fixed'); w.innerHTML = '<s>' + esc(it.tokens[it.wrong]) + '</s>' + esc(fixedWord(it)); } }
  if (ok) {
    p.correct++;
    TW.pos += i === 0 ? 1 : -1;
    tugRope();
    try { navigator.vibrate && navigator.vibrate(30); } catch(err){}
    setTimeout(() => { p.busy = false; if (!TW || TW.over) return; tugNext(TW.B, p); tugHalf(i); }, 450);
  } else {
    t.classList.add('no', 'shake');
    p.frozen = Date.now() + TUG_FREEZE;
    const fz = half.querySelector('.tfreeze');
    if (fz) { fz.hidden = false; fz.innerHTML = `<b>${icon('snowflake', 'duotone')} Frozen</b><span>${it.game === 'match' ? esc(it.answer) : esc(fixedSentence(it))}</span>`; }
    setTimeout(() => { p.busy = false; if (!TW || TW.over) return; tugNext(TW.B, p); tugHalf(i); }, TUG_FREEZE);
  }
  if (Math.abs(TW.pos) >= TUG_STEPS) setTimeout(() => tugEnd(false), 500);
}

function tugRope(){
  const k = document.getElementById('knot');
  if (k) k.style.top = (50 + TW.pos * 9) + '%';
  ['tsc0', 'tsc1'].forEach((id, i) => { const el = document.getElementById(id); if (el) el.textContent = TW.p[i].correct; });
}

function tugTick(){
  if (!TW || TW.over) return clearInterval(TW && TW.tick);
  const left = Math.max(0, TW.end - Date.now()), s = Math.ceil(left / 1000), el = document.getElementById('ttime');
  if (el) el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  if (!left) tugEnd(false);
}

async function tugEnd(quit){
  if (!TW || TW.over) return;
  TW.over = true;
  clearInterval(TW.tick);
  if (quit) { TW = null; return renderDash(); }
  const [a, b] = TW.p, win = TW.pos > 0 ? a : TW.pos < 0 ? b : null;
  window.scrollTo(0, 0);
  app.innerHTML = `<div class="gscreen" id="tres"><div class="result" style="flex:none">
      <div class="podium">${win ? petPic(win, 'celebrate', 'big') + `<span class="crown">${icon('crown-simple', 'duotone')}</span>` + petPic(win === a ? b : a, 'happy', 'small flip')
        : petPic(a, 'happy', 'big') + petPic(b, 'happy', 'small flip')}</div>
      <div class="score2">${a.correct}<span>:</span>${b.correct}</div>
      <h2>${win ? esc(win.name) + ' pulled the rope!' : 'A draw! The knot stayed in the middle.'}</h2>
      <div class="saved wait" id="tsave"><span class="mini-spin"></span>Saving…</div>
    </div>
    ${tugLearn()}
    <div class="stack" style="gap:10px"><button class="btn btn-primary btn-block" data-act="again">${icon('arrows-clockwise')} Play again</button>
      <button class="btn btn-glass btn-block" data-act="home">Back</button></div></div>`;
  if (win && !win.guest) confetti();
  const mate = b.guest ? null : b, res = p => ({ correct: p.correct, total: p.total, missed: p.missed.slice(-40), right: p.right.slice(-40) });
  document.getElementById('tres').onclick = e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.act === 'home') { TW = null; homeStale = true; return renderDash(); }
    if (t.dataset.act === 'again') { const m = mate ? { name: b.name, level: b.level, label: b.label, color: b.color, pet: b.pet } : null, pin = b.pin; TW = null; return tugStart(m, pin || ''); }
  };
  const st = document.getElementById('tsave');
  try {
    const r = await call('apiTugSave', session.name, session.pin, mate ? mate.name : '', mate ? mate.pin : '', res(a), mate ? res(b) : null);
    if (r.dash) { dash = r.dash; checkGrowth(); }
    homeStale = true;
    if (st) { st.className = 'saved'; st.innerHTML = icon('check') + ' Saved · +' + r.xp + ' XP for ' + esc(a.name) + (mate ? ', +' + r.mateXp + ' XP for ' + esc(mate.name) : ''); }
  } catch(err){ if (st) { st.className = 'saved err'; st.innerHTML = icon('wifi-slash') + ' ' + esc(err.message); } }
}

function tugLearn(){
  const rows = TW.p.filter(p => p.missed.length).map(p => {
    const seen = new Set(), items = p.missed.filter(id => !seen.has(id) && seen.add(id)).slice(0, 4).map(id => itemById(TW.B, id)).filter(Boolean)
      .map(x => prepare(TW.B, x.id.indexOf('s:') === 0 ? 'spot' : 'match', x));
    return items.length ? `<div class="label mt-s">${esc(p.name)}</div>` + items.map(it => `<div class="lrow"><span class="x">${icon('x')}</span><div class="lt">${itemAnswer(it)}</div></div>`).join('') : '';
  }).join('');
  return rows ? `<div class="glass panel" style="padding:16px"><div class="row-flex between"><h2>Learn together</h2></div><div class="stack" style="gap:8px">${rows}</div>
    <div class="sub mt-s" style="font-size:12px">The ones you missed come back in your games.</div></div>` : '';
}

function duoSection(){
  const D = duelsHome && duelsHome.duos;

      <span class="chip orange">${icon('fire')} ${o.days}</span></button>`).join('')}</div>` : ''}</div>`;
}

function duoCard(v){
  const p = v.partner, me = meAsPlayer(), both = v.todayMe && v.todayThem;
  const status = both ? `You both practiced today. ${v.days === 1 ? 'Day 1!' : 'Day ' + v.days + '!'}`
    : v.todayMe ? `Waiting for ${esc(p.name)}. A nudge might help!`
    : v.todayThem ? `${esc(p.name)} practiced today. Your turn!` : 'Practice today, both of you.';
  const cell = (w, who) => w.saved ? `<i class="wd saved">${icon('shield-check', 'bold')}</i>`
    : `<i class="wd ${w[who] ? who : w.future || w.before ? 'off' : w.date === dash.today ? 'wait' : ''}"></i>`;
  const action = !v.todayMe ? `<button class="btn btn-primary btn-block" data-duoplay="1">${icon('play')} Practice now</button>`

function questCard(v){
  const q = v.quest, p = v.partner;
  const pct = n => Math.min(100, Math.round(n / q.target * 100));
  const tile = q.kind === 'game' ? `<span class="tile ${GAME_INFO[q.game].tile}">${icon(GAME_INFO[q.game].icon, 'duotone')}</span>` : `<span class="tile t-fire">${icon('calendar-check', 'duotone')}</span>`;

  return `<div class="glass panel quest iri ${q.claimed ? 'won' : ''}">
    <div class="row-flex between"><span class="label">Team quest · this week</span><span class="chip ${q.claimed ? 'teal' : ''}">${q.claimed ? icon('check') + ' Done' : icon('clock') + ' ' + plural(q.daysLeft, 'day') + ' left'}</span></div>
