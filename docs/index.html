<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Quest</title>
<meta name="theme-color" content="#ece6e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Quest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
:root{
  --ink:#1c1e2b; --muted:#6b7083; --faint:#9aa0b2;
  --primary:#6366f1; --primary-2:#8b8ffb; --teal:#3cc7b6; --teal-2:#b9f5ec; --orange:#f6a04d;
  --danger:#e8687a;
  --glass:linear-gradient(140deg,rgba(255,255,255,.52),rgba(255,255,255,.2));
  --glass-soft:linear-gradient(140deg,rgba(255,255,255,.42),rgba(255,255,255,.14));
  --stroke:rgba(255,255,255,.72);
  --shadow:0 26px 50px -18px rgba(38,40,80,.28);
  --inner:inset 0 1px 1px rgba(255,255,255,.95), inset 0 -1px 1px rgba(255,255,255,.3);
  --iri:conic-gradient(from 200deg,#a5b4fc,#99f6e4,#f9a8d4,#fde68a,#c4b5fd,#a5b4fc);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,#f4ede5 0%,#e9e3dd 38%,#b8c2cf 78%,#7d8a9c 100%);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;
}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:float 18s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:#a5a8ff;top:-80px;left:-90px}
.b2{width:300px;height:300px;background:#8ff0e2;top:32%;right:-110px;animation-delay:-6s}
.b3{width:280px;height:280px;background:#ffc79a;bottom:-60px;left:-40px;animation-delay:-11s;opacity:.6}
.b4{width:220px;height:220px;background:#f5b8e8;bottom:22%;right:12%;animation-delay:-3s;opacity:.5}
@keyframes float{to{transform:translate(40px,60px) scale(1.12)}}

#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:20px 16px 48px}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--stroke);box-shadow:var(--shadow),var(--inner);border-radius:30px}
.soft{background:var(--glass-soft);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid rgba(255,255,255,.62);box-shadow:0 14px 28px -16px rgba(38,40,80,.3),var(--inner);border-radius:22px}
.panel{padding:24px 20px}
.iri{position:relative}
.iri::before{content:'';position:absolute;inset:0;padding:2px;border-radius:inherit;background:var(--iri);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

h1{font-size:30px;font-weight:800;letter-spacing:-.6px;margin:0}
h2{font-size:18px;font-weight:700;margin:0}
.sub{color:var(--muted);font-size:15px;margin-top:4px}
.label{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.row-flex{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.mt{margin-top:18px}.mt-s{margin-top:10px}

.btn{border:0;font:inherit;font-weight:700;font-size:16px;height:52px;padding:0 24px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .15s ease,filter .15s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-primary{color:#fff;background:linear-gradient(180deg,var(--primary-2),var(--primary));
  box-shadow:0 16px 30px -12px rgba(99,102,241,.75),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-teal{color:#0e4440;background:linear-gradient(180deg,var(--teal-2),#86e0d4);
  box-shadow:0 16px 30px -12px rgba(60,199,182,.7),inset 0 1px 0 rgba(255,255,255,.8)}
.btn-glass{color:var(--ink);background:var(--glass);border:1px solid var(--stroke);box-shadow:0 10px 24px -14px rgba(38,40,80,.4),var(--inner)}
.btn-block{width:100%}
.btn-sm{height:38px;font-size:14px;padding:0 16px}
.icon-btn{width:46px;height:46px;border-radius:50%;padding:0;font-size:18px}

.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);color:var(--ink)}
.chip.purple{background:rgba(99,102,241,.14);color:#4338ca;border-color:rgba(99,102,241,.25)}
.chip.teal{background:rgba(60,199,182,.16);color:#0f766e;border-color:rgba(60,199,182,.3)}
.chip.orange{background:rgba(246,160,77,.18);color:#b45309;border-color:rgba(246,160,77,.35)}
.chip.red{background:rgba(232,104,122,.15);color:#be123c;border-color:rgba(232,104,122,.3)}

[class^="ph-"],[class*=" ph-"]{line-height:1}
.icon-btn i{font-size:20px}
.btn i{font-size:18px}
.tile{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;font-size:22px;
  box-shadow:0 10px 18px -10px var(--tc),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.08)}
.tile.sm{width:32px;height:32px;border-radius:11px;font-size:18px}
.t-level{background:linear-gradient(145deg,#fda4af,#e11d48);--tc:#e11d48}
.t-grammar{background:linear-gradient(145deg,#a5b4fc,#4f46e5);--tc:#4f46e5}
.t-vocab{background:linear-gradient(145deg,#d8b4fe,#9333ea);--tc:#9333ea}
.t-listen{background:linear-gradient(145deg,#5eead4,#0d9488);--tc:#0d9488}
.t-read{background:linear-gradient(145deg,#7dd3fc,#0284c7);--tc:#0284c7}
.t-write{background:linear-gradient(145deg,#fcd34d,#d97706);--tc:#d97706}
.t-uoe{background:linear-gradient(145deg,#f9a8d4,#db2777);--tc:#db2777}
.t-fire{background:linear-gradient(145deg,#fdba74,#ea580c);--tc:#ea580c}
.t-star{background:linear-gradient(145deg,#fde68a,#d97706);--tc:#d97706}
.t-target{background:linear-gradient(145deg,#a5b4fc,#4f46e5);--tc:#4f46e5}
.tile.ghost{background:rgba(255,255,255,.7);color:var(--faint);--tc:transparent;border:1px solid rgba(255,255,255,.9)}
.tile.ghost.on{color:#4f46e5;--tc:rgba(99,102,241,.6)}
.box i{font-size:15px;color:var(--faint)}
.cell i{font-size:17px}
/* Home */
.word-card{padding:18px 20px;border-radius:26px;background:linear-gradient(155deg,rgba(196,181,253,.78),rgba(165,180,252,.55) 45%,rgba(153,246,228,.72));
  border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow),var(--inner)}
.word{font-size:28px;font-weight:800;letter-spacing:-.4px;margin-top:4px}
.who{display:grid;gap:14px}
.who button{height:72px;border-radius:999px;justify-content:flex-start;padding:0 12px;font-size:20px}
.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;flex:none;
  box-shadow:0 10px 20px -8px currentColor,inset 0 1px 0 rgba(255,255,255,.5)}
.who .age{margin-left:auto;margin-right:10px;color:var(--muted);font-size:14px;font-weight:600}

/* PIN */
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0}
.dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);transition:.2s}
.dot.on{background:linear-gradient(180deg,var(--primary-2),var(--primary));box-shadow:0 6px 14px -4px rgba(99,102,241,.8)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:300px;margin:0 auto}
.pad button{height:68px;border-radius:24px;font-size:24px;font-weight:700}
.shake{animation:shake .4s}
.pad.busy{opacity:.4;pointer-events:none;transition:opacity .2s}
.dots.pulse .dot{animation:pulse 1s ease-in-out infinite}
.dots.pulse .dot:nth-child(2){animation-delay:.15s}.dots.pulse .dot:nth-child(3){animation-delay:.3s}.dots.pulse .dot:nth-child(4){animation-delay:.45s}
@keyframes pulse{50%{transform:scale(1.4);opacity:.55}}
.mini-spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(99,102,241,.25);border-top-color:var(--primary);
  animation:spin .8s linear infinite;vertical-align:-2px;margin-right:8px}
#app>*{animation:fade .25s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.toggle{width:58px;height:32px;border-radius:999px;position:relative;cursor:pointer;flex:none;
  background:linear-gradient(90deg,#8b8ffb,#a5b4fc);box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
.toggle.off{background:rgba(255,255,255,.55)}
.toggle::after{content:'';position:absolute;top:3px;left:29px;width:26px;height:26px;border-radius:50%;background:var(--orange);
  box-shadow:0 4px 10px -2px rgba(246,160,77,.8);transition:.2s}
.toggle.off::after{left:3px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}

/* Dashboard */
.hero{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.ring-wrap{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring-wrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring-center{width:92px;height:92px;border-radius:30px;display:grid;place-items:center;text-align:center}
.ring-num{font-size:26px;font-weight:800;line-height:1}
.ring-cap{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.stat{padding:10px 14px;display:flex;align-items:center;gap:10px}
.stat b{font-size:20px}
.stat span{color:var(--muted);font-size:13px;font-weight:600}
.stat .tile{color:#fff}
.today{padding:22px 20px;border-radius:30px;background:linear-gradient(155deg,rgba(196,181,253,.8),rgba(165,180,252,.55) 45%,rgba(153,246,228,.75));
  border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow),var(--inner)}
.today h2{font-size:21px;line-height:1.25;margin-top:8px}
.today .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.done-badge{display:flex;align-items:center;gap:14px;margin-top:16px}
.big-check{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.75);box-shadow:var(--inner),0 10px 20px -10px rgba(99,102,241,.6)}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:default}
.task.clickable{cursor:pointer}
.box{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.75);
  border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.task-main{flex:1;min-width:0}
.task-top{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.task-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.future{opacity:.5}
.task.missed .task-title{color:var(--muted)}
.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.55);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--primary-2),#7dd3fc,var(--teal))}
.reward{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,.5)}
.reward:last-child{border:0}
.reward .pts{margin-left:auto;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}
.reward.got .pts{color:#4338ca}

/* Sheet */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(40,44,70,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:linear-gradient(140deg,rgba(255,255,255,.9),rgba(255,255,255,.72));width:100%;max-width:480px;margin:0 8px 8px;padding:24px 20px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(60px);opacity:0}}
.score-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;margin-top:16px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px 6px}
.field input{width:100%;height:64px;border-radius:22px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.7);
  font:inherit;font-size:28px;font-weight:800;text-align:center;color:var(--ink);box-shadow:inset 0 2px 4px rgba(0,0,0,.06);outline:none}
.field input:focus{border-color:#a5b4fc;box-shadow:0 0 0 4px rgba(165,180,252,.35)}
.slash{font-size:28px;font-weight:300;color:var(--faint);padding-bottom:14px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.levels button{height:50px;border-radius:18px;font-size:17px}
.levels button.sel{color:#fff;background:linear-gradient(180deg,var(--primary-2),var(--primary));border-color:transparent}

/* Parent */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.cell{border-radius:14px;padding:8px 0 6px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.7)}
.cell .v{font-size:13px;margin-top:4px;color:var(--ink);height:18px}
.cell.done{background:linear-gradient(180deg,rgba(139,143,251,.9),rgba(99,102,241,.9));color:rgba(255,255,255,.85)}
.cell.done .v{color:#fff}
.cell.missed{background:rgba(232,104,122,.14);border-color:rgba(232,104,122,.35)}
.cell.pending{border:2px dashed rgba(99,102,241,.5)}
.cell.future{opacity:.45}
.hist{display:flex;gap:6px;align-items:flex-end;height:50px;margin-top:8px}
.hist div{flex:1;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#a5b4fc,#6366f1);min-height:4px}
.recent{font-size:13px;margin-top:10px}
.recent div{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.5)}
.recent div span:nth-child(2){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);margin-top:12px;list-style:none}
summary::-webkit-details-marker{display:none}
.acc>summary.acc-head{margin:0;padding:14px 16px;border-radius:24px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  color:var(--ink);font-size:inherit;font-weight:inherit;user-select:none}
.acc>summary.acc-head .sub i{font-size:12px;vertical-align:-1px}
.acc-chev{display:inline-flex;font-size:20px;color:var(--muted);transition:transform .25s;flex:none}
.acc[open]>summary .acc-chev{transform:rotate(180deg)}
.acc-body{margin-top:14px}
.acc[open]>.acc-body{animation:fade .25s}
.input{width:100%;min-width:0;height:50px;border-radius:18px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.65);
  font:inherit;font-size:15px;font-weight:600;padding:0 16px;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.input:focus{border-color:#a5b4fc;box-shadow:0 0 0 4px rgba(165,180,252,.35)}
select.input{cursor:pointer;padding-right:40px;background-repeat:no-repeat;background-size:6px 6px,6px 6px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px}
textarea{width:100%;min-height:150px;border-radius:20px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.65);
  font:inherit;font-size:14px;padding:14px;color:var(--ink);resize:vertical;outline:none}

.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:40;padding:12px 20px;font-weight:700;border-radius:22px;
  animation:fade .2s;width:max-content;max-width:calc(100vw - 32px);text-align:center;line-height:1.35}
.toast.err{color:#be123c}
.spinner{width:42px;height:42px;border-radius:50%;margin:80px auto;border:4px solid rgba(255,255,255,.6);border-top-color:var(--primary);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.confetti{position:fixed;top:-20px;z-index:50;width:9px;height:14px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
.celebrate{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none}
.celebrate .glass{padding:26px 34px;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.celebrate .pts{font-size:44px;font-weight:800;background:linear-gradient(90deg,#6366f1,#3cc7b6);-webkit-background-clip:text;background-clip:text;color:transparent}
a{color:inherit}

/* Pets */
.pet-card{display:grid;grid-template-columns:128px minmax(0,1fr);gap:14px;align-items:center;padding:16px 18px 18px}
.pet-img{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 14px rgba(38,40,80,.22));cursor:pointer;-webkit-user-select:none;user-select:none}
.pet-img.bounce{animation:bounce .65s}
@keyframes bounce{30%{transform:translateY(-14px) scale(1.05)}60%{transform:translateY(0) scale(.97)}}
.pet-name{font-size:21px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble{position:relative;margin-top:8px;padding:9px 12px;border-radius:16px;background:rgba(255,255,255,.78);font-size:13.5px;font-weight:600;color:#3b3f55;line-height:1.35;border:1px solid rgba(255,255,255,.95)}
.bubble::before{content:'';position:absolute;left:-7px;top:14px;border:7px solid transparent;border-right-color:rgba(255,255,255,.85);border-left:0}
.xp-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.pet-face{width:50px;height:50px;border-radius:50%;flex:none;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 20px -10px rgba(38,40,80,.35)}
.pet-face img{width:94px;height:94px;max-width:none;flex:none;object-fit:contain;margin-top:-1px}
.pick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{padding:12px 8px 14px;border-radius:26px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);border:2px solid rgba(255,255,255,.75)}
.pick img{width:100%;max-width:130px;aspect-ratio:1;object-fit:contain;display:block;margin:0 auto}
.pick b{display:block;font-size:16px;margin-top:4px}
.pick.sel{border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,.18),var(--shadow)}
.evo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.evo>div{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.evo .slot{aspect-ratio:1;border-radius:16px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);display:grid;place-items:center;margin-bottom:4px;font-size:18px;color:var(--faint)}
.evo .slot img{width:92%;height:92%;object-fit:contain}
.evo .slot.now{border:2px solid var(--primary)}
.sheet .pet-big{width:170px;max-width:60%;display:block;margin:0 auto;filter:drop-shadow(0 14px 14px rgba(38,40,80,.2))}

/* Games */
.game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game-tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:24px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;position:relative;border:1px solid rgba(255,255,255,.62)}
.game-tile b{font-size:16px}
.game-tile span.sub{margin:0;font-size:12.5px;line-height:1.3}
.game-tile .chip{position:absolute;top:10px;right:10px;height:24px;font-size:11px;padding:0 9px}

<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
<div id="app"><div class="spinner"></div></div>

<script>
window.onerror = (m, src, l, c) => { document.getElementById('app').insertAdjacentHTML('beforeend', '<div class="glass panel" style="margin-top:12px;color:#be123c">Error: ' + m + ' @' + l + ':' + c + '</div>'); };
</script>
<script>
const app = document.getElementById('app');
const LEVELS = [['a1','A1'],['a2','A2'],['b1','B1'],['b1-b2','B1+'],['b2','B2'],['c1','C1']];
const CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const BIG_CHECK = CHECK.replace('width="18" height="18"', 'width="30" height="30"');
let pub = null, session = null, dash = null;
const SEC = { level: ['target', 't-level'], grammar: ['book-open-text', 't-grammar'], vocabulary: ['text-aa', 't-vocab'],
  listening: ['headphones', 't-listen'], reading: ['article', 't-read'], writing: ['pen-nib', 't-write'], 'use-of-english': ['puzzle-piece', 't-uoe'] };
const REWARD_ICONS = ['cake', 'device-mobile', 'broom', 'ice-cream', 'popcorn', 'gift', 'ticket', 'trophy'];
const icon = (n, w) => '<i class="ph-' + (w || 'bold') + ' ph-' + n + '"></i>';
const tile = (sec, sm) => { const x = SEC[sec] || SEC.grammar; return '<span class="tile ' + (sm ? 'sm ' : '') + x[1] + '">' + icon(x[0], 'duotone') + '</span>'; };
const noEmoji = s => String(s ?? '').replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu, '').replace(/\s+/g, ' ').trim();
const rtext = s => esc(noEmoji(s)).replace(/₪/g, '<span style="font-family:Arial,sans-serif">₪</span>');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
// Served by Apps Script: google.script.run. Served from GitHub Pages: anonymous JSON API
// (no Google cookies, so child accounts under 13 are not blocked).
const API_URL = 'https:' + '/' + '/script.google.com/macros/s/AKfycbzN95JPrZcVFtwOc5yYpZLEh5fhySlDWHim1wAF_-3kdQpij1s6g4-ixld8NgK27HNI3w/exec';
function call(fn, ...args){
  if (window.google && google.script && google.script.run) {
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e))[fn](...args));
  }
  return fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) })
    .then(r => r.json())
    .then(r => { if (!r.ok) throw new Error(r.error); return r.data; });
}
function toast(msg, err){
  const t = document.createElement('div');
  t.className = 'toast glass' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  t.onclick = () => t.remove();
  setTimeout(() => t.remove(), err ? 7000 : 2600);
}
// Group from the link (?g=...), remembered on the device so the installed app (which always
// starts at the base URL) opens the right group. Empty means the default group.
const IN_APPS_SCRIPT = !!(window.google && google.script);
function groupId(){
  if (IN_APPS_SCRIPT) return '';
  const g = new URLSearchParams(location.search).get('g');
  if (g) store.set('eq_group', g);
  return g || store.get('eq_group') || '';
}

// Install as an app: Android/desktop Chrome fire beforeinstallprompt; iOS needs Share > Add to Home Screen.
let installPrompt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
if (!IN_APPS_SCRIPT) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; const b = document.getElementById('install'); if (b) b.hidden = false; });
  window.addEventListener('appinstalled', () => { installPrompt = null; const b = document.getElementById('install'); if (b) b.hidden = true; toast('Installed'); });
}
function installCard(){
  if (IN_APPS_SCRIPT || isStandalone()) return '';
  if (isIos()) return '<div class="sub mt" style="text-align:center;font-size:13px">' + icon('export') + ' Install: tap Share, then <b>Add to Home Screen</b></div>';
  return '<button class="btn btn-glass btn-block mt" id="install"' + (installPrompt ? '' : ' hidden') + '>' + icon('download-simple') + ' Install app</button>';
}

function loading(){ app.innerHTML = '<div class="spinner"></div>'; }
function colorOf(name){ const g = (pub?.girls || []).find(x => x.name === name); return g?.color || '#6366f1'; }
function fmtDate(d){ const [y,m,dd] = d.split('-'); return dd + '/' + m; }

// ---------- Pets ----------
// Art and game content live on GitHub Pages (docs/pets, docs/pics, docs/games.js); the Apps Script
// copy of the page loads them from there.
const ASSETS = window.EQ_ASSETS || (IN_APPS_SCRIPT ? 'https:' + '/' + '/yanivkrispel-cyber.github.io/english-quest/' : '');
const PETS = [['turtle', 'Shelly'], ['monster', 'Fizz'], ['cat', 'Mochi'], ['cow', 'Daisy'], ['fawn', 'Fern'],
  ['donkey', 'Dusty'], ['sheep', 'Cloud'], ['giraffe', 'Zuri'], ['elephant', 'Peanut'], ['lion', 'Leo']];
// Growth stages drawn so far for each pet. A pet that is further along keeps its last drawn look
// until the next drawing is added here, and then gets its growing celebration.
const PET_ART = { turtle: 2, monster: 2, cat: 2, cow: 2, fawn: 2, donkey: 2, sheep: 2, giraffe: 2, elephant: 1, lion: 2 };
const STAGES = ['Baby', 'Kid', 'Explorer', 'Hero', 'Legend'];
const petName = id => (PETS.find(p => p[0] === id) || [id, id])[1];
const shownStage = p => Math.min(p.stage || 1, PET_ART[p.id] || 1);
const petSrc = (id, stage, mood) => ASSETS + 'pets/' + id + '/' + Math.min(stage || 1, PET_ART[id] || 1) + '-' + (mood || 'happy') + '.webp';
function petFace(pet, color, name){
  if (pet && PET_ART[pet.id]) return `<span class="pet-face"><img src="${petSrc(pet.id, pet.stage, 'happy')}" alt=""></span>`;
  return `<span class="avatar" style="background:${esc(color)};color:${esc(color)}"><span style="color:#fff">${esc(String(name)[0])}</span></span>`;
}
const pick = list => list[Math.floor(Math.random() * list.length)];
const PET_LINES = {
  sleepy: ['Zzz… wake me up with a game!', 'I\'m hungry for new words. Shall we play?', 'Psst… one quick game and I\'m awake!'],
  happy: ['That was fun! One more game?', 'I\'m growing thanks to you!', 'You\'re doing great today!', 'Let\'s learn another word!'],
  cool: ['A {streak}-day streak. We\'re so cool!', 'Nothing can stop us now!', 'Best team ever!'],
  celebrate: ['Yay! Tickles!', 'Hehe! Again!', 'I love English!']
};
// Sleepy until today's practice; cool on a 7-day streak.
function petMood(d){
  const practiced = d.week.some(w => w.isToday && w.done) || (d.games && d.games.todayRounds > 0);
  if (!practiced) return 'sleepy';
  return d.stats.streak >= 7 ? 'cool' : 'happy';
}
const petLine = (d, mood) => pick(PET_LINES[mood]).replace('{streak}', d.stats.streak);

function petCard(d){
  const p = d.pet, rec = warmupGame(d), lt = d.levelTest;
  if (!p) return `<div class="today iri">
    <div class="row-flex" style="gap:14px"><img src="${petSrc('cat', 1, 'happy')}" alt="" style="width:92px;height:92px;object-fit:contain;flex:none">
      <div><h2 style="margin:0">Adopt a pet</h2><div class="sub" style="color:#3b3f55">A friend who grows every time you practice English.</div></div></div>
    <button class="btn btn-primary btn-block mt" id="adopt">${icon('paw-print')} Choose your pet</button></div>`;
  const mood = lt ? 'happy' : petMood(d);
  const span = p.to ? p.to - p.from : 0, pct = p.to ? Math.round((p.xp - p.from) / span * 100) : 100;
  return `<div class="glass pet-card iri">
    <img class="pet-img" id="petimg" src="${petSrc(p.id, p.stage, mood)}" alt="${esc(p.name)}">
    <div style="min-width:0">
      <div class="row-flex between" style="gap:8px"><div class="pet-name">${esc(p.name)}</div>
        <button class="btn btn-glass icon-btn" id="petedit" style="width:34px;height:34px;font-size:14px;flex:none" title="Change pet">${icon('pencil-simple')}</button></div>
      <span class="chip purple">${STAGES[p.stage - 1]}</span>
      <div class="bubble" id="petline">${esc(lt ? 'Hi! First, let\'s find your English level. Then we can play together!' : petLine(d, mood))}</div>
      <div class="bar mt-s" style="height:10px"><i style="width:${Math.max(3, pct)}%"></i></div>
      <div class="xp-row"><span>${p.to ? (p.xp - p.from) + ' / ' + span + ' XP' : p.xp + ' XP'}</span><span>${p.to ? 'to ' + STAGES[p.stage] : 'Fully grown!'}</span></div>
    </div>
    ${lt ? `<a class="btn btn-teal btn-block" href="${esc(lt.url)}" target="_blank" rel="noopener" style="grid-column:1 / -1">${icon('target')} Start the level test</a>`
      : `<button class="btn btn-primary btn-block" data-game="${rec}" style="grid-column:1 / -1">${icon('play')} Play ${GAME_INFO[rec].name}</button>`}
  </div>`;
}

// Tapping the pet: a happy jump and a new line.
function bindPet(d){
  const pi = document.getElementById('petimg');
  if (!pi || !d.pet) return;
  pi.onclick = () => {
    pi.src = petSrc(d.pet.id, d.pet.stage, 'celebrate');
    pi.classList.remove('bounce'); void pi.offsetWidth; pi.classList.add('bounce');
    document.getElementById('petline').textContent = pick(PET_LINES.celebrate);
    clearTimeout(pi.t);
    pi.t = setTimeout(() => {
      const m = d.levelTest ? 'happy' : petMood(d);
      pi.src = petSrc(d.pet.id, d.pet.stage, m);
      document.getElementById('petline').textContent = d.levelTest ? 'The level test first, then we play!' : petLine(d, m);
    }, 1600);
  };
}

function dashHeader(d){
  return `<div class="row-flex between">
      <div class="row-flex">
        ${petFace(d.pet, d.girl.color, d.girl.name)}
        <div><h2 style="font-size:22px">Hi ${esc(d.girl.name)}</h2>${d.levelTest ? '<span class="chip orange" style="margin-top:4px">New</span>'
          : `<span class="chip purple" style="margin-top:4px">Level ${esc(d.girl.levelLabel)}</span>`}</div>
      </div>
      <div class="row-flex" style="gap:8px">
        <button class="btn btn-glass icon-btn" id="refresh" title="Refresh">${icon('arrows-clockwise')}</button>
        <button class="btn btn-glass icon-btn" id="logout" title="Switch user">${icon('sign-out')}</button>
      </div>
    </div>`;
}

// A new kid sees only the level test: the daily task, the games and the rewards open after it.
function renderOnboarding(d){
  const lt = d.levelTest;
  const w = { section: 'level', date: lt.date, day: 'Step 1', label: 'Level Test', title: lt.title, url: lt.url };
  app.innerHTML = `
  <div class="stack">
    ${dashHeader(d)}
    ${petCard(d)}
    <div class="today iri">
      <div class="row-flex between"><span class="label" style="color:#3b3f55">Step 1 · Your level</span><span class="chip">20–30 min</span></div>
      <div class="row-flex mt-s" style="gap:10px">${tile('level')}<b>${esc(lt.title)}</b></div>
      <h2>Let's find your English level</h2>
      <div class="sub" style="color:#3b3f55">Answer the questions on test-english.com. At the end you will see your level (A1, A2, B1…). Come back here and tap <b>I got my level</b>.</div>
      <div class="btns"><a class="btn btn-teal" href="${esc(lt.url)}" target="_blank" rel="noopener">Start ${icon('arrow-up-right')}</a>
        <button class="btn btn-primary" id="gotlevel">I got my level ${icon('check')}</button></div>
    </div>
    <div class="glass panel">
      <div class="row-flex between"><h2>Opens after the test</h2><span class="chip">${icon('lock-simple')} Locked</span></div>
      <div class="sub mt-s" style="font-size:13px">Your daily task, the four games and the rewards open as soon as we know your level.</div>
      <div class="game-grid mt">${Object.keys(GAME_INFO).map(k => `<div class="soft game-tile locked">

function confettiCanvas(cv){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, ctx = cv.getContext('2d');
  cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.scale(dpr, dpr);
  const cols = ['#fde68a', '#f9a8d4', '#a5b4fc', '#99f6e4', '#fdba74', '#fff'], P = [];
  for (let i = 0; i < 150; i++) P.push({ x: r.width / 2, y: r.height * .38, vx: (Math.random() - .5) * 10, vy: -Math.random() * 10 - 2,
    s: Math.random() * 6 + 4, c: cols[i % cols.length], a: Math.random() * 6, va: (Math.random() - .5) * .3 });
  const t0 = performance.now();
  (function f(t){
    ctx.clearRect(0, 0, r.width, r.height);
    P.forEach(p => { p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - t0 < 3400) requestAnimationFrame(f); else ctx.clearRect(0, 0, r.width, r.height);
  })(t0);
}

// ---------- Games ----------
const GAME_INFO = {
  match: { name: 'Match it', icon: 'text-aa', tile: 't-vocab', desc: 'Words and meanings' },
  listen: { name: 'Hear it', icon: 'headphones', tile: 't-listen', desc: 'Listen and choose' },

  spot: { name: 'Spot it', icon: 'magnifying-glass', tile: 't-uoe', desc: 'Find the mistake' }
};
// The warm-up game follows today's task: vocabulary day -> Match it, listening day -> Hear it...
const WARMUP = { vocabulary: 'match', listening: 'listen', grammar: 'build', reading: 'match', writing: 'spot', 'use-of-english': 'spot', level: 'match' };
const warmupGame = d => { const t = d.week.find(w => w.isToday); return WARMUP[t && t.section] || 'match'; };
const GAMES_DEFAULT = { todayRounds: 0, todayXp: 0, dayCap: 60, weekRounds: 0, weekAvg: null, total: 0, recent: {}, review: [] };

function gamesPanel(d){

  return `<div class="glass panel">
    <div class="row-flex between"><h2>Play &amp; learn</h2><span class="chip ${full ? 'teal' : 'orange'}">${icon('lightning')} ${g.todayXp}/${g.dayCap} XP today</span></div>
    <div class="sub mt-s" style="font-size:13px">${full ? 'Your pet is full for today. Games still help you learn!' : 'Two minutes a game. Your score saves by itself.'}</div>
    <div class="game-grid mt">${Object.keys(GAME_INFO).map(k => `<button class="soft game-tile ${k === rec ? 'rec' : ''}" data-game="${k}">
      ${k === rec ? '<span class="chip purple">Warm-up</span>' : ''}
      <span class="tile ${GAME_INFO[k].tile}">${icon(GAME_INFO[k].icon, 'duotone')}</span>
      <b>${GAME_INFO[k].name}</b><span class="sub">${GAME_INFO[k].desc}</span></button>`).join('')}</div>
  </div>`;

const BANK_V = 1, ROUND = 5;
const LV_ORDER = ['a1', 'a2', 'b1', 'b2', 'c1'];
const NEXT_LV = { a1: 'a2', a2: 'b1', b1: 'b2', b2: 'c1' };
let bankPromise = null, bankIndex = null, G = null;
function loadBank(){
  if (window.EQ_GAMES) return Promise.resolve(window.EQ_GAMES);
  return bankPromise = bankPromise || new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = ASSETS + 'games.js?v=' + BANK_V;
    s.onload = () => res(window.EQ_GAMES);
    s.onerror = () => { bankPromise = null; s.remove(); rej(new Error('Could not load the games. Check the connection and try again.')); };
    document.head.appendChild(s);
  });
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const idKey = w => String(w).replace(/[^A-Za-z0-9-]/g, '_');
const picSrc = w => ASSETS + 'pics/' + String(w).replace(/ /g, '-') + '.webp';
// A B1+ kid plays B1 and B2 items together.
const kidLevels = lv => lv === 'b1-b2' ? ['b1', 'b2'] : [LV_ORDER.indexOf(lv) >= 0 ? lv : 'a2'];

function bankItems(B, game, lv){
  if (game === 'match') {
    const out = (B.match[lv] || []).map(([w, def]) => ({ id: 'm:' + lv + ':' + idKey(w), kind: 'def', word: w, def, lv }));
    if (lv === 'a1') Object.keys(B.pics).forEach(t => B.pics[t].forEach(w => out.push({ id: 'p:' + idKey(w), kind: 'pic', word: w, topic: t, lv })));
    return out;
  }
  return (B[game][lv] || []).map((x, i) => ({ id: game[0] + ':' + lv + ':' + i, data: x, lv }));
}
function itemById(B, id){
  if (!bankIndex) {
    bankIndex = {};
    Object.keys(GAME_INFO).forEach(g => LV_ORDER.forEach(lv => bankItems(B, g, lv).forEach(x => { bankIndex[x.id] = x; })));
  }
  return bankIndex[id];
}
const seenKey = () => 'eq_seen_' + (session ? session.name : '');

// Five items: up to two missed items that are due again, then new ones (not seen lately).
// Two strong rounds in a row swap one item for the next level.
function makeRound(B, game){
  const levels = kidLevels(dash.girl.level);
  const pool = [].concat(...levels.map(l => bankItems(B, game, l)));
  const pre = game === 'match' ? ['m:', 'p:'] : [game[0] + ':'];
  const due = (dash.games.review || []).filter(id => pre.some(p => id.indexOf(p) === 0)).map(id => itemById(B, id)).filter(Boolean).slice(0, 2);
  const taken = new Set(due.map(x => x.id)), seen = store.get(seenKey()) || [];
  let fresh = shuffle(pool.filter(x => !taken.has(x.id) && seen.indexOf(x.id) < 0));
  if (fresh.length + due.length < ROUND) fresh = fresh.concat(shuffle(pool.filter(x => !taken.has(x.id) && fresh.indexOf(x) < 0)));
  const items = due.concat(fresh).slice(0, ROUND);
  const recent = (dash.games.recent || {})[game] || [], nxt = levels.length === 1 ? NEXT_LV[levels[0]] : null;
  if (nxt && recent.length >= 2 && recent.slice(-2).every(p => p >= 90)) {
    const extra = shuffle(bankItems(B, game, nxt))[0];
    if (extra) items[items.length - 1] = extra;
  }
  return shuffle(items).map(x => prepare(B, game, x));
}

function prepare(B, game, x){
  if (game === 'match') {
    const others = x.kind === 'pic' ? B.pics[x.topic].filter(w => w !== x.word) : B.match[x.lv].map(m => m[0]).filter(w => w !== x.word);
    return Object.assign({ answer: x.word, options: shuffle([x.word].concat(shuffle(others).slice(0, 3))) }, x);
  }
  if (game === 'listen') {
    const [say, q, a, ...wrong] = x.data;
    return Object.assign({ say, q: q || 'Which word do you hear?', answer: a, options: shuffle([a].concat(wrong)) }, x);
  }
  if (game === 'build') {
    const words = x.data.split(' ');
    let order = shuffle(words.map((_, i) => i));
    if (order.every((v, i) => words[v] === words[i])) order = order.reverse();
    return Object.assign({ sentence: x.data, words, order }, x);
  }
  const [s, fix, tip] = x.data, raw = s.split(' '), wrong = raw.findIndex(t => t.indexOf('*') >= 0);
  return Object.assign({ tokens: raw.map(t => t.replace(/\*/g, '')), wrong, fix, tip, raw: raw[wrong] }, x);
}
const fixedWord = it => it.fix ? it.raw.replace(/\*(.*?)\*/, it.fix) : '';
const fixedSentence = it => it.tokens.map((w, k) => k === it.wrong ? fixedWord(it) : w).filter(Boolean).join(' ');

async function startGame(game){
  if (!dash) return;
  if (dash.levelTest) { toast('Do the level test first, then the games open', true); return renderDash(); }
  if (!dash.games) dash.games = Object.assign({}, GAMES_DEFAULT);
  app.innerHTML = '<div class="spinner"></div>';
  let B;
  try { B = await loadBank(); }
  catch(e){ toast(e.message, true); return renderDash(); }
  G = { game, items: makeRound(B, game), i: 0, res: [], missed: [], right: [], built: [], locked: false };
  window.scrollTo(0, 0);
  renderItem();
}

function gameBars(){
  return G.items.map((_, k) => `<i class="${k < G.res.length ? (G.res[k] ? 'ok' : 'no') : k === G.i ? 'on' : ''}"></i>`).join('');
}

function renderItem(){
  if (!G) return;
  if (G.i >= G.items.length) return finishRound();
  G.locked = false; G.built = [];
  const it = G.items[G.i], n = G.items.length;
  let body;
  if (G.game === 'match') {
    body = `<div class="glass qcard">${it.kind === 'pic'
        ? `<div class="qprompt">What is this?</div><img class="qpic" src="${picSrc(it.word)}" alt="">`
        : `<div class="qprompt">Which word matches?</div><div class="qbig">${esc(it.def)}</div>`}</div>
      <div class="opts">${it.options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if (G.game === 'listen') {
    body = `<div class="glass qcard">
        <div class="speak-row"><button class="speak" id="say" aria-label="Listen">${icon('speaker-high')}</button>
          <button class="btn btn-glass btn-sm" id="slow">${icon('gauge')} Slow</button></div>
        <div class="qbig" style="font-size:18px">${esc(it.q)}</div><div id="transcript"></div></div>
      <div class="opts ${it.options.some(o => o.length > 13) ? 'one' : ''}">${it.options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if (G.game === 'build') {
    body = `<div class="qprompt" style="text-align:center">Tap the words in the right order</div>
      <div class="slots" id="slots"></div>
      <div class="bank" id="bank">${it.order.map(k => `<button class="tok" data-k="${k}">${esc(it.words[k])}</button>`).join('')}</div>
      <button class="btn btn-primary btn-block" id="check" disabled>Check ${icon('check')}</button>`;
  } else {
    body = `<div class="glass qcard"><div class="qprompt">One word is wrong. Tap it!</div>
      <div class="sentence">${it.tokens.map((t, k) => `<button class="tok" data-k="${k}">${esc(t)}</button>`).join('')}</div></div>`;
  }
  const hint = { match: 'Hmm… which one is it?', listen: 'Listen carefully!', build: 'Let\'s build it together!', spot: 'Can you find it?' }[G.game];
  app.innerHTML = `<div class="gscreen" id="gs">
    <div class="gtop"><button class="btn btn-glass icon-btn" id="gquit" title="Stop">${icon('x')}</button>
      <div style="flex:1;min-width:0"><h2>${GAME_INFO[G.game].name}</h2><div class="sub" style="font-size:12px;margin:0">Level ${esc(dash.girl.levelLabel)} · ${G.i + 1} of ${n}</div></div>
      <span class="tile ${GAME_INFO[G.game].tile}">${icon(GAME_INFO[G.game].icon, 'duotone')}</span></div>
    <div class="gprog" id="gprog">${gameBars()}</div>
    ${body}
    <div class="react">${dash.pet ? `<img class="gpet" id="gpet" src="${petSrc(dash.pet.id, dash.pet.stage, 'thinking')}" alt="">` : ''}
      <div class="bubble" id="fb">${hint}</div></div>
    <div id="explain"></div><div style="flex:1"></div><div id="gnext"></div>
  </div>`;
  document.getElementById('gs').onclick = onGameClick;
  if (G.game === 'listen') setTimeout(() => sayIt(false), 300);
}

function onGameClick(e){
  const t = e.target.closest('button');
  if (!t || !G) return;
  if (t.id === 'gquit') { G = null; speechStop(); return renderDash(); }
  if (t.id === 'gnext-btn') { G.i++; return renderItem(); }
  if (t.id === 'say') return sayIt(false);
  if (t.id === 'slow') return sayIt(true);
  if (G.locked) return;
  const it = G.items[G.i];
  if (t.classList.contains('opt')) {
    const ok = t.dataset.v === it.answer;
    app.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.v === it.answer) b.classList.add('ok'); });
    if (!ok) t.classList.add('no', 'shake');
    if (G.game === 'listen') return answered(ok, `You heard: <b>${esc(it.say)}</b>`);
    return answered(ok, it.kind === 'pic' ? `This is a <b>${esc(it.word)}</b>.` : `<b>${esc(it.word)}</b>: ${esc(it.def)}`);
  }
  if (G.game === 'build' && t.classList.contains('tok')) {
    const k = Number(t.dataset.k);
    if (t.closest('#bank')) { G.built.push(k); t.classList.add('used'); }
    else { G.built.splice(G.built.indexOf(k), 1); app.querySelector('#bank .tok[data-k="' + k + '"]').classList.remove('used'); }
    document.getElementById('slots').innerHTML = G.built.map(x => `<button class="tok placed" data-k="${x}">${esc(it.words[x])}</button>`).join('');
    document.getElementById('check').disabled = G.built.length !== it.words.length;
    return;
  }
  if (t.id === 'check') {
    const ok = G.built.map(x => it.words[x]).join(' ') === it.sentence;
    const sl = document.getElementById('slots');
    sl.style.borderColor = ok ? '#34d399' : '#fb7185';
    if (!ok) sl.classList.add('shake');
    t.disabled = true;
    app.querySelectorAll('#gs .tok').forEach(b => { b.disabled = true; });
    return answered(ok, `<b>${esc(it.sentence)}</b>`);
  }
  if (G.game === 'spot' && t.classList.contains('tok')) {
    const k = Number(t.dataset.k), ok = k === it.wrong;
    app.querySelectorAll('.sentence .tok').forEach(b => { b.disabled = true; });
    const w = app.querySelector('.sentence .tok[data-k="' + it.wrong + '"]');
    w.classList.add('fixed');
    w.innerHTML = '<s>' + esc(it.tokens[it.wrong]) + '</s>' + esc(fixedWord(it));
    if (!ok) t.classList.add('wrongpick', 'shake');
    return answered(ok, `<b>${esc(fixedSentence(it))}</b><br>${esc(it.tip)}`);
  }
}

// Right: quick praise and on to the next item. Wrong: show the answer and wait for "Next".
function answered(ok, explain){
  G.locked = true;
  const it = G.items[G.i];
  G.res.push(ok);
  (ok ? G.right : G.missed).push(it.id);
  document.getElementById('gprog').innerHTML = gameBars();
  const fb = document.getElementById('fb');
  fb.className = 'bubble ' + (ok ? 'ok' : 'no');
  fb.textContent = ok ? pick(['Correct!', 'Great!', 'Yes! You got it!', 'Perfect!', 'Well done!'])
    : pick(['Oops! Let\'s look at the answer.', 'Almost! Here is the answer.', 'Not quite. Now you know!']);
  petReact(ok ? 'celebrate' : 'oops');
  const learn = G.game === 'listen' || G.game === 'spot';
  if (ok) {
    xpPop();
    if (learn) document.getElementById('explain').innerHTML = `<div class="answer-box">${explain}</div>`;
    setTimeout(() => { if (G && G.items[G.i] === it) { G.i++; renderItem(); } }, learn ? 1900 : 1100);
    return;
  }
  document.getElementById('explain').innerHTML = `<div class="answer-box">${explain}</div>`;
  document.getElementById('gnext').innerHTML = `<button class="btn btn-primary btn-block" id="gnext-btn">Next ${icon('arrow-right')}</button>`;
}

function petReact(mood){
  const img = document.getElementById('gpet');
  if (!img || !dash.pet) return;
  img.src = petSrc(dash.pet.id, dash.pet.stage, mood);
  img.classList.remove('pop'); void img.offsetWidth; img.classList.add('pop');
  setTimeout(() => img.classList.remove('pop'), 300);
}

function xpPop(){
  const earned = G.right.length * 2;
  if (dash.games.todayXp + earned > dash.games.dayCap) return;
  const img = document.getElementById('gpet'), r = img ? img.getBoundingClientRect() : { left: window.innerWidth - 90, top: 30 };
  const s = document.createElement('div');
  s.className = 'xp-pop';
  s.textContent = '+2 XP';
  s.style.left = Math.max(8, r.left - 20) + 'px'; s.style.top = (r.top + 10) + 'px';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1000);
}

function finishRound(){
  const correct = G.res.filter(Boolean).length, total = G.res.length, pct = total ? correct / total : 0;
  const mood = pct >= .8 ? 'celebrate' : pct >= .5 ? 'happy' : 'oops';
  store.set(seenKey(), (store.get(seenKey()) || []).concat(G.items.map(x => x.id)).slice(-60));
  const R = { game: G.game, level: dash.girl.level, correct, total, missed: G.missed.slice(), right: G.right.slice() };
  G = null;
  app.innerHTML = `<div class="gscreen">
    <div class="result">
      ${dash.pet ? `<img class="pet-img" src="${petSrc(dash.pet.id, dash.pet.stage, mood)}" alt="">` : ''}
      <h1>${correct}/${total}</h1>
      <h2>${pct === 1 ? 'Perfect round!' : pct >= .8 ? 'Great job!' : pct >= .5 ? 'Nice work!' : 'Good try. Keep going!'}</h2>
      <div class="saved wait" id="savest"><span class="mini-spin"></span>Saving…</div>
      ${R.missed.length ? '<div class="sub" style="font-size:13px;max-width:290px">The ones you missed will come back in another game, so you can learn them.</div>' : ''}
    </div>
    <div class="stack" style="gap:10px">
      <button class="btn btn-primary btn-block" id="again">${icon('arrows-clockwise')} Play again</button>
      <button class="btn btn-glass btn-block" id="home">Back</button></div>
  </div>`;
  if (pct >= .8) confetti();
  document.getElementById('again').onclick = () => startGame(R.game);
  document.getElementById('home').onclick = renderDash;

}

async function saveRound(R){
  const status = (cls, html) => { const el = document.getElementById('savest'); if (el) { el.className = 'saved ' + cls; el.innerHTML = html; } };
  try {
    dash = await call('apiGameResult', session.name, session.pin, R.game, R.level, R.correct, R.total, R.missed, R.right);
    status('', icon('check') + (dash.gameXp ? ' Saved · +' + dash.gameXp + ' XP for ' + esc(dash.pet ? dash.pet.name : 'you') : ' Saved · XP is full for today'));
    checkGrowth();
  } catch(e){
    queueResult(R);
    status('err', icon('wifi-slash') + ' Saved on this phone. It will sync when you are online.');
  }
}

// Rounds that could not be sent wait on the phone and go up on the next sign-in.
const pendKey = () => 'eq_pending_' + session.name;
function queueResult(R){ store.set(pendKey(), (store.get(pendKey()) || []).concat([R]).slice(-20)); }
async function flushPending(){
  if (!session) return;
  const q = store.get(pendKey()) || [];
  if (!q.length) return;
  store.del(pendKey());
  for (let i = 0; i < q.length; i++) {
    try { dash = await call('apiGameResult', session.name, session.pin, q[i].game, q[i].level, q[i].correct, q[i].total, q[i].missed, q[i].right); }
    catch(e){ store.set(pendKey(), q.slice(i).concat(store.get(pendKey()) || [])); return; }
  }
  if (!G && document.getElementById('petimg')) renderDash();
}

// Read-aloud for Hear it: the phone's own English voice (no recordings, no cost).
let voice = null;
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /^en-GB/i.test(v.lang)) || vs.find(v => /^en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch(e){}
}
if ('speechSynthesis' in window) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch(e){} }
function sayIt(slow){
  const it = G && G.items[G.i];
  if (!it || !it.say) return;
  const btn = document.getElementById('say'), tr = document.getElementById('transcript');
  if (!('speechSynthesis' in window)) { if (tr) tr.innerHTML = `<div class="answer-box">No sound on this device, so read it: <b>${esc(it.say)}</b></div>`; return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(it.say);
    u.lang = voice ? voice.lang : 'en-GB';
    if (voice) u.voice = voice;
    u.rate = slow ? .7 : .95;
    if (btn) btn.classList.add('talk');
    u.onend = u.onerror = () => { if (btn) btn.classList.remove('talk'); };
    speechSynthesis.speak(u);
  } catch(e){}
}
function speechStop(){ try { speechSynthesis.cancel(); } catch(e){} }

// ---------- Opening animation ----------
// The ten pets pop in around a glass portal, orbit it and do a wave; on a phone where a kid is
// remembered, her own pet then jumps into the middle and says hi. A tap skips it; with reduced
// motion it is a short still picture. The app loads underneath meanwhile.
function splashScreen(){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const saved = store.get('eq_auth'), mine = saved ? store.get('eq_pet_' + saved.name) : null;
  const me = mine && PET_ART[mine.id] ? mine : null;
  const el = document.createElement('div');
  el.className = 'splash' + (reduce ? ' still' : '');
  el.innerHTML = `<div class="splash-stage">
      <div class="orbit">${PETS.map(([id], i) => `<div class="slot" style="--a:${Math.round(i * 360 / PETS.length - 90)}deg">
        <div class="up"><div class="pop" style="--d:${150 + i * 75}ms"><img src="${petSrc(id, 1, 'happy')}" data-id="${id}" alt="" onload="this.classList.add('ok')"></div></div></div>`).join('')}</div>
      <div class="portal"><div class="portal-in">
        ${me ? `<img class="me" src="${petSrc(me.id, me.stage, 'celebrate')}" alt="" onload="this.classList.add('ok')">` : ''}
        <div class="ptitle">English Quest</div><div class="psub">10 minutes a day</div></div></div>
      ${Array.from({ length: 14 }, () => `<i class="spark" style="--x:${Math.round(Math.random() * 100)}%;--y:${Math.round(Math.random() * 100)}%;--t:${(Math.random() * 1.7).toFixed(2)}s"></i>`).join('')}
    </div>`;
  document.body.appendChild(el);
  document.body.classList.add('splashing');
  let gone = false, minDone;
  const done = new Promise(r => { minDone = r; });
  const later = (ms, f) => setTimeout(() => { if (!gone) f(); }, ms);
  if (reduce) later(700, minDone);
  else {
    PETS.forEach(([id]) => { new Image().src = petSrc(id, 1, 'celebrate'); });
    // The wave: each pet cheers and hops in turn.
    el.querySelectorAll('.orbit img').forEach((img, i) => later(1350 + i * 60, () => {
      img.src = petSrc(img.dataset.id, 1, 'celebrate');
      img.classList.add('hop');
      later(520, () => { img.src = petSrc(img.dataset.id, 1, 'happy'); img.classList.remove('hop'); });
    }));
    later(1950, () => {
      if (!me) return el.classList.add('shine');
      el.classList.add('hello');
      el.querySelector('.ptitle').textContent = 'Hi ' + saved.name + '!';
      el.querySelector('.psub').textContent = 'Ready to play?';
    });
    setTimeout(minDone, me ? 2800 : 2450);
  }
  const close = () => {
    if (gone) return;
    gone = true;
    el.classList.add('out');
    document.body.classList.remove('splashing');
    setTimeout(() => el.remove(), 500);
  };
  el.onclick = close;
  return { done, close };
}

// Starts the app behind the opening animation and lifts it when both are ready (at most 9 s).
async function boot(){
  const s = splashScreen();
  const ready = start().catch(() => {});
  await Promise.race([Promise.all([s.done, ready]), new Promise(r => setTimeout(r, 9000))]);
  s.close();
}

// ---------- Reminders (Web Push) ----------
let pushKey = null, pushSynced = false;
function keyBytes(b64){
  const s = atob(b64.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - b64.length % 4) % 4));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}
async function pushState(){
  if (IN_APPS_SCRIPT || !pushKey || !('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
    return isIos() && !isStandalone() && !IN_APPS_SCRIPT ? { state: 'install' } : { state: 'unsupported' };
  }
  if (Notification.permission === 'denied') return { state: 'denied' };
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  return sub && Notification.permission === 'granted' ? { state: 'on', sub } : { state: 'off' };
}
async function renderPushCard(){
  const el = document.getElementById('pushcard');
  if (!el || !session) return;
  let st;
  try { st = await pushState(); } catch(e){ return; }
  if (st.state === 'on') {
    // Make sure the server knows this device belongs to the kid now signed in (once per app start).
    if (!pushSynced) { pushSynced = true; call('apiPushSubscribe', session.name, session.pin, st.sub.endpoint, navigator.userAgent, false).catch(() => {}); }
    return;
  }
  if (st.state === 'install') {
    el.innerHTML = `<div class="soft stat" style="padding:14px 16px"><span class="tile sm t-fire">${icon('bell-ringing', 'duotone')}</span>
      <div class="sub" style="margin:0;font-size:13px">Want a daily reminder? Install the app first: tap Share, then <b>Add to Home Screen</b>, and open it from there.</div></div>`;
    return;
  }
  if (st.state !== 'off') return;
  el.innerHTML = `<div class="glass panel">
    <div class="row-flex" style="gap:12px"><span class="tile t-fire">${icon('bell-ringing', 'duotone')}</span>
      <div><h2>Daily reminder</h2><div class="sub" style="margin-top:2px;font-size:13px">A nudge on your phone if you haven't practiced yet</div></div></div>
    <button class="btn btn-primary btn-block mt" id="pushon">${icon('bell')} Turn on reminders</button>
  </div>`;
  document.getElementById('pushon').onclick = async e => {
    const btn = e.currentTarget;
    btn.disabled = true; btn.innerHTML = '<span class="mini-spin"></span>Turning on…';
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { el.innerHTML = ''; toast('Notifications are blocked', true); return; }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(pushKey) });
      await call('apiPushSubscribe', session.name, session.pin, sub.endpoint, navigator.userAgent, true);
      pushSynced = true;
      el.innerHTML = `<div class="soft stat" style="padding:14px 16px"><span class="tile sm t-listen">${icon('check', 'bold')}</span>
        <div class="sub" style="margin:0;font-size:13px">Reminders are on — you should get a test notification now.</div></div>`;
    } catch(err){
      toast(err.message || 'Could not turn on reminders', true);
      btn.disabled = false; btn.innerHTML = icon('bell') + ' Turn on reminders';
    }
  };
}

  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) close(); };
  ov.querySelector('#x').onclick = close;
  ov.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => {
    level = b.dataset.lv;
    ov.querySelectorAll('[data-lv]').forEach(x => x.classList.toggle('sel', x === b));
  });
  ov.querySelector('#save').onclick = async e => {
    let c = '', t = '';
    if (isLevel) { if (!level) return toast('Choose your level', true); }
    else {
      c = Number(ov.querySelector('#c').value); t = Number(ov.querySelector('#t').value);
      if (!t || t < 1 || ov.querySelector('#c').value === '' || c < 0 || c > t) return toast('Enter a valid score', true);
    }
    e.currentTarget.disabled = true; e.currentTarget.textContent = 'Saving…';
    try {
      const first = !!dash.levelTest;
      dash = await call('apiSubmit', session.name, session.pin, w.date, c, t, level);
      close(); renderDash(); celebrate(dash.justEarned);
      if (first) setTimeout(() => toast('Level ' + LEVELS.find(x => x[0] === level)[1] + ' saved. Your daily task and the games are open!'), 1200);
    } catch(err){ toast(err.message, true); e.currentTarget.disabled = false; e.currentTarget.textContent = 'Save'; }
  };
}

function celebrate(pts){
  confetti();
  const c = document.createElement('div');
  c.className = 'celebrate';
  c.innerHTML = `<div class="glass"><div class="pts">+${esc(pts)}</div><div style="font-weight:700">points · keep going</div></div>`;
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 2200);
}

function confetti(){
  const em = ['#8b8ffb', '#5eead4', '#f9a8d4', '#fdba74', '#c4b5fd', '#7dd3fc'];
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.style.background = em[i % em.length]; s.style.borderRadius = i % 3 ? '3px' : '50%';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
    s.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 3800);
  }
}

// ---------- Parent ----------
async function parent(pin, silent, remember){
  try {
    if (silent) loading();
    const p = await call('apiParent', pin);
    if (remember) store.set('eq_admin', pin);
    renderParent(p, pin);
    return true;
  } catch(e){
    if (silent) store.del('eq_admin');
    else toast(e.message.includes('PIN') ? 'Wrong PIN' : e.message, true);
    return false;
  }
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); }
  catch(e){ const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast('Copied');
}
const waLink = text => 'https:' + '/' + '/api.whatsapp.com/send?text=' + encodeURIComponent(text);

function groupMessage(g, word){
  return `Good morning! ☀️ English Quest is waiting for you 💜\n10 minutes a day — open the link, pick your name, do today's task and log your score.\n\n🔗 ${g.link}\n\n📝 Word of the day: ${word.word} — ${word.meaning}\n` +
    g.girls.map(k => `🔥 ${k.girl.name}: ${k.stats.weekDone}/${k.stats.weekTotal} this week, ${k.stats.balance} pts`).join('\n');
}

function createdCard(c){
  if (!c) return '';
  const text = c.type === 'group'
    ? `English Quest — ${c.name}\nLink for the kids: ${c.link}\nParent PIN (tap the lock on the home screen): ${c.pin}`
    : `Hi ${c.name}! 👋 Your English Quest link: ${c.link}\nTap your name and enter your PIN: ${c.pin}\nStart with the level test (about 20 minutes), then your daily tasks and the games open.`;
  return `<div class="today iri" id="created">
    <div class="label" style="color:#3b3f55">${c.type === 'group' ? 'Group created' : 'Kid added to ' + esc(c.group)}</div>
    <h2>${esc(c.name)}</h2>
    <div class="row-flex mt-s" style="flex-wrap:wrap;gap:8px">
      <span class="chip purple">${icon('key')} ${c.type === 'group' ? 'Parent PIN' : 'PIN'} ${esc(c.pin)}</span>
    </div>
    <div class="sub mt-s" style="color:#3b3f55;word-break:break-all">${esc(c.link)}</div>
    <div class="row-flex mt-s">
      <button class="btn btn-glass btn-sm" data-copy="${esc(text)}">${icon('copy')} Copy details</button>
      <a class="btn btn-teal btn-sm" target="_blank" rel="noopener" href="${esc(waLink(text))}">${icon('whatsapp-logo')} WhatsApp</a>
    </div>
  </div>`;
}

// Collapsible sections; each one's open/closed state is remembered on the device.
function accOpen(key, dflt){ const v = store.get('eq_acc_' + key); return v === null ? dflt : v; }
function accordion(key, open, head, body){
  return `<details class="acc" data-acc="${esc(key)}" ${open ? 'open' : ''}>
    <summary class="glass acc-head">${head}<span class="acc-chev">${icon('caret-down')}</span></summary>
    <div class="acc-body stack">${body}</div>
  </details>`;
}
function accHead(tileCls, ic, title, sub){
  return `<div class="row-flex" style="gap:12px;min-width:0"><span class="tile ${tileCls}">${icon(ic, 'duotone')}</span>
    <div style="min-width:0"><h2>${title}</h2><div class="sub" style="margin-top:2px;font-size:13px">${sub}</div></div></div>`;
}

function groupBlock(g, p, i){
  const done = g.girls.reduce((a, k) => a + k.stats.weekDone, 0), total = g.girls.reduce((a, k) => a + k.stats.weekTotal, 0);
  const sub = `${g.girls.length} ${g.girls.length === 1 ? 'kid' : 'kids'} · ${done}/${total} this week` +
    (p.isAdmin ? (g.parentPin ? ` · ${icon('key')} ${esc(g.parentPin)}` : ' · admin only') : '');
  return accordion('g:' + g.id, accOpen('g:' + g.id, p.groups.length === 1),
    accHead('t-grammar', 'users-three', esc(g.name), sub), groupBody(g, p, i));
}

function groupBody(g, p, i){
  const goal = g.goal, pct = Math.min(100, Math.round(goal.total / goal.goal * 100));
  return `
    <div class="today">
      <div class="label" style="color:#3b3f55">Group goal</div>
      <h2>${rtext(goal.reward)}</h2>
      <div class="bar mt-s"><i style="width:${Math.max(3, pct)}%"></i></div>
      <div class="sub mt-s" style="color:#3b3f55"><b>${goal.total}</b> / ${goal.goal} points together</div>
    </div>
    ${g.girls.length ? g.girls.map(k => girlCard(k, p.isAdmin)).join('') : '<div class="glass panel sub" style="text-align:center">No kids in this group yet</div>'}
    <div class="glass panel">
      <h2>Share with the kids</h2>
      <div class="row-flex mt-s" style="gap:8px">
        <input class="input" readonly value="${esc(g.link)}">
        <button class="btn btn-glass icon-btn" data-copy="${esc(g.link)}" title="Copy link">${icon('link-simple')}</button>
      </div>
      <textarea class="mt-s" data-msg="${i}">${esc(groupMessage(g, p.word))}</textarea>
      <div class="row-flex mt-s">
        <button class="btn btn-glass btn-sm" data-copymsg="${i}">${icon('copy')} Copy</button>
        <a class="btn btn-teal btn-sm" target="_blank" rel="noopener" data-wa="${i}" href="#">${icon('whatsapp-logo')} WhatsApp</a>
      </div>
    </div>`;
}

const hourLabel = h => String(h).padStart(2, '0') + ':00';

// ---------- Parent notifications ----------
function notifyCard(p){
  return accordion('notify', accOpen('notify', !p.push.devices.length), accHead('t-star', 'bell-simple-ringing', 'Notifications',
    `Daily summary at ${hourLabel(p.push.summaryHour)} · task updates`), '<div class="glass panel" id="parentpush"><div class="sub" style="margin:0">Checking this device…</div></div>');
}

async function subscribeDevice(){
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('Notifications are blocked');
  const reg = await navigator.serviceWorker.ready;
  return (await reg.pushManager.getSubscription()) || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(pushKey) });
}

async function renderParentPush(p, pin){
  const el = document.getElementById('parentpush');
  if (!el) return;
  pushKey = p.push.key;
  let st;
  try { st = await pushState(); } catch(e){ st = { state: 'unsupported' }; }
  const note = text => el.innerHTML = `<div class="sub" style="margin:0;font-size:13px">${text}</div>`;
  if (st.state === 'install') return note(`On iPhone, notifications work from the installed app: tap Share, then <b>Add to Home Screen</b>, and open it from there.`);
  if (st.state === 'unsupported') return note('This browser can’t receive notifications. Open the installed app on your phone.');
  if (st.state === 'denied') return note('Notifications are blocked for this app. Allow them in the phone’s settings for English Quest, then come back.');
  const device = st.state === 'on' ? p.push.devices.find(d => d.e === st.sub.endpoint) : null;

  if (!device) {
    el.innerHTML = `<div class="sub" style="margin:0;font-size:13px">Get a summary every evening at ${hourLabel(p.push.summaryHour)} and an update whenever a kid finishes a task.</div>
      <button class="btn btn-primary btn-block mt" id="pp-on">${icon('bell')} Turn on on this phone</button>`;
    document.getElementById('pp-on').onclick = async e => {
      const btn = e.currentTarget;
      btn.disabled = true; btn.innerHTML = '<span class="mini-spin"></span>Turning on…';
      try {
        const sub = await subscribeDevice();
        const r = await call('apiParentPushSubscribe', pin, sub.endpoint, navigator.userAgent, true);
        p.push.devices.push({ e: sub.endpoint, instant: r.instant });
        toast('On — a test notification is on its way');
        renderParentPush(p, pin);
      } catch(err){ toast(err.message || 'Could not turn on notifications', true); btn.disabled = false; btn.innerHTML = icon('bell') + ' Turn on on this phone'; }
    };
    return;
  }

  el.innerHTML = `
    <div class="row-flex between">
      <div><b style="font-size:15px">Task updates</b><div class="sub" style="margin-top:2px;font-size:12px">A notification whenever a kid finishes a task</div></div>
      <div class="toggle ${device.instant ? '' : 'off'}" id="pp-instant" role="switch" aria-checked="${device.instant}"></div>
    </div>
    <div class="row-flex between mt">
      <div><b style="font-size:15px">Evening summary</b><div class="sub" style="margin-top:2px;font-size:12px">Every day at ${hourLabel(p.push.summaryHour)}</div></div>
      <span class="chip teal">${icon('check')} On</span>
    </div>
    <button class="btn btn-glass btn-block mt" id="pp-test">${icon('paper-plane-tilt')} Send a test notification</button>`;
  const tg = document.getElementById('pp-instant');
  tg.onclick = async () => {
    const next = !device.instant;
    tg.classList.toggle('off', !next);
    try { await call('apiParentPushPrefs', pin, device.e, next); device.instant = next; toast(next ? 'Task updates on' : 'Task updates off'); }
    catch(err){ tg.classList.toggle('off', !device.instant); toast(err.message, true); }
  };
  document.getElementById('pp-test').onclick = async e => {
    const btn = e.currentTarget, label = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<span class="mini-spin"></span>Sending…';
    try { const r = await call('apiParentPushTest', pin, device.e); toast(r.sent ? 'Sent — check your notifications' : 'This device is no longer registered', !r.sent); }
    catch(err){ toast(err.message, true); }
    btn.disabled = false; btn.innerHTML = label;
  };
}
function settingsCard(p){
  const s = p.settings, hours = Array.from({ length: 17 }, (_, i) => i + 6);
  const opts = (sel, withOff) => (withOff ? `<option value="" ${!sel ? 'selected' : ''}>Off</option>` : '') +
    hours.map(h => `<option value="${h}" ${Number(sel) === h ? 'selected' : ''}>${hourLabel(h)}</option>`).join('');
  const sub = `Daily at ${hourLabel(s.reminderHour)}` + (s.lastCallHour ? ` · last call ${hourLabel(s.lastCallHour)}` : ' · no last call');
  return accordion('settings', accOpen('settings', false), accHead('t-fire', 'bell-ringing', 'Reminders', sub), `
    <div class="glass panel">
      <div class="label">Daily reminder</div>
      <select class="input mt-s" id="st-rem">${opts(s.reminderHour, false)}</select>
      <div class="label mt">Last call</div>
      <select class="input mt-s" id="st-last">${opts(s.lastCallHour, true)}</select>
      <div class="sub mt-s" style="font-size:12px">Phone notifications (and emails, where set) go only to kids who haven't practiced that day.</div>
      <button class="btn btn-primary btn-block mt" id="st-save">${icon('check')} Save</button>
    </div>`);
}

function manageCard(p){
  return accordion('manage', accOpen('manage', false), accHead('t-vocab', 'crown-simple', 'Manage', 'Add groups and kids · open the sheet'), manageBody(p));
}

function manageBody(p){
  return `<div class="glass panel">
    <div class="label">New group</div>
    <input class="input mt-s" id="ng-name" placeholder="Group name, e.g. Cohen family">
    <input class="input mt-s" id="ng-email" type="email" placeholder="Parent email for weekly summary (optional)">
    <button class="btn btn-primary btn-block mt-s" id="ng-btn">${icon('users-three')} Create group</button>
    <div class="label mt">New kid</div>
    <input class="input mt-s" id="nk-name" placeholder="Name (must be unique)">
    <div class="row-flex mt-s" style="gap:10px">
      <input class="input" id="nk-age" type="number" inputmode="numeric" placeholder="Age">
      <select class="input" id="nk-level">${p.levels.map(l => `<option value="${l.id}" ${l.id === 'a2' ? 'selected' : ''}>Start ${l.label}</option>`).join('')}</select>
    </div>
    <select class="input mt-s" id="nk-group">${p.groups.map(g => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')}</select>
    <button class="btn btn-primary btn-block mt-s" id="nk-btn">${icon('user-plus')} Add kid</button>
    <div class="sub mt-s" style="font-size:12px">A PIN is created automatically. New kids take the level test first; their daily tasks and the games open after it.</div>
    <a class="btn btn-glass btn-block mt" href="${esc(p.sheetUrl)}" target="_blank" rel="noopener">Open Google Sheet ${icon('arrow-up-right')}</a>
    <div class="sub mt-s" style="font-size:12px">Edit PINs, levels, reminder emails, redeemed points, goals and rewards in the sheet.</div>
  </div>`;
}

function renderParent(p, pin){
  app.innerHTML = `
  <div class="stack">
    <div class="row-flex between">
      <div><h1>${p.isAdmin ? 'Admin view' : 'Parent view'}</h1><div class="sub">${p.isAdmin ? p.groups.length + ' groups · ' + fmtDate(p.today) : 'English Quest'}</div></div>
      <div class="row-flex" style="gap:8px">
        <button class="btn btn-glass icon-btn" id="refresh">${icon('arrows-clockwise')}</button>
        <button class="btn btn-glass icon-btn" id="logout" title="Exit">${icon('sign-out')}</button>
      </div>
    </div>
    ${createdCard(p.created)}
    ${p.groups.map((g, i) => groupBlock(g, p, i)).join('')}
    ${notifyCard(p)}
    ${p.isAdmin ? settingsCard(p) + manageCard(p) : ''}
  </div>`;
  app.querySelectorAll('details.acc').forEach(d => d.addEventListener('toggle', () => store.set('eq_acc_' + d.dataset.acc, d.open)));
  renderParentPush(p, pin);
  document.getElementById('refresh').onclick = () => parent(pin, true);
  document.getElementById('logout').onclick = () => { store.del('eq_admin'); loadHome(); };
  app.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyText(b.dataset.copy));
  app.querySelectorAll('[data-msg]').forEach(ta => {
    const i = ta.dataset.msg, wa = app.querySelector(`[data-wa="${i}"]`);
    const sync = () => wa.href = waLink(ta.value);
    ta.oninput = sync; sync();
    app.querySelector(`[data-copymsg="${i}"]`).onclick = () => copyText(ta.value);
  });
  if (p.created) window.scrollTo({ top: 0, behavior: 'smooth' });
  if (!p.isAdmin) return;
  app.querySelectorAll('[data-testpush]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await call('apiAdminTestPush', pin, b.dataset.testpush); toast('Sent to ' + r.sent + ' device' + (r.sent === 1 ? '' : 's')); }
    catch(err){ toast(err.message, true); }
    b.disabled = false;
  });
  const busy = (btn, on, label) => { btn.disabled = on; if (label) btn.innerHTML = label; };
  document.getElementById('st-save').onclick = async e => {
    const btn = e.currentTarget, label = btn.innerHTML;
    busy(btn, true, '<span class="mini-spin"></span>Saving…');
    try {
      renderParent(await call('apiAdminSettings', pin, document.getElementById('st-rem').value, document.getElementById('st-last').value), pin);
      toast('Reminder times saved');
    } catch(err){ toast(err.message, true); busy(btn, false, label); }
  };
  document.getElementById('ng-btn').onclick = async e => {
    const btn = e.currentTarget, label = btn.innerHTML;
    busy(btn, true, '<span class="mini-spin"></span>Creating…');
    try { renderParent(await call('apiAdminAddGroup', pin, document.getElementById('ng-name').value, document.getElementById('ng-email').value), pin); }
    catch(err){ toast(err.message, true); busy(btn, false, label); }
  };
  document.getElementById('nk-btn').onclick = async e => {
    const btn = e.currentTarget, label = btn.innerHTML;
    busy(btn, true, '<span class="mini-spin"></span>Adding…');
    try {
      renderParent(await call('apiAdminAddKid', pin, document.getElementById('nk-name').value, document.getElementById('nk-age').value,
        document.getElementById('nk-group').value, document.getElementById('nk-level').value), pin);
    } catch(err){ toast(err.message, true); busy(btn, false, label); }
  };
}

function girlCard(g, isAdmin){
  const s = g.stats;
  return `<div class="glass panel">
    <div class="row-flex between">
      <div class="row-flex">${petFace(g.pet, g.girl.color, g.girl.name)}
        <div><h2>${esc(g.girl.name)}</h2><span class="sub" style="font-size:13px">Level ${esc(g.girl.levelLabel)}${g.pet ? ' · ' + esc(g.pet.name) + ' the ' + STAGES[g.pet.stage - 1] : ''}${g.email ? ' · reminders on' : ''}</span></div></div>
      <span class="chip orange">${icon('star')} ${s.balance}</span>
    </div>
    <div class="row-flex mt-s" style="flex-wrap:wrap;gap:8px">
      ${g.levelTest ? `<span class="chip orange">${icon('target')} Level test pending</span>` : `<span class="chip purple">${s.weekDone}/${s.weekTotal} this week</span>`}
      ${isAdmin && g.pin ? `<span class="chip">${icon('key')} ${esc(g.pin)}</span>` : ''}
      <span class="chip">${icon('target')} ${s.avg == null ? '–' : s.avg + '%'}</span>
      <span class="chip">${icon('fire')} ${s.streak}</span>
      ${g.games ? `<span class="chip" title="Mini-games this week">${icon('game-controller')} ${g.games.weekRounds}${g.games.weekAvg != null ? ' · ' + g.games.weekAvg + '%' : ''}</span>` : ''}
      ${isAdmin && g.push ? `<span class="chip ${g.push.devices ? 'teal' : ''}">${icon('bell')} ${g.push.devices}</span>` : ''}
      ${isAdmin && g.push && g.push.devices ? `<button class="chip" style="cursor:pointer" data-testpush="${esc(g.girl.name)}">${icon('paper-plane-tilt')} Test</button>` : ''}
      <span class="chip">${s.total} tasks total</span>
    </div>
    <div class="strip">${g.week.map(w => {
      const st = w.beforeStart ? 'future' : w.done ? 'done' : w.isFuture ? 'future' : w.isToday ? 'pending' : 'missed';
      const v = w.done ? (w.section === 'level' ? (w.levelResult || '✓') : (w.percent !== '' ? w.percent + '%' : '✓')) : st === 'missed' ? '✕' : '';
      return `<div class="cell ${st}" title="${esc(w.title || w.label)}"><div>${w.day}</div><div>${icon((SEC[w.section] || SEC.grammar)[0], 'duotone')}</div><div class="v">${esc(v)}</div></div>`;
    }).join('')}</div>
    ${g.history.length > 1 ? `<div class="label mt">Weekly completion</div>
      <div class="hist">${g.history.map(h => `<div title="${fmtDate(h.week)}: ${h.done}/${h.expected}" style="height:${4 + Math.round(h.done / Math.max(1, h.expected) * 42)}px"></div>`).join('')}</div>
      <div class="row-flex" style="gap:6px;font-size:11px;color:var(--muted);font-weight:700">${g.history.map(h => `<span style="flex:1;text-align:center">${h.done}/${h.expected}</span>`).join('')}</div>` : ''}
    <details><summary>Recent activity ▾</summary>
      <div class="recent">${g.recent.length ? g.recent.map(r => `<div><span>${fmtDate(r.doneOn)}</span>
        <span><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></span>
        <b>${r.section === 'level' ? 'Level' : esc(r.correct) + '/' + esc(r.total)}</b><span>+${esc(r.points)}</span></div>`).join('') : '<div>No activity yet</div>'}</div>
    </details>
  </div>`;
}

boot();
</script>
</body>
