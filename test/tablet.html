<!doctype html>
<meta charset="utf-8">
<title>Tablet fit</title>
<style>
body{margin:0;background:#2b2b33;color:#eee;font:14px/1.45 system-ui,sans-serif;padding:12px}
.row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.box{overflow:hidden;border-radius:14px;background:#fff}
iframe{border:0;transform-origin:0 0}
b{display:block;margin:4px 0}
pre{white-space:pre-wrap;margin:12px 0 0}
</style>
<!-- The app on tablets (served by test/dev-server.js: http://localhost:8787/test/tablet.html?screen=today|journey|game|mission|parent|picker|signin|nest|nest-meet|nest-phrase|nest-find|nest-move|nest-say|nest-done|nest-all|nest-living|nest-living-night|nest-living-many|nest-living-pet[&phones]).
     Each frame is the page size the tablet script picks, scaled to the real screen and drawn at 0.42. -->
<div class="row" id="row"></div>
<pre id="out">Loading…</pre>
<script>
const PHONES = [[360, 640, 'Small phone'], [390, 844, 'iPhone'], [430, 932, 'Big phone']];
const TABLETS = [[768, 1024, 'iPad portrait'], [1024, 768, 'iPad landscape'], [820, 1180, 'iPad Air portrait'], [1180, 820, 'iPad Air landscape'], [800, 1280, 'Android tablet']];
const SIZES = new URLSearchParams(location.search).has('phones') ? PHONES : TABLETS;
const S = 0.42, screen = new URLSearchParams(location.search).get('screen') || 'today', out = document.getElementById('out');
const row = document.getElementById('row');
// The layout size the tablet script in Index.html picks (tabletFit): 520 px wide in portrait, 640 px tall in landscape.
const fitK = (w, h) => Math.max(1, Math.min(2, w > h ? h / 640 : w / 520));
const frames = SIZES.map(([w, h, label], i) => {
  const k = fitK(w, h), lw = Math.round(w / k), lh = Math.round(h / k);
  row.insertAdjacentHTML('beforeend', `<div><b>${label} ${w}x${h} (page ${lw}x${lh})</b><div class="box" style="width:${w * S}px;height:${h * S}px"><iframe id="f${i}" width="${lw}" height="${lh}" style="transform:scale(${S * k})"></iframe></div></div>`);
  return document.getElementById('f' + i);
});
async function ready(f){
  for (let i = 0; i < 80; i++) {
    try { if (f.contentWindow.eval('typeof renderDash') === 'function' && f.contentDocument.getElementById('app')) return; } catch(e){}
    await new Promise(r => setTimeout(r, 250));
  }
  throw new Error('the app did not open in ' + f.id);
}
async function show(f){
  const w = f.contentWindow, d = w.document, ev = s => w.eval(s);
  // nest-cheer freezes the right-answer moment half way instead of turning animations off.
  d.head.insertAdjacentHTML('beforeend', screen === 'nest-cheer' ? '<style>*,*::before,*::after{animation-play-state:paused!important;animation-delay:-.4s!important;transition:none!important}</style>' : '<style>*,*::before,*::after{animation:none!important;transition:none!important}</style>');
  if (screen === 'parent') await ev("parent('1234', false, false)");
  // picker: the kids of the family with "Not your family? Switch"; signin: the screen that button opens.
  else if (screen === 'picker') await ev("(async () => { pub = await call('apiPublic', ''); home(); })()");
  else if (screen === 'signin') await ev("(async () => { pub = await call('apiPublic', ''); home(); document.getElementById('swfam').click(); })()");
  // Coco's Nest: Mia, 4 (dev-server.js). nest = her home, nest-meet / nest-phrase / nest-find / nest-move / nest-say / nest-done = a session step.
  else if (screen.startsWith('nest')) {
    await ev("(async () => { await login('Mia', '5151', false, false); })()");
    await new Promise(r => setTimeout(r, 1500));
    // nest-all: Settings.NestAll on (every unit open) and one unit's days in the sheet.
    // nest-ground: the playground; nest-home2: the home with it; nest-cheer: a right answer, the third in a row (the party). Try-out kid, two units played.
    if (['nest-ground', 'nest-home2', 'nest-cheer'].includes(screen)) { ev("dash.nest.all = true; dash.nest.played = ['n01', 'n01.b', 'n02']; dash.nest.done = true; renderNest(dash)"); if (screen === 'nest-ground') ev('nestPlayground()'); }
    if (screen === 'nest-cheer') { ev('nestPlay = function(k, cb){}; window.setTimeout = (st => (f, t) => t >= 300 ? 0 : st(f, t))(window.setTimeout); nkPlayStart("find")'); ev('const b = document.querySelector("[data-nkopt]"); b.classList.add("yes"); NE.run = 2; nkCheer({})'); }
    // The living home (specs/nest-home.md): nest-living = day, no pet (Mia); -night = 21:00 with a pet; -many = 25 days and
    // seven units played, a pet, today done; -pet = a pet and a fruit unit met (the food to drag). &h=<hour>&m=<month> sets the clock.
    if (screen.startsWith('nest-living')) {
      const q = new URLSearchParams(location.search), v = screen.slice(12);
      w.nkClock = { h: Number(q.get('h') || (v === 'night' ? 21 : 10)), m: q.get('m') ? Number(q.get('m')) : undefined };
      if (v) ev("dash.pet = { id: 'fawn', name: 'Fern', stage: 2, xp: 300, wear: [], move: '' }");
      if (v === 'many') ev("dash.nest.days = 25; dash.nest.done = true; dash.nest.played = ['n01', 'n01.b', 'n02', 'n02.c', 'n03', 'n04', 'n05', 'r02', 'n06', 'n07']");
      if (v === 'pet' || v === 'night') ev("dash.nest.days = 3; dash.nest.played = ['n01', 'n07']");
      ev('dash.nest.home = true; renderNest(dash)');
    }
    if (screen === 'nest-all') ev('dash.nest.all = true; renderNest(dash);' + (location.search.includes('home') ? '' : ' nestDays(EQ_NEST.units[1])'));
    const step = ['nest-all', 'nest-ground', 'nest-home2', 'nest-cheer'].includes(screen) || screen.startsWith('nest-living') ? '' : screen.slice(5);
    if (step) { ev('nestPlay = function(k, cb){}'); ev('nestStart(dash.nest.today)'); ev("NE.si = Math.max(0, NE.steps.findIndex(x => x.t === '" + step + "')); nestRender(false)"); }
  }
  else {
    await ev("(async () => { await login('Aviv', '2694', false, false); clearInterval(homeTimer); clearInterval(petLifeT); })()");
    if (screen === 'journey') ev("dashTab = 'journey'; renderDash()");
    if (screen === 'game') await ev("startGame('match')");
    if (screen === 'mission') { await ev("loadMissions(MS_FILES['a2'])"); await ev("previewMission('a2g01', '')"); ev("MS.si = Math.min(4, MS.S.length - 1); MS.sub = {}; MS.guess = null; MS.drawn = -1; msRender()"); }
  }
  await new Promise(r => setTimeout(r, 1500));
  const app = d.getElementById('app');
  return f.id + ': app width ' + Math.round(app.getBoundingClientRect().width) + ' of ' + w.innerWidth + ', page scroll ' + (d.scrollingElement.scrollHeight - w.innerHeight);
}
(async () => {
  for (const f of frames) f.src = 'dev.html';
  const lines = [];
  for (const f of frames) { try { await ready(f); lines.push(await show(f)); } catch(e){ lines.push(f.id + ': ' + e.message); } }
  out.textContent = lines.join('\n');
})();
</script>
